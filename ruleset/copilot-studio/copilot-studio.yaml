topic: Copilot Studio
description: Good practices for Microsoft Copilot Studio agent development.
rules:
- id: CS-001
  title: Use a consistent naming convention that indicates the topic's category
  description: All topics must use a consistent naming convention that indicates the topic's category and purpose.
  guidelines:
  - text: Use a Verb-Noun structure for topic names that clearly describes the intent (e.g., Reset Password, Check Order Status).
    icon: icons/pencil.svg
  - text: Use a category prefix to group related topics (e.g., HR - Request Leave, IT - Reset Password, Sales - Get Quote).
    icon: icons/lightbulb.svg
  - text: Reserve a consistent suffix for sub-topics or dialogs (e.g., - Confirmation, - Error Handling).
    icon: icons/circle-alert.svg
  - text: Rename all topics immediately after creation - never leave default names like Topic 1 or Untitled.
    icon: icons/check.svg
  - text: Keep names concise but descriptive enough to identify the topic's purpose at a glance.
    icon: icons/code-xml.svg
  rationale:
  - text: Default names like Topic 1 provide no context and make it difficult to manage agents with many topics.
    icon: icons/pencil.svg
  - text: A Verb-Noun structure makes intent immediately clear when browsing the topic list.
    icon: icons/lightbulb.svg
  - text: Category prefixes enable quick filtering and grouping in the authoring canvas, especially in agents with dozens of topics.
    icon: icons/shield-alert.svg
  - text: Consistent naming reduces confusion when multiple makers collaborate on the same agent.
    icon: icons/check.svg
  examples:
    good:
    - title: HR - Request Leave - clear category and action
      text: 'Value: HR - Request Leave - clear category and action'
      icon: icons/workflow.svg
    - title: IT - Reset Password - grouped under IT, describes the intent
      text: 'Value: IT - Reset Password - grouped under IT, describes the intent'
      icon: icons/lightbulb.svg
    - title: Order - Check Status - grouped under Orders, specific action
      text: 'Value: Order - Check Status - grouped under Orders, specific action'
      icon: icons/check.svg
    - title: Order - Cancel Order - Confirmation - sub-topic clearly linked to parent
      text: 'Value: Order - Cancel Order - Confirmation - sub-topic clearly linked to parent'
      icon: icons/link.svg
    bad:
    - title: Topic 1 - default name, no context
      text: 'Value: Topic 1 - default name, no context'
      icon: icons/pencil.svg
    - title: Help - too vague, could match anything
      text: 'Value: Help - too vague, could match anything'
      icon: icons/circle-alert.svg
    - title: Password - no action described, unclear intent
      text: 'Value: Password - no action described, unclear intent'
      icon: icons/settings.svg
    - title: doStuff - meaningless and inconsistent format
      text: 'Value: doStuff - meaningless and inconsistent format'
      icon: icons/database.svg
  references:
  - title: Create and edit topics in Copilot Studio - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-create-edit-topics
  - title: Microsoft Copilot Studio implementation guidance - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/overview
- id: CS-002
  title: Design trigger phrases that are specific, varied, and non-overlapping across
  description: Design trigger phrases that are specific, varied, and non-overlapping across topics to ensure accurate intent matching.
  guidelines:
  - text: Provide at least 5–10 trigger phrases per topic, covering different ways a user might express the same intent.
    icon: icons/workflow.svg
  - text: Use specific and detailed phrases rather than single words or generic terms.
    icon: icons/lightbulb.svg
  - text: Avoid overlapping trigger phrases between topics - each phrase should clearly map to one topic only.
    icon: icons/circle-alert.svg
  - text: Regularly test trigger phrases using the Test bot pane to verify correct topic routing.
    icon: icons/check.svg
  - text: Review conversation analytics to identify misrouted queries and adjust trigger phrases accordingly.
    icon: icons/eye.svg
  rationale:
  - text: Too few trigger phrases reduce the agent's ability to recognize user intent, leading to unnecessary fallback responses.
    icon: icons/workflow.svg
  - text: Generic or single-word triggers (e.g., "help", "status") match too broadly and cause the wrong topic to fire.
    icon: icons/lightbulb.svg
  - text: Overlapping phrases between topics create ambiguity that degrades the conversational experience.
    icon: icons/check.svg
  - text: Testing and analytics reveal real-world phrasing that users employ, helping you refine triggers over time.
    icon: icons/users.svg
  examples:
    good:
    - title: '"I need to reset my password"'
      text: 'Value: "I need to reset my password"'
      icon: icons/lightbulb.svg
    - title: '"How do I change my password?"'
      text: 'Value: "How do I change my password?"'
      icon: icons/check.svg
    - title: '"My password expired, what do I do?"'
      text: 'Value: "My password expired, what do I do?"'
      icon: icons/circle-alert.svg
    - title: '"I forgot my password"'
      text: 'Value: "I forgot my password"'
      icon: icons/settings.svg
    - title: '"Can you help me reset my login credentials?"'
      text: 'Value: "Can you help me reset my login credentials?"'
      icon: icons/workflow.svg
    - title: '"Password reset request"'
      text: 'Value: "Password reset request"'
      icon: icons/database.svg
    - title: Compliant code example
      code: |-
        // Topic: IT - Reset Password
        Trigger phrases:
        - "I need to reset my password"
        - "How do I change my password?"
        - "My password expired, what do I do?"
        - "I forgot my password"
        - "Can you help me reset my login credentials?"
        - "Password reset request"
      language: Plain Text
    bad:
    - title: '"password" // Too vague, overlaps with other password-related topics'
      text: 'Value: "password" // Too vague, overlaps with other password-related topics'
      icon: icons/link.svg
    - title: '"help" // Matches almost anything'
      text: 'Value: "help" // Matches almost anything'
      icon: icons/package.svg
    - title: '"reset" // Could apply to many unrelated topics'
      text: 'Value: "reset" // Could apply to many unrelated topics'
      icon: icons/users.svg
    - title: '"I forgot my password" // Same phrase already in Reset Password topic'
      text: 'Value: "I forgot my password" // Same phrase already in Reset Password topic'
      icon: icons/book-open.svg
    - title: "\"Can't log in\" // Ambiguous, could be either topic"
      text: "Value: \"Can't log in\" // Ambiguous, could be either topic"
      icon: icons/file-text.svg
    - title: Non-compliant code example
      code: |-
        // Topic: IT - Reset Password
        Trigger phrases:
        - "password"          // Too vague, overlaps with other password-related topics
        - "help"              // Matches almost anything
        - "reset"             // Could apply to many unrelated topics

        // Topic: IT - Unlock Account (overlapping triggers)
        Trigger phrases:
        - "I forgot my password"   // Same phrase already in Reset Password topic
        - "Can't log in"           // Ambiguous, could be either topic
      language: Plain Text
  references:
  - title: Best practices for topic trigger phrases - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/trigger-phrases-best-practices
  - title: Analyze bot performance - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-overview
- id: CS-003
  title: Customize the fallback and error system topics to provide a helpful experience
  description: Customize the fallback and error system topics to provide a helpful experience when the agent cannot understand or process a user request.
  guidelines:
  - text: Customize the Fallback system topic with a friendly message that acknowledges the misunderstanding and suggests alternative actions or topics.
    icon: icons/workflow.svg
  - text: After two or three consecutive fallback triggers, offer to escalate the user to a human agent or provide a support contact.
    icon: icons/users.svg
  - text: Customize the Error system topic to display a clear, non-technical message when a system error occurs.
    icon: icons/circle-alert.svg
  - text: Log errors to a data source (e.g., Dataverse or SharePoint) using Power Automate for troubleshooting and trend analysis.
    icon: icons/database.svg
  - text: Use multiple message variations in fallback responses to avoid repetition fatigue.
    icon: icons/lightbulb.svg
  rationale:
  - text: The default fallback message is generic and does not guide users toward resolution, leading to frustration and abandonment.
    icon: icons/users.svg
  - text: Infinite fallback loops without an escalation path trap users in a dead-end conversation, damaging trust in the agent.
    icon: icons/lightbulb.svg
  - text: Technical error messages confuse non-technical users and expose implementation details that could be a security concern.
    icon: icons/shield-alert.svg
  - text: Error logging enables proactive identification of recurring issues and drives continuous improvement.
    icon: icons/circle-alert.svg
  examples:
    good:
    - title: Check your order status
      text: 'Value: Check your order status'
      icon: icons/check.svg
    - title: Reset your password
      text: 'Value: Reset your password'
      icon: icons/lightbulb.svg
    - title: Contact support"
      text: 'Value: Contact support"'
      icon: icons/circle-alert.svg
    - title: Compliant code example
      code: |-
        // Fallback topic — first attempt
        "I'm sorry, I didn't quite catch that. Could you try rephrasing your question?
        Here are some things I can help with:
        - Check your order status
        - Reset your password
        - Contact support"

        // Fallback topic — after 2 failed attempts
        "It looks like I'm having trouble understanding your request.
        Would you like me to connect you with a support agent?"

        // Error topic
        "Something went wrong on my end. Please try again in a moment.
        If the issue continues, contact support at support@contoso.com."
      language: Plain Text
    bad:
    - title: Non-compliant code example
      code: |-
        // Default fallback with no guidance
        "I didn't understand that."

        // Infinite loop with no escalation
        "Sorry, I don't know that. Please try again."
        // (repeated indefinitely with no alternative path)

        // Technical error exposed to user
        "Error: HTTP 500 — Internal Server Error in flow Run_GetOrderDetails."
      language: Plain Text
  references:
  - title: Configure the fallback topic - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-system-fallback-topic
  - title: Manage system topics - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-system-topics
- id: CS-004
  title: Configure knowledge sources carefully and apply appropriate guardrails when
  description: Configure knowledge sources carefully and apply appropriate guardrails when enabling generative answers.
  guidelines:
  - text: Ensure knowledge source documents are well-structured with clear headings, bullet points, and concise paragraphs to maximize extraction quality.
    icon: icons/workflow.svg
  - text: Keep knowledge sources up to date - schedule regular reviews to remove outdated or inaccurate content.
    icon: icons/eye.svg
  - text: Restrict the scope of generative answers to your approved knowledge sources rather than allowing the agent to answer from general knowledge.
    icon: icons/lightbulb.svg
  - text: Add a disclaimer to generative responses in sensitive or regulated domains (e.g., legal, medical, financial) to indicate that the answer is AI-generated.
    icon: icons/shield-alert.svg
  - text: Review the conversation transcripts regularly to identify cases where generative answers were inaccurate or off-topic, and update the knowledge sources accordingly.
    icon: icons/code-xml.svg
  rationale:
  - text: Poorly structured documents produce fragmented or inaccurate generative responses because the AI cannot reliably extract coherent answers.
    icon: icons/file-text.svg
  - text: Outdated knowledge sources lead to incorrect answers that erode user trust and can cause business harm.
    icon: icons/users.svg
  - text: Unrestricted generative answers increase the risk of hallucinated or off-topic responses that do not reflect your organization's information.
    icon: icons/circle-alert.svg
  - text: Disclaimers manage user expectations and provide legal protection in regulated industries.
    icon: icons/lightbulb.svg
  - text: Continuous review closes the feedback loop, ensuring the agent improves over time.
    icon: icons/eye.svg
  examples:
    good:
    - title: Knowledge sources use clear Markdown headings and short paragraphs optimized
      text: Knowledge sources use clear Markdown headings and short paragraphs optimized for AI extraction.
      icon: icons/workflow.svg
    - title: Generative answers are scoped to an internal SharePoint site and a curated FAQ
      text: Generative answers are scoped to an internal SharePoint site and a curated FAQ document.
      icon: icons/file-text.svg
    - title: A disclaimer is appended
      text: 'Value: A disclaimer is appended "This answer was generated from our knowledge base. Please verify with official documentation."'
      icon: icons/link.svg
    - title: Monthly reviews of conversation transcripts identify two new frequently asked
      text: Monthly reviews of conversation transcripts identify two new frequently asked questions that are added to the FAQ.
      icon: icons/code-xml.svg
    bad:
    - title: A 200-page unstructured PDF is uploaded as a knowledge source, producing
      text: A 200-page unstructured PDF is uploaded as a knowledge source, producing unreliable generative answers.
      icon: icons/lightbulb.svg
    - title: Knowledge source documents have not been updated in over a year, and the agent
      text: Knowledge source documents have not been updated in over a year, and the agent gives outdated policy information.
      icon: icons/check.svg
    - title: Generative answers are enabled without scope restrictions, causing the agent to
      text: Generative answers are enabled without scope restrictions, causing the agent to answer questions outside its domain with fabricated information.
      icon: icons/circle-alert.svg
    - title: No disclaimer is provided for AI-generated legal or compliance guidance.
      text: No disclaimer is provided for AI-generated legal or compliance guidance.
      icon: icons/settings.svg
  references:
  - title: Use knowledge sources for generative answers - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/nlu-boost-conversations
  - title: Manage knowledge sources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/manage-knowledge-sources
- id: CS-005
  title: Enable end-user authentication and follow security best practices when
  description: Enable end-user authentication and follow security best practices when connecting your agent to external systems and data.
  guidelines:
  - text: Enable user authentication in the agent settings and require users to sign in before accessing sensitive data or performing actions.
    icon: icons/shield-alert.svg
  - text: Use Microsoft Entra ID (Azure AD) with Single Sign-On (SSO) for agents deployed in Microsoft Teams or organizational channels.
    icon: icons/users.svg
  - text: Use the on-behalf-of authentication flow when calling APIs or Power Automate flows so that actions execute under the authenticated user's identity.
    icon: icons/workflow.svg
  - text: Never hard-code credentials, API keys, or secrets in topics or flows - store them in Azure Key Vault or environment variables.
    icon: icons/code-xml.svg
  - text: Apply the principle of least privilege when configuring connector permissions and API access for the agent.
    icon: icons/book-open.svg
  rationale:
  - text: Without authentication, the agent cannot identify the user, making personalized responses and secure data access impossible.
    icon: icons/shield-alert.svg
  - text: SSO provides a seamless experience for users in Teams and eliminates the need for separate login prompts.
    icon: icons/users.svg
  - text: On-behalf-of flows ensure that data access respects the user's own permissions, preventing privilege escalation.
    icon: icons/database.svg
  - text: Hard-coded secrets can be exposed through solution exports, version history, or accidental sharing, creating a security vulnerability.
    icon: icons/code-xml.svg
  - text: Overly permissive connections increase the blast radius if the agent or its connections are compromised.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Authentication is enabled with Microsoft Entra ID; users sign in via SSO when
      text: Authentication is enabled with Microsoft Entra ID; users sign in via SSO when they open the agent in Teams.
      icon: icons/shield-alert.svg
    - title: A Power Automate flow retrieves the user's pending approvals using the
      text: A Power Automate flow retrieves the user's pending approvals using the authenticated user's token, so each user only sees their own data.
      icon: icons/database.svg
    - title: API keys for a third-party service are stored in Azure Key Vault and referenced
      text: API keys for a third-party service are stored in Azure Key Vault and referenced via environment variables in the solution.
      icon: icons/link.svg
    bad:
    - title: The agent is published without authentication, allowing anonymous users to
      text: The agent is published without authentication, allowing anonymous users to access internal HR data.
      icon: icons/users.svg
    - title: A Power Automate flow runs under a service account with global admin
      text: A Power Automate flow runs under a service account with global admin permissions to retrieve employee records, ignoring individual user permissions.
      icon: icons/workflow.svg
    - title: An API key is pasted directly into a topic's HTTP request action and is visible
      text: An API key is pasted directly into a topic's HTTP request action and is visible in the solution export.
      icon: icons/package.svg
  references:
  - title: Configure user authentication in Copilot Studio - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configuration-end-user-authentication
  - title: Configure single sign-on for Copilot Studio - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/configure-sso
- id: CS-006
  title: Use solution-based development and environment separation to manage your agent
  description: Use solution-based development and environment separation to manage your agent through development, testing, and production stages.
  guidelines:
  - text: Develop agents inside a managed solution - never build directly in the default environment or outside a solution.
    icon: icons/circle-alert.svg
  - text: 'Maintain at least three environments: Development, Test/UAT, and Production.'
    icon: icons/check.svg
  - text: Use Azure DevOps or GitHub Actions pipelines to automate solution export, import, and deployment across environments.
    icon: icons/workflow.svg
  - text: Increment the solution version with every deployment so that changes are traceable and rollbacks are possible.
    icon: icons/package.svg
  - text: Use environment variables for configuration values that differ between environments (e.g., URLs, connection references, feature flags).
    icon: icons/link.svg
  rationale:
  - text: Building outside a solution makes it impossible to reliably move agents between environments, leading to manual and error-prone deployments.
    icon: icons/circle-alert.svg
  - text: Environment separation prevents untested changes from reaching end users and protects production stability.
    icon: icons/users.svg
  - text: Automated pipelines reduce human error in the deployment process and provide an auditable deployment history.
    icon: icons/database.svg
  - text: Solution versioning enables rollback to a known-good state if a deployment introduces issues.
    icon: icons/package.svg
  - text: Hard-coded environment-specific values break when a solution is imported into a different environment.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: The agent and all its dependencies (topics, flows, connection references
      text: The agent and all its dependencies (topics, flows, connection references, environment variables) are packaged in a solution named ContosoITHelpDesk.
      icon: icons/pencil.svg
    - title: A GitHub Actions pipeline exports the solution from Dev, imports it into Test
      text: A GitHub Actions pipeline exports the solution from Dev, imports it into Test, and after approval, promotes it to Production.
      icon: icons/workflow.svg
    - title: Environment variables evServiceNowUrl and evApprovalEmailGroup are configured
      text: Environment variables evServiceNowUrl and evApprovalEmailGroup are configured per environment.
      icon: icons/link.svg
    bad:
    - title: The agent is built in the default environment with no solution, and topics are
      text: The agent is built in the default environment with no solution, and topics are manually recreated in production.
      icon: icons/package.svg
    - title: Changes are tested in production because there is only one environment.
      text: Changes are tested in production because there is only one environment.
      icon: icons/check.svg
    - title: A flow contains a hard-coded URL https
      text: 'Value: A flow contains a hard-coded URL https //dev-api.contoso.com that fails when imported to the production environment.'
      icon: icons/code-xml.svg
  references:
  - title: Export and import agents using solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-export-import-bots
  - title: Application lifecycle management with Power Platform - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/overview-alm
- id: CS-007
  title: Establish a thorough testing strategy and use built-in analytics to continuously
  description: Establish a thorough testing strategy and use built-in analytics to continuously improve your agent's performance.
  guidelines:
  - text: Use the Test bot pane during development to verify every topic's conversation path, including branching and error scenarios.
    icon: icons/check.svg
  - text: Create a test script that covers all topics, edge cases, and expected fallback scenarios, and run it before every deployment.
    icon: icons/code-xml.svg
  - text: Monitor the Analytics dashboard regularly to track resolution rate, escalation rate, abandonment rate, and customer satisfaction (CSAT).
    icon: icons/workflow.svg
  - text: Review conversation transcripts weekly to identify misunderstood intents, missing topics, and areas for improvement.
    icon: icons/eye.svg
  - text: Set up alerts or dashboards for critical metrics (e.g., sudden increase in fallback rate or error rate) to catch regressions early.
    icon: icons/circle-alert.svg
  rationale:
  - text: Untested conversation paths lead to broken experiences that users encounter in production, damaging trust and increasing support costs.
    icon: icons/users.svg
  - text: A structured test script ensures consistent coverage and prevents regressions when topics are added or modified.
    icon: icons/code-xml.svg
  - text: Analytics provide data-driven insight into how users interact with the agent and where the experience breaks down.
    icon: icons/database.svg
  - text: Transcript reviews reveal real user language and uncover gaps that analytics alone cannot surface.
    icon: icons/eye.svg
  - text: Proactive monitoring catches issues before they affect a large number of users.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: A test script documents 50+ test scenarios, including happy paths, edge cases
      text: A test script documents 50+ test scenarios, including happy paths, edge cases, and fallback triggers, and is executed before every release.
      icon: icons/workflow.svg
    - title: The analytics dashboard is reviewed weekly; a drop in resolution rate from 85%
      text: The analytics dashboard is reviewed weekly; a drop in resolution rate from 85% to 70% triggers an investigation and topic updates.
      icon: icons/package.svg
    - title: Conversation transcripts reveal that users frequently ask about "PTO balance"
      text: Conversation transcripts reveal that users frequently ask about "PTO balance" but no topic exists - a new topic is created.
      icon: icons/users.svg
    bad:
    - title: Topics are published without testing; users discover that a critical branch
      text: Topics are published without testing; users discover that a critical branch leads to a dead end.
      icon: icons/check.svg
    - title: Analytics are never reviewed; the agent's fallback rate has been 40% for months
      text: Analytics are never reviewed; the agent's fallback rate has been 40% for months without anyone noticing.
      icon: icons/circle-alert.svg
    - title: Conversation transcripts are enabled but never read, missing opportunities to
      text: Conversation transcripts are enabled but never read, missing opportunities to improve the agent.
      icon: icons/code-xml.svg
  references:
  - title: Test your agent - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-test-bot
  - title: Analyze agent performance - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-overview
  - title: Export conversation transcripts - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-sessions-transcripts
- id: CS-008
  title: Plan your deployment channels carefully and design the conversational experience
  description: Plan your deployment channels carefully and design the conversational experience to match each channel's capabilities.
  guidelines:
  - text: Identify and prioritize the target channels (Microsoft Teams, web chat, mobile, custom) before designing the conversation flow.
    icon: icons/workflow.svg
  - text: Test the agent on every target channel before going live - message formatting, adaptive cards, and authentication behave differently across channels.
    icon: icons/shield-alert.svg
  - text: Write a clear and helpful greeting message that sets expectations about what the agent can do.
    icon: icons/lightbulb.svg
  - text: Use quick replies and suggested actions to guide users through common paths and reduce free-text input.
    icon: icons/users.svg
  - text: Keep messages concise - avoid walls of text, and split long responses across multiple messages when necessary.
    icon: icons/circle-alert.svg
  rationale:
  - text: Conversation flows designed for web chat may not render correctly in Teams or other channels due to differences in card support, message length, and authentication.
    icon: icons/shield-alert.svg
  - text: Testing on the actual channel prevents formatting issues, broken links, or authentication failures from reaching production users.
    icon: icons/link.svg
  - text: A well-crafted greeting reduces fallback rates by immediately telling users what the agent can help with.
    icon: icons/users.svg
  - text: Quick replies and suggested actions lower the barrier to interaction and reduce the chance of misunderstood free-text input.
    icon: icons/workflow.svg
  - text: Long, unbroken messages are difficult to read in chat interfaces and lead to users skipping important information.
    icon: icons/book-open.svg
  examples:
    good:
    - title: "\U0001F511 Password resets"
      text: "Value: \U0001F511 Password resets"
      icon: icons/lightbulb.svg
    - title: "\U0001F4BB Software requests"
      text: "Value: \U0001F4BB Software requests"
      icon: icons/check.svg
    - title: "\U0001F3AB Ticket status"
      text: "Value: \U0001F3AB Ticket status"
      icon: icons/circle-alert.svg
    - title: Compliant code example
      code: |-
        // Greeting message
        "Hi! I'm the Contoso IT Help Desk assistant. I can help you with:
        - 🔑 Password resets
        - 💻 Software requests
        - 🎫 Ticket status

        What would you like help with?"

        // Suggested actions after a response
        [Reset Password] [Check Ticket Status] [Talk to an Agent]
      language: Plain Text
    bad:
    - title: Non-compliant code example
      code: |-
        // No greeting — agent starts silently and waits for input
        (blank)

        // Wall of text with no formatting or guidance
        "Welcome to the Contoso IT support bot. This bot can help you with password resets,
        software installation requests, hardware requests, VPN issues, email configuration,
        printer setup, account unlocking, MFA enrollment, and many other IT-related tasks.
        Please type your question below and we will try to help you as best we can.
        If we cannot help you, we will transfer you to an agent."
      language: Plain Text
  references:
  - title: Publish your agent to multiple channels - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/publication-fundamentals-publish-channels
  - title: Configure the greeting topic - Microsoft Learn
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-system-topics
- id: CS-009
  title: Apply responsible AI principles and configure content moderation to ensure your
  description: Apply responsible AI principles and configure content moderation to ensure your agent produces safe, accurate, and appropriate responses.
  guidelines:
  - text: Enable content moderation to filter harmful, offensive, or inappropriate content from both user inputs and agent responses.
    icon: icons/users.svg
  - text: Define clear behavioral guardrails by configuring the agent's system message to specify what the agent should and should not discuss.
    icon: icons/lightbulb.svg
  - text: Avoid having the agent provide advice on high-risk topics (e.g., medical diagnosis, legal counsel, financial advice) without explicit disclaimers and links to qualified professionals.
    icon: icons/link.svg
  - text: Regularly audit agent responses through transcript reviews to identify instances of inaccurate, biased, or inappropriate content.
    icon: icons/code-xml.svg
  - text: Include a feedback mechanism (e.g., thumbs up/down) so users can flag problematic responses.
    icon: icons/check.svg
  rationale:
  - text: Without content moderation, the agent may generate or repeat harmful content, exposing the organization to reputational and legal risk.
    icon: icons/circle-alert.svg
  - text: Behavioral guardrails prevent the agent from going off-topic or providing responses outside its intended scope.
    icon: icons/lightbulb.svg
  - text: AI-generated advice on regulated topics can cause real harm if users act on inaccurate information without consulting a professional.
    icon: icons/users.svg
  - text: Regular audits catch issues that automated filters miss and ensure the agent meets organizational standards over time.
    icon: icons/check.svg
  - text: User feedback provides a direct signal about response quality and helps prioritize improvements.
    icon: icons/settings.svg
