- id: PA-012
  title: Be created inside solutions and should not be created as non-solution flows
  description: All cloud flows must be created inside solutions and should not be created as non-solution flows or personal My Flows.
  guidelines:
  - text: Create all flows within a managed or unmanaged solution.
    icon: icons/workflow.svg
  - text: Use a consistent solution publisher prefix.
    icon: icons/pencil.svg
  - text: Keep related components such as connection references, environment variables, and child flows in the same solution.
    icon: icons/link.svg
  rationale:
  - text: Solution-aware flows can be exported and imported across environments, enabling proper ALM.
    icon: icons/workflow.svg
  - text: Non-solution flows are difficult to migrate between environments and are tied to the creator's account.
    icon: icons/package.svg
  - text: Solution-aware flows support connection references, which decouple flows from specific user connections.
    icon: icons/link.svg
  - text: Solutions enable version control, change tracking, and managed deployments through pipelines.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Creating a flow inside the Orders Management solution alongside its related
      text: Creating a flow inside the Orders Management solution alongside its related tables, connection references, and environment variables.
      icon: icons/database.svg
    - title: csp
      text: 'csp Uses a consistent solution publisher prefix and groups related flows in one solution.'
      icon: icons/pencil.svg
    bad:
    - title: Creating a flow from the My Flows section of the Power Automate portal.
      text: Creating a flow from the My Flows section of the Power Automate portal.
      icon: icons/workflow.svg
    - title: Having related flows scattered across multiple solutions with no clear
      text: Having related flows scattered across multiple solutions with no clear organization.
      icon: icons/package.svg
    - title: Creating flows outside of solutions and manually recreating them in each
      text: Creating flows outside of solutions and manually recreating them in each environment.
      icon: icons/lightbulb.svg
  references:
  - title: Microsoft Learn - Solutions Overview
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/solutions-overview
- id: PA-013
  title: Specify the columns that should trigger the flow and include filter expressions
  description: Dataverse triggers must specify the columns that should trigger the flow and include filter expressions that limit triggering events to the intended business scenario.
  guidelines:
  - text: In the trigger's Column filter property, specify only the columns that should cause the flow to run.
    icon: icons/database.svg
  - text: Never leave the Column filter empty when only specific field changes are relevant.
    icon: icons/circle-alert.svg
  - text: In the trigger's Filter rows property, add OData conditions that limit when the flow fires.
    icon: icons/workflow.svg
  - text: Use column filters and row filters together so the flow only runs when relevant data changes meet the expected criteria.
    icon: icons/lightbulb.svg
  rationale:
  - text: Without a column filter, the flow triggers on every update, including irrelevant field changes, which wastes runs and API calls.
    icon: icons/database.svg
  - text: Trigger-level filter expressions prevent the flow from running when data changes do not match the business scenario.
    icon: icons/workflow.svg
  - text: Properly filtered triggers improve environment performance and reduce the risk of hitting execution limits.
    icon: icons/circle-alert.svg
  - text: Explicit trigger configuration makes intended behavior easier to understand and maintain.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Column filter set to statuscode and filter expression statuscode eq 5 so the
      text: Column filter set to statuscode and filter expression statuscode eq 5 so the flow only triggers when Status Reason changes to Approved.
      icon: icons/database.svg
    - title: Column filter set to emailaddress1,telephone1 so the flow only triggers when
      text: Column filter set to emailaddress1,telephone1 so the flow only triggers when the primary email or phone number changes.
      icon: icons/workflow.svg
    - title: Column filter set to csp_review_status and filter expression csp_review_status
      text: Column filter set to csp_review_status and filter expression csp_review_status eq 100000001 so the flow only triggers when review status changes to Complete.
      icon: icons/eye.svg
    bad:
    - title: No column filter set, so the flow triggers on every field update including
      text: No column filter set, so the flow triggers on every field update including system fields such as modifiedon.
      icon: icons/lightbulb.svg
    - title: No filter expression, so the flow triggers for all status values instead of
      text: No filter expression, so the flow triggers for all status values instead of just the required business state.
      icon: icons/check.svg
    - title: Using a Condition action inside the flow to check field values instead of
      text: Using a Condition action inside the flow to check field values instead of filtering at the trigger level, which wastes a flow run for every non-matching event.
      icon: icons/circle-alert.svg
  references:
  - title: Microsoft Learn - Dataverse Connector Triggers
    url: https://learn.microsoft.com/en-us/connectors/commondataserviceforapps/#triggers
  - title: Microsoft Learn - Limits of Triggers in Dataverse
    url: https://learn.microsoft.com/en-us/power-automate/dataverse/trigger-limits
- id: PA-014
  title: When querying Dataverse, retrieve only the columns and rows required by the flow
  description: When querying Dataverse, retrieve only the columns and rows required by the flow to improve performance and reduce API consumption.
  guidelines:
  - text: Use Select columns or FetchXML attribute elements to retrieve only the fields the flow needs.
    icon: icons/database.svg
  - text: Never retrieve all columns.
    icon: icons/circle-alert.svg
  - text: When using FetchXML, set the count attribute on the fetch element to limit the number of rows per page.
    icon: icons/lightbulb.svg
  - text: Add filter elements in FetchXML or OData filter expressions to restrict rows to only those needed by the flow.
    icon: icons/workflow.svg
  - text: Never use List Rows or FetchXML queries without a filter that constrains the result set.
    icon: icons/check.svg
  rationale:
  - text: Retrieving all columns increases payload size, slows the flow, and consumes more API throughput capacity.
    icon: icons/database.svg
  - text: Without a row count limit, large tables can return thousands of rows and cause timeouts or API limit issues.
    icon: icons/lightbulb.svg
  - text: Filters reduce load on Dataverse, improving performance for both the flow and other users in the environment.
    icon: icons/workflow.svg
  - text: Optimized queries reduce API request consumption and help stay within daily Power Platform request limits.
    icon: icons/check.svg
  examples:
    good:
    - title: FetchXML with selected attributes, a count limit, and a filter.
      code: |
        <fetch count="50">
          <entity name="contact">
            <attribute name="fullname" />
            <attribute name="emailaddress1" />
            <filter>
              <condition attribute="statuscode" operator="eq" value="1" />
            </filter>
          </entity>
        </fetch>
      language: XML
    - title: List Rows action configured with selected columns, a filter, and a row count.
      code: |
        Select columns: fullname,emailaddress1
        Filter rows: statuscode eq 1
        Row count: 50
    bad:
    - title: Using List Rows with no column selection, which retrieves all columns for every
      text: Using List Rows with no column selection, which retrieves all columns for every row.
      icon: icons/database.svg
    - title: Using FetchXML without a count attribute, which retrieves all matching rows
      text: Using FetchXML without a count attribute, which retrieves all matching rows without pagination.
      icon: icons/lightbulb.svg
    - title: Applying no filter, which retrieves the entire table regardless of how many
      text: Applying no filter, which retrieves the entire table regardless of how many rows are needed.
      icon: icons/check.svg
    - title: Using <all-attributes /> in FetchXML instead of specifying individual attribute
      text: Using <all-attributes /> in FetchXML instead of specifying individual attribute elements.
      icon: icons/circle-alert.svg
  references:
  - title: Microsoft Learn - Query Data Using FetchXML
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/use-fetchxml-construct-query
  - title: Microsoft Learn - Optimize Performance for Dataverse
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/optimize-performance


