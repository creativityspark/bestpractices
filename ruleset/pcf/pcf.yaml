- id: PCF-013
  title: Make PCF controls easy to debug during development and after deployment.
  description: Make PCF controls easy to debug during development and after deployment. Use the local test harness during implementation, and use tools such as Fiddler or Requestly when troubleshooting deployed controls in Dataverse.
  guidelines:
  - text: Use npm start or npm start watch to run the browser test harness while developing the control.
    icon: icons/check.svg
  - text: Use the test harness to exercise input properties, mock data, form factors, and container sizes before deploying.
    icon: icons/database.svg
  - text: When an issue only reproduces after deployment, use tools such as Fiddler or Requestly to redirect the deployed control to your local build for debugging.
    icon: icons/package.svg
  - text: Use browser developer tools together with these debugging flows to inspect DOM, network requests, and runtime errors.
    icon: icons/workflow.svg
  rationale:
  - text: The local test harness shortens the feedback loop and makes it easier to validate behavior without repeatedly packaging and deploying the control.
    icon: icons/check.svg
  - text: Some scenarios only surface in Dataverse after deployment, especially when the control depends on host-specific behavior, feature usage, or real data flows.
    icon: icons/database.svg
  - text: Redirecting deployed requests to a local build with Fiddler or Requestly allows you to diagnose real-environment issues without manually rebuilding and reimporting for every change.
    icon: icons/package.svg
  examples:
    good:
    - title: Run the control locally with the test harness.
      text: Run the control locally with the test harness.
      icon: icons/check.svg
    - title: Reproduce environment-specific issues in Dataverse.
      text: Reproduce environment-specific issues in Dataverse.
      icon: icons/database.svg
    - title: Use Fiddler or Requestly to map the deployed bundle request to the local build
      text: Use Fiddler or Requestly to map the deployed bundle request to the local build output.
      icon: icons/package.svg
    - title: Inspect the behavior with browser developer tools.
      text: Inspect the behavior with browser developer tools.
      icon: icons/lightbulb.svg
    - title: Compliant code example
      code: npm start watch
      language: shell
    - title: Compliant code example
      code: |-
        1. Run the control locally with the test harness.
        2. Reproduce environment-specific issues in Dataverse.
        3. Use Fiddler or Requestly to map the deployed bundle request to the local build output.
        4. Inspect the behavior with browser developer tools.
      language: text
    bad:
    - title: Non-compliant code example
      code: Deploy every small change to Dataverse and debug only there, without using the test harness.
      language: text
    - title: Non-compliant code example
      code: Ignore tools like Fiddler or Requestly and treat deployed-only issues as impossible to debug locally.
      language: text
  references:
  - title: Debug code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/debugging-custom-controls#debugging-after-deploying-into-microsoft-dataverse
  - title: Create your first component - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/implementing-controls-using-typescript
- id: PCF-014
  title: Always provide unit tests with PCF controls.
  description: Always provide unit tests with PCF controls. Changes to a control must include automated tests that protect the component against regressions.
  guidelines:
  - text: Add unit tests for the control's rendering logic, behaviors, validation rules, and output generation.
    icon: icons/check.svg
  - text: Run the unit test suite as part of local development and CI before packaging or deploying the control.
    icon: icons/package.svg
  - text: Add regression tests whenever fixing a defect so the same issue cannot be reintroduced silently.
    icon: icons/circle-alert.svg
  - text: Prefer tests that exercise real browser DOM behavior where possible, instead of relying only on shallow mocks.
    icon: icons/lightbulb.svg
  rationale:
  - text: PCF controls evolve over time, and without unit tests it is easy for small changes to break rendering, validation, or output behavior.
    icon: icons/check.svg
  - text: Automated tests give fast feedback and reduce the cost of refactoring or extending existing controls.
    icon: icons/lightbulb.svg
  - text: Regression tests preserve previously fixed behavior and make code reviews more reliable because reviewers can see that expected scenarios are covered.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        {
          "scripts": {
            "test": "karma start karma.conf.js --browsers=FirefoxHeadless --single-run"
          }
        }
      language: json
    - title: Compliant code example
      code: |-
        it("shows the validation message when submit is called with no file selected", () => {
            const control = new fileUpload(context, htmlDivElement, () => {});
            control.generate();
            control.submit();

            const information = document.getElementById(controls.information);
            expect(information?.style.display).to.equal("block");
        });
      language: typescript
    bad:
    - title: Non-compliant code example
      code: Ship a PCF control with no automated tests and rely only on manual verification in the test harness.
      language: text
    - title: Non-compliant code example
      code: |-
        // Fixing a bug without adding a regression test for the broken scenario
        public submit(): void {
            this._notifyOutputChanged();
        }
      language: typescript
  references:
  - title: Creating Better PCF Component Part 2
    url: https://temmyraharjo.wordpress.com/2020/11/23/creating-better-pcf-component-part-2/
  - title: Debug code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/debugging-custom-controls

