topic: PCF Controls
description: Good practices for Power Apps Component Framework (PCF) code components.
rules:
- id: PCF-001
  title: Always deploy production builds of code components to Dataverse.
  description: Always deploy production builds of code components to Dataverse. Never deploy development builds to non-development environments.
  guidelines:
  - text: Build code components using npm run build -- --buildMode production or msbuild /p:configuration=Release before deploying.
    icon: icons/code-xml.svg
  - text: Development builds include unminified code, source maps, and debugging aids that increase bundle size significantly.
    icon: icons/lightbulb.svg
  - text: Set up an automated build pipeline to ensure production builds are always used for deployment.
    icon: icons/workflow.svg
  rationale:
  - text: Development builds are significantly larger than production builds and adversely affect load times and overall performance.
    icon: icons/lightbulb.svg
  - text: Large development bundles may be blocked from deployment due to exceeding size limits.
    icon: icons/package.svg
  - text: Production builds apply minification, tree-shaking, and other optimizations that are essential for a good end-user experience.
    icon: icons/users.svg
  examples:
    good:
    - title: Compliant code example
      code: npm run build -- --buildMode production
      language: shell
    - title: Compliant code example
      code: msbuild /p:configuration=Release
      language: shell
    bad:
    - title: script
      text: 'Value: script npm run build'
      icon: icons/code-xml.svg
    - title: Non-compliant code example
      code: |-
        npm run build
        # Then importing the solution without switching to production mode
      language: shell
    - title: Non-compliant code example
      code: |-
        # Missing --buildMode production flag
        - script: npm run build
      language: yaml
  references:
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
  - title: Debugging custom controls - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/debugging-custom-controls
- id: PCF-002
  title: Always clean up resources inside the destroy method.
  description: Always clean up resources inside the destroy method. Remove event listeners, close WebSockets, and unmount React components to prevent memory leaks.
  guidelines:
  - text: Use the destroy method to close any open WebSocket connections.
    icon: icons/lightbulb.svg
  - text: Remove event listeners that were added to elements outside the container element.
    icon: icons/check.svg
  - text: If using React, call ReactDOM.unmountComponentAtNode inside the destroy method to properly tear down the React component tree.
    icon: icons/circle-alert.svg
  - text: Clear any pending timers (setTimeout, setInterval) or animation frames.
    icon: icons/settings.svg
  rationale:
  - text: Code components can be loaded and unloaded multiple times within a single browser session, especially in model-driven apps. Failing to clean up resources causes memory leaks that degrade performance over time.
    icon: icons/code-xml.svg
  - text: Orphaned event listeners continue to fire after the component is removed from the DOM, potentially causing errors or unexpected behavior.
    icon: icons/circle-alert.svg
  - text: React components that are not properly unmounted will retain references to stale DOM nodes and state, leading to memory leaks and console errors.
    icon: icons/link.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public destroy(): void {
            window.removeEventListener("resize", this._onResize);
            clearInterval(this._pollingInterval);
            ReactDOM.unmountComponentAtNode(this._container);
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        public destroy(): void {
            // Empty destroy method — resources are never cleaned up
        }
      language: typescript
    - title: Non-compliant code example
      code: |-
        // Adding a global event listener without ever removing it
        public init(context: ComponentFramework.Context<IInputs>): void {
            window.addEventListener("resize", this._onResize);
        }

        public destroy(): void {
            // Missing: window.removeEventListener("resize", this._onResize);
        }
      language: typescript
  references:
  - title: Control.destroy - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/reference/control/destroy
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-003
  title: Minimize calls to notifyOutputChanged.
  description: Minimize calls to notifyOutputChanged. Avoid calling it on every keystroke or mouse move event. Instead, debounce or trigger it when the user interaction completes, such as on blur or mouse-up events.
  guidelines:
  - text: Do not call notifyOutputChanged inside high-frequency event handlers such as onkeypress, onmousemove, or oninput.
    icon: icons/circle-alert.svg
  - text: Use a debounce or throttle mechanism to batch rapid changes into a single notification.
    icon: icons/lightbulb.svg
  - text: Prefer triggering notifyOutputChanged on events that signal the end of an interaction, such as onblur, onchange, or onmouseup.
    icon: icons/workflow.svg
  rationale:
  - text: Each call to notifyOutputChanged triggers the hosting context to call getOutputs and propagate changes to the parent context. Excessive calls create unnecessary processing overhead.
    icon: icons/workflow.svg
  - text: In canvas apps, frequent output changes can trigger formula re-evaluation cascades, severely degrading app performance.
    icon: icons/lightbulb.svg
  - text: Debouncing provides a smoother user experience by only committing the final value after the user finishes interacting.
    icon: icons/users.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        private _onInputBlur = (): void => {
            this._value = this._inputElement.value;
            this._notifyOutputChanged();
        };

        public init(context: ComponentFramework.Context<IInputs>): void {
            this._inputElement.addEventListener("blur", this._onInputBlur);
        }
      language: typescript
    - title: Compliant code example
      code: |-
        private _debouncedNotify = debounce(() => {
            this._notifyOutputChanged();
        }, 300);

        private _onInput = (): void => {
            this._value = this._inputElement.value;
            this._debouncedNotify();
        };
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Calling notifyOutputChanged on every keystroke
        private _onKeyPress = (): void => {
            this._value = this._inputElement.value;
            this._notifyOutputChanged();
        };
      language: typescript
    - title: Non-compliant code example
      code: |-
        // Calling notifyOutputChanged on mouse move
        private _onMouseMove = (event: MouseEvent): void => {
            this._position = { x: event.clientX, y: event.clientY };
            this._notifyOutputChanged();
        };
      language: typescript
  references:
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-004
  title: Always handle null or undefined property values in the updateView method.
  description: Always handle null or undefined property values in the updateView method. Data may not be ready when updateView is first called, and your component must gracefully handle this state.
  guidelines:
  - text: Check for null or undefined values on all bound properties before using them.
    icon: icons/check.svg
  - text: Provide a visual loading indicator or a sensible default when data is not yet available.
    icon: icons/database.svg
  - text: Expect that a subsequent updateView call will include the actual values once data is ready.
    icon: icons/book-open.svg
  rationale:
  - text: The hosting context may call updateView before the bound data has loaded, passing null values for properties that will eventually have data.
    icon: icons/database.svg
  - text: Attempting to use null values without checking leads to runtime errors that break the component.
    icon: icons/check.svg
  - text: Providing a loading state improves user experience by giving visual feedback that data is being fetched.
    icon: icons/users.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public updateView(context: ComponentFramework.Context<IInputs>): void {
            const value = context.parameters.inputValue.raw;

            if (value === null || value === undefined) {
                this._container.innerHTML = "";
                this._container.appendChild(this._loadingSpinner);
                return;
            }

            this._renderContent(value);
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        public updateView(context: ComponentFramework.Context<IInputs>): void {
            // Directly using the value without null checking — will throw if null
            const value = context.parameters.inputValue.raw;
            this._container.innerText = value.toString();
        }
      language: typescript
  references:
  - title: Control.updateView - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/reference/control/updateview
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-005
  title: Always scope CSS rules to your code component's container.
  description: Always scope CSS rules to your code component's container. Never use global CSS selectors that could affect other components or the host application.
  guidelines:
  - text: Use the automatically generated CSS class applied to your component's container DIV element to scope all styles.
    icon: icons/lightbulb.svg
  - text: The scoped class follows the pattern Namespace.ComponentName.
    icon: icons/pencil.svg
  - text: If using a third-party CSS framework, wrap it in a namespace or use a namespaced version.
    icon: icons/check.svg
  - text: Avoid using overly broad selectors like div, input, or * without scoping them to your component.
    icon: icons/circle-alert.svg
  rationale:
  - text: Globally scoped CSS can unintentionally override styles of the host application (model-driven app, canvas app, or portal), causing layout or styling issues.
    icon: icons/lightbulb.svg
  - text: Multiple code components on the same page may conflict with each other if they use global styles.
    icon: icons/code-xml.svg
  - text: Scoped CSS ensures your component is visually self-contained and predictable regardless of where it is rendered.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        .SampleNamespace\.LinearInputComponent .slider-control {
            width: 100%;
            height: 24px;
        }

        .SampleNamespace\.LinearInputComponent .slider-label {
            font-size: 14px;
            color: #333;
        }
      language: css
    bad:
    - title: Non-compliant code example
      code: |-
        /* Global selector — affects ALL inputs on the page */
        input {
            border: 2px solid blue;
            font-size: 16px;
        }

        /* Overly broad selector — affects all divs */
        div {
            padding: 10px;
            margin: 5px;
        }
      language: css
    - title: Non-compliant code example
      code: |-
        /* Unscoped class name — may conflict with other components */
        .slider-control {
            width: 100%;
        }
      language: css
  references:
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-006
  title: Avoid using innerHTML to render dynamic content.
  description: Avoid using innerHTML to render dynamic content. Use DOM APIs such as document.createElement, or use a framework like React to build the UI safely.
  guidelines:
  - text: Never assign user-provided or data-bound values directly to innerHTML.
    icon: icons/database.svg
  - text: Use document.createElement and textContent for simple DOM construction.
    icon: icons/file-text.svg
  - text: For complex UIs, use React or another framework that automatically escapes content and prevents XSS vulnerabilities.
    icon: icons/lightbulb.svg
  - text: If HTML rendering is absolutely required, sanitize the content using a trusted library such as DOMPurify.
    icon: icons/check.svg
  rationale:
  - text: Setting innerHTML with unsanitized content exposes the component to Cross-Site Scripting (XSS) attacks, where malicious scripts can be injected and executed in the user's browser.
    icon: icons/users.svg
  - text: Frameworks like React use a virtual DOM that automatically escapes string values, preventing injection attacks by default.
    icon: icons/lightbulb.svg
  - text: DOM APIs like createElement and textContent are inherently safe because they do not parse HTML.
    icon: icons/circle-alert.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        const label = document.createElement("span");
        label.textContent = context.parameters.displayText.raw ?? "";
        this._container.appendChild(label);
      language: typescript
    - title: Compliant code example
      code: |-
        const MyComponent: React.FC<{ text: string }> = ({ text }) => (
            <div>{text}</div>
        );
      language: tsx
    bad:
    - title: Non-compliant code example
      code: |-
        // Directly injecting data into innerHTML — XSS vulnerability
        this._container.innerHTML =
            `<span>${context.parameters.displayText.raw}</span>`;
      language: typescript
    - title: Non-compliant code example
      code: |-
        // User-controlled data rendered as HTML
        this._container.innerHTML = userProvidedHtml;
      language: typescript
  references:
  - title: OWASP XSS Prevention Cheat Sheet
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Scripting_Prevention_Cheat_Sheet.html
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-007
  title: Use path-based imports when importing from Fluent UI React to reduce bundle
  description: Use path-based imports when importing from Fluent UI React to reduce bundle size. Avoid importing from the package root.
  guidelines:
  - text: Import individual components using their specific path, such as @fluentui/react/lib/Button.
    icon: icons/lightbulb.svg
  - text: Avoid importing from the root @fluentui/react barrel export.
    icon: icons/circle-alert.svg
  - text: 'Alternatively, configure tree-shaking in tsconfig.json by setting "module": "es2015" and "moduleResolution": "node".'
    icon: icons/settings.svg
  rationale:
  - text: The PCF build toolchain does not enable tree-shaking by default. Importing from the root barrel export bundles the entire Fluent UI library, significantly increasing the component's size.
    icon: icons/lightbulb.svg
  - text: Path-based imports ensure only the specific component code is included in the bundle, reducing load times.
    icon: icons/code-xml.svg
  - text: Smaller bundles improve performance, especially when multiple code components are loaded on the same page.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        import { PrimaryButton } from "@fluentui/react/lib/Button";
        import { TextField } from "@fluentui/react/lib/TextField";
        import { Dropdown } from "@fluentui/react/lib/Dropdown";
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Imports the entire Fluent UI library into the bundle
        import { PrimaryButton, TextField, Dropdown } from "@fluentui/react";
      language: typescript
  references:
  - title: Fluent UI - Advanced Usage
    url: https://github.com/microsoft/fluentui/wiki/Advanced-Usage
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-008
  title: Use the init method to request network resources such as metadata
  description: Use the init method to request network resources such as metadata or configuration data. Do not defer these requests to updateView.
  guidelines:
  - text: Initiate any required network calls (metadata, configuration, reference data) inside the init method.
    icon: icons/database.svg
  - text: If the data has not yet returned when updateView is called, display a loading indicator.
    icon: icons/eye.svg
  - text: Store the results of network calls in instance variables for use in subsequent updateView calls.
    icon: icons/lightbulb.svg
  rationale:
  - text: The init method is called once when the component is first loaded, making it the ideal place for one-time setup and data fetching.
    icon: icons/database.svg
  - text: Deferring network calls to updateView means they execute on every re-render, causing redundant requests and poor performance.
    icon: icons/eye.svg
  - text: Fetching data early in init reduces the time the user sees a loading state, since the request starts before the first render.
    icon: icons/users.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public init(
            context: ComponentFramework.Context<IInputs>,
            notifyOutputChanged: () => void,
            state: ComponentFramework.Dictionary
        ): void {
            this._notifyOutputChanged = notifyOutputChanged;
            this._isLoading = true;

            this._fetchMetadata(context).then((metadata) => {
                this._metadata = metadata;
                this._isLoading = false;
                this._notifyOutputChanged();
            });
        }

        public updateView(context: ComponentFramework.Context<IInputs>): void {
            if (this._isLoading) {
                this._showLoadingIndicator();
                return;
            }
            this._renderWithMetadata(this._metadata);
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Fetching data inside updateView — runs on every re-render
        public updateView(context: ComponentFramework.Context<IInputs>): void {
            fetch("/api/metadata")
                .then((response) => response.json())
                .then((data) => {
                    this._renderWithMetadata(data);
                });
        }
      language: typescript
  references:
  - title: Control.init - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/reference/control/init
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-009
  title: Always check API availability before using platform-specific APIs.
  description: Always check API availability before using platform-specific APIs. Not all APIs are available in every host (model-driven apps, canvas apps, portals).
  guidelines:
  - text: Check whether an API exists on the context object before calling it.
    icon: icons/check.svg
  - text: Provide a graceful fallback or inform the user when a required API is unavailable.
    icon: icons/users.svg
  - text: Refer to the PCF API reference documentation for per-host availability.
    icon: icons/link.svg
  rationale:
  - text: The context.webAPI is not available in canvas apps. Calling it without a check will result in runtime errors.
    icon: icons/check.svg
  - text: Code components are designed to work across multiple hosts (model-driven apps, canvas apps, and portals), each with different API support.
    icon: icons/code-xml.svg
  - text: Defensive checks future-proof the component against changes in API availability across platform updates.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public updateView(context: ComponentFramework.Context<IInputs>): void {
            if (context.webAPI) {
                context.webAPI
                    .retrieveMultipleRecords("account", "?$top=10")
                    .then((result) => this._renderRecords(result.entities));
            } else {
                this._renderFallbackMessage(
                    "This component requires Web API access."
                );
            }
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Calling webAPI without checking availability — fails in canvas apps
        public updateView(context: ComponentFramework.Context<IInputs>): void {
            context.webAPI
                .retrieveMultipleRecords("account", "?$top=10")
                .then((result) => this._renderRecords(result.entities));
        }
      language: typescript
  references:
  - title: Power Apps component framework API reference - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/reference/
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-010
  title: Do not use window.localStorage or window.sessionStorage to persist data in code
  description: Do not use window.localStorage or window.sessionStorage to persist data in code components. Use the framework-provided mechanisms instead.
  guidelines:
  - text: Avoid reading from or writing to window.localStorage and window.sessionStorage.
    icon: icons/circle-alert.svg
  - text: Use bound properties and notifyOutputChanged to pass data back to the hosting context.
    icon: icons/database.svg
  - text: If state persistence is needed, store data in Dataverse or use the state parameter of the init method for transient state.
    icon: icons/settings.svg
  rationale:
  - text: Data stored in web storage is not secure and could be accessed by other scripts running on the same domain.
    icon: icons/shield-alert.svg
  - text: Web storage is tied to the specific browser and device, so data stored there is not reliably available across sessions, devices, or users.
    icon: icons/database.svg
  - text: The hosting context (model-driven apps, canvas apps) manages its own data flow. Bypassing it with web storage creates inconsistencies and makes the component harder to test and debug.
    icon: icons/workflow.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Using bound properties to persist data
        public getOutputs(): IOutputs {
            return {
                savedValue: this._currentValue,
            };
        }

        // Using the state parameter for transient state
        public init(
            context: ComponentFramework.Context<IInputs>,
            notifyOutputChanged: () => void,
            state: ComponentFramework.Dictionary
        ): void {
            if (state && state["lastViewedTab"]) {
                this._activeTab = state["lastViewedTab"];
            }
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Storing data in localStorage — insecure and unreliable
        public init(
            context: ComponentFramework.Context<IInputs>
        ): void {
            localStorage.setItem("myComponent_value", this._currentValue);
        }

        public updateView(context: ComponentFramework.Context<IInputs>): void {
            this._currentValue = localStorage.getItem("myComponent_value") ?? "";
        }
      language: typescript
  references:
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-011
  title: Bundle all required modules as part of your code component.
  description: Bundle all required modules as part of your code component. Do not rely on external <script> tags or globally loaded libraries.
  guidelines:
  - text: Install all dependencies via npm and import them in your TypeScript code.
    icon: icons/code-xml.svg
  - text: Do not assume that any external library is already loaded in the host application.
    icon: icons/circle-alert.svg
  - text: Do not inject <script> or <link> tags into the document to load external resources.
    icon: icons/link.svg
  rationale:
  - text: Code components run in isolated contexts and cannot rely on global scripts being available on the page.
    icon: icons/code-xml.svg
  - text: Injecting <script> tags introduces unpredictable loading order, potential conflicts with other components, and security risks.
    icon: icons/shield-alert.svg
  - text: Bundling all dependencies ensures the component works reliably in offline scenarios and across all host types (model-driven apps, canvas apps, portals).
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: npm install chart.js
      language: shell
    - title: Compliant code example
      code: |-
        import { Chart } from "chart.js";

        public init(context: ComponentFramework.Context<IInputs>): void {
            const canvas = document.createElement("canvas");
            this._container.appendChild(canvas);
            this._chart = new Chart(canvas, { /* config */ });
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // Injecting a script tag to load an external library
        public init(context: ComponentFramework.Context<IInputs>): void {
            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/chart.js";
            document.head.appendChild(script);
        }
      language: typescript
    - title: Non-compliant code example
      code: |-
        // Assuming a globally available library
        public init(context: ComponentFramework.Context<IInputs>): void {
            // Chart is assumed to be available globally — will fail
            const chart = new (window as any).Chart(canvas, { /* config */ });
        }
      language: typescript
  references:
  - title: Best practices and guidance for code components - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/component-framework/code-components-best-practices
- id: PCF-012
  title: Ensure code components are accessible.
  description: Ensure code components are accessible. Provide keyboard navigation alternatives and use ARIA attributes so that screen readers can accurately describe the component's interface.
  guidelines:
  - text: Ensure all interactive elements can be reached and operated via keyboard (Tab, Enter, Escape, arrow keys).
    icon: icons/lightbulb.svg
  - text: Add aria-label, aria-role, and other ARIA attributes to convey the component's structure and state to assistive technologies.
    icon: icons/shield-alert.svg
  - text: Use semantic HTML elements (button, input, select) instead of generic div or span for interactive elements.
    icon: icons/check.svg
  - text: Test with screen readers and browser accessibility inspection tools.
    icon: icons/book-open.svg
  rationale:
  - text: Power Apps is used in enterprise environments where accessibility compliance (WCAG) is often a legal requirement.
    icon: icons/lightbulb.svg
  - text: Keyboard-only users and screen-reader users cannot interact with components that rely solely on mouse or touch events.
    icon: icons/users.svg
  - text: Using semantic HTML and ARIA attributes allows assistive technologies to provide an accurate representation of the component, improving usability for all users.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        const button = document.createElement("button");
        button.textContent = "Submit";
        button.setAttribute("aria-label", "Submit the form");
        button.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                this._onSubmit();
            }
        });
        this._container.appendChild(button);
      language: typescript
    - title: Compliant code example
      code: |-
        <Dropdown
            label="Select a country"
            ariaLabel="Country selector"
            options={this._countryOptions}
            onChange={this._onCountryChange}
        />
      language: tsx
    bad:
    - title: Non-compliant code example
      code: |-
        // Using a div as a button — not keyboard accessible, no ARIA role
        const fakeButton = document.createElement("div");
        fakeButton.textContent = "Submit";
        fakeButton.onclick = () => this._onSubmit();
        this._container.appendChild(fakeButton);
      language: typescript
    - title: Non-compliant code example
      code: |-
        // No ARIA attributes — screen readers cannot describe the control
        const input = document.createElement("input");
        input.type = "text";
        // Missing: aria-label or associated label element
        this._container.appendChild(input);
      language: typescript
  references:
