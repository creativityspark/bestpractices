topic: Model Driven Apps
description: Good practices for Model Driven Apps.
rules:
- id: MDA-001
  title: Create separate Model Driven Apps for each distinct user role or business
  description: Create separate Model Driven Apps for each distinct user role or business function instead of building a single app for all users.
  guidelines:
  - text: Identify the key personas (e.g., Sales, Customer Service, Back Office) and create a dedicated app for each.
    icon: icons/users.svg
  - text: Include only the tables, forms, views, and dashboards that are relevant to the target audience.
    icon: icons/database.svg
  - text: Assign the app to the appropriate security roles so that users only see the app designed for them.
    icon: icons/shield-alert.svg
  - text: Use a meaningful app name and icon that clearly conveys the app's purpose.
    icon: icons/pencil.svg
  rationale:
  - text: A single app containing every table and dashboard overwhelms users with information they do not need, reducing productivity.
    icon: icons/database.svg
  - text: Smaller, role-specific apps load faster because they contain fewer components.
    icon: icons/shield-alert.svg
  - text: Restricting app access by security role enforces the principle of least privilege and reduces the risk of unauthorized data access.
    icon: icons/check.svg
  - text: Tailored apps are easier to maintain because changes to one role's experience do not impact others.
    icon: icons/circle-alert.svg
  examples:
    good:
    - title: A "Customer Service Hub" app containing Cases, Knowledge Articles, and Queues
      text: A "Customer Service Hub" app containing Cases, Knowledge Articles, and Queues - tailored for support agents.
      icon: icons/lightbulb.svg
    - title: A "Sales Operations" app containing Leads, Opportunities, and Quotes - tailored
      text: A "Sales Operations" app containing Leads, Opportunities, and Quotes - tailored for the sales team.
      icon: icons/users.svg
    - title: A "Back Office Administration" app containing configuration tables, security
      text: A "Back Office Administration" app containing configuration tables, security roles, and audit logs - tailored for system administrators.
      icon: icons/shield-alert.svg
    bad:
    - title: A single "CRM App" that includes every table in the system, forcing sales reps
      text: A single "CRM App" that includes every table in the system, forcing sales reps to scroll past support tables and admin settings to find what they need.
      icon: icons/database.svg
    - title: One app shared across all roles with no security role restrictions, giving
      text: One app shared across all roles with no security role restrictions, giving every user access to every feature.
      icon: icons/check.svg
  references:
  - title: Model-driven app overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/model-driven-app-overview
  - title: Control access to model-driven apps with security roles - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/model-driven-app-share
- id: MDA-002
  title: Design the sitemap navigation with logical grouping, clear labels, and minimal
  description: Design the sitemap navigation with logical grouping, clear labels, and minimal nesting.
  guidelines:
  - text: Group related tables under meaningful areas and groups (e.g., "Sales" containing Leads, Opportunities, and Accounts).
    icon: icons/database.svg
  - text: Place the most frequently used items first in each group.
    icon: icons/lightbulb.svg
  - text: Avoid nesting more than two levels deep.
    icon: icons/circle-alert.svg
  - text: Use descriptive labels instead of internal jargon or abbreviations.
    icon: icons/pencil.svg
  - text: Assign icons to each sitemap entry for faster visual recognition.
    icon: icons/check.svg
  rationale:
  - text: A well-organized sitemap reduces the time users spend searching for the right table or dashboard.
    icon: icons/database.svg
  - text: Deep nesting makes navigation confusing and increases the number of clicks to reach common tasks.
    icon: icons/lightbulb.svg
  - text: Clear labels reduce training needs and help new users onboard faster.
    icon: icons/pencil.svg
  - text: Icons provide visual cues that improve navigation speed, especially on smaller screens.
    icon: icons/check.svg
  examples:
    good:
    - title: Leads
      text: 'Leads'
      icon: icons/lightbulb.svg
    - title: Opportunities
      text: 'Opportunities'
      icon: icons/check.svg
    - title: Quotes
      text: 'Quotes'
      icon: icons/circle-alert.svg
    - title: Accounts
      text: 'Accounts'
      icon: icons/settings.svg
    - title: Contacts
      text: 'Contacts'
      icon: icons/workflow.svg
    - title: Active Cases
      text: 'Active Cases'
      icon: icons/database.svg
    - title: Knowledge Articles
      text: 'Knowledge Articles'
      icon: icons/link.svg
    - title: Compliant code example
      code: |-
        Area: Sales
          Group: Pipeline
            - Leads
            - Opportunities
            - Quotes
          Group: Customers
            - Accounts
            - Contacts

        Area: Service
          Group: Cases
            - Active Cases
            - Knowledge Articles
    bad:
    - title: tbl_lead
      text: 'tbl_lead'
      icon: icons/users.svg
    - title: tbl_opp
      text: 'tbl_opp'
      icon: icons/file-text.svg
    - title: tbl_quot
      text: 'tbl_quot'
      icon: icons/pencil.svg
    - title: tbl_acc
      text: 'tbl_acc'
      icon: icons/eye.svg
    - title: tbl_cont
      text: 'tbl_cont'
      icon: icons/package.svg
    - title: tbl_case
      text: 'tbl_case'
      icon: icons/book-open.svg
    - title: tbl_ka
      text: 'tbl_ka'
      icon: icons/folder-open.svg
    - title: tbl_ord
      text: 'tbl_ord'
      icon: icons/shield-alert.svg
    - title: tbl_inv
      text: 'tbl_inv'
      icon: icons/info.svg
    - title: Non-compliant code example
      code: |-
        Area: Area1
          Group: Group1
            Subarea: Subgroup1
              - tbl_lead
              - tbl_opp
              - tbl_quot
              - tbl_acc
              - tbl_cont
              - tbl_case
              - tbl_ka
              - tbl_ord
              - tbl_inv
  references:
  - title: Create a model-driven app site map - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/create-site-map-app
  - title: UI/UX design components for model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/dynamics365/guidance/develop/ui-ux-component-details-model-driven-apps
- id: MDA-003
  title: Design system views to be focused, performant, and aligned with how users
  description: Design system views to be focused, performant, and aligned with how users consume data.
  guidelines:
  - text: Display only the columns that users need in each view. Avoid adding every column to a single view.
    icon: icons/database.svg
  - text: Set appropriate default sorting and filtering so the most relevant records appear first.
    icon: icons/lightbulb.svg
  - text: Create purpose-specific views (e.g., "My Active Cases", "Cases Due Today") instead of relying solely on generic views.
    icon: icons/eye.svg
  - text: Limit views to 6-8 columns to keep them readable without horizontal scrolling.
    icon: icons/book-open.svg
  - text: Avoid using complex calculated or rollup columns in high-traffic views, as they can degrade query performance.
    icon: icons/circle-alert.svg
  rationale:
  - text: Views with too many columns load more data than necessary, increasing query time and degrading user experience.
    icon: icons/database.svg
  - text: Purpose-specific views help users find the right records faster and reduce the need for manual filtering.
    icon: icons/users.svg
  - text: Calculated and rollup columns require additional server processing at query time, which can cause slow load times on views accessed frequently.
    icon: icons/workflow.svg
  - text: Consistent, well-designed views reduce user errors and the need for ad-hoc Advanced Find queries.
    icon: icons/circle-alert.svg
  examples:
    good:
    - title: Conforms to the rule requirements.
      text: Conforms to the rule requirements.
      icon: icons/lightbulb.svg
    bad:
    - title: Violates the rule requirements.
      text: Violates the rule requirements.
      icon: icons/check.svg
  references:
  - title: Create or edit a model-driven app view - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/create-edit-views
  - title: Optimize form performance - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/optimize-form-performance
- id: MDA-004
  title: Design dashboards to surface actionable insights, not just raw data.
  description: Design dashboards to surface actionable insights, not just raw data.
  guidelines:
  - text: Include only charts and lists that drive decisions or highlight areas requiring attention.
    icon: icons/lightbulb.svg
  - text: Create role-specific dashboards instead of a single all-purpose dashboard.
    icon: icons/shield-alert.svg
  - text: Limit the number of components per dashboard to 4-6 to avoid visual clutter and slow load times.
    icon: icons/circle-alert.svg
  - text: Use interactive dashboards when users need to filter and drill down into data directly from the dashboard.
    icon: icons/database.svg
  - text: Set the most relevant dashboard as the default for each security role.
    icon: icons/check.svg
  rationale:
  - text: Dashboards overloaded with charts and lists become noise rather than insight, reducing their value.
    icon: icons/lightbulb.svg
  - text: Each component on a dashboard triggers a separate data query. Too many components degrade load time.
    icon: icons/database.svg
  - text: Interactive dashboards allow users to act on data without navigating away, improving productivity.
    icon: icons/users.svg
  - text: Role-specific dashboards ensure users see KPIs relevant to their job function.
    icon: icons/shield-alert.svg
  examples:
    good:
    - title: 'A "Service Manager Dashboard" with:'
      text: 'A "Service Manager Dashboard" with:'
      icon: icons/lightbulb.svg
    - title: Chart
      text: 'Chart Cases by Priority (last 30 days)'
      icon: icons/check.svg
    - title: Chart
      text: 'Chart Average Resolution Time (trend)'
      icon: icons/package.svg
    - title: List
      text: 'List Cases Escalated Today'
      icon: icons/circle-alert.svg
    - title: List
      text: 'List SLA Violations This Week'
      icon: icons/settings.svg
    bad:
    - title: A single "Main Dashboard" with 10+ charts and lists covering Sales, Service
      text: A single "Main Dashboard" with 10+ charts and lists covering Sales, Service, Marketing, and Admin data - used by everyone regardless of role.
      icon: icons/shield-alert.svg
    - title: A dashboard with lists showing all records (unfiltered), providing no insight
      text: A dashboard with lists showing all records (unfiltered), providing no insight beyond what a view already offers.
      icon: icons/book-open.svg
  references:
  - title: Create or edit a model-driven app dashboard - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/create-edit-dashboards
- id: MDA-005
  title: Follow client scripting best practices when writing JavaScript for Model Driven
  description: Follow client scripting best practices when writing JavaScript for Model Driven Apps.
  guidelines:
  - text: Use namespaces to avoid global variable conflicts. Define all functions under a project-specific namespace (e.g., Contoso.Account).
    icon: icons/pencil.svg
  - text: Always use executionContext.getFormContext() instead of the deprecated Xrm.Page.
    icon: icons/lightbulb.svg
  - text: Use async/await with Xrm.WebApi for all data operations. Never use synchronous XMLHttpRequest calls.
    icon: icons/database.svg
  - text: Register event handlers using their fully qualified namespace (e.g., Contoso.Account.onLoad) instead of anonymous functions.
    icon: icons/check.svg
  - text: Handle errors using try/catch blocks and display user-friendly messages via Xrm.Navigation.openAlertDialog.
    icon: icons/users.svg
  - text: Pass executionContext as the first parameter to all event handler functions.
    icon: icons/settings.svg
  rationale:
  - text: Global variables can conflict with other scripts or future platform updates, causing unpredictable behavior.
    icon: icons/database.svg
  - text: Xrm.Page is deprecated and may be removed in future updates. getFormContext() is the supported replacement.
    icon: icons/lightbulb.svg
  - text: Synchronous calls block the UI thread, causing the form to freeze during data operations.
    icon: icons/book-open.svg
  - text: Named functions registered via their namespace are easier to debug, trace, and manage across forms.
    icon: icons/pencil.svg
  - text: Unhandled errors in client scripts can silently fail or produce confusing browser errors for end users.
    icon: icons/users.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        var Contoso = Contoso || {};
        Contoso.Account = {
            onLoad: async function (executionContext) {
                "use strict";
                var formContext = executionContext.getFormContext();
                try {
                    var result = await Xrm.WebApi.retrieveRecord(
                        "account",
                        formContext.data.entity.getId(),
                        "?$select=name,revenue"
                    );
                    // Process result
                } catch (error) {
                    Xrm.Navigation.openAlertDialog({ text: error.message });
                }
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // No namespace — pollutes global scope
        function onLoad() {
            // Uses deprecated Xrm.Page
            var name = Xrm.Page.getAttribute("name").getValue();

            // Synchronous XMLHttpRequest — blocks the UI
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/api/data/v9.2/accounts", false);
            xhr.send();
        }
      language: javascript
  references:
  - title: Client scripting in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/client-scripting
  - title: Xrm.WebApi reference - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/xrm-webapi
  - title: Best practices for client scripting - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/best-practices/business-logic/interact-http-https-resources-asynchronously
- id: MDA-006
  title: Create custom security roles following the principle of least privilege instead
  description: Create custom security roles following the principle of least privilege instead of modifying out-of-the-box roles.
  guidelines:
  - text: Clone the out-of-the-box role that most closely matches the required access, then customize the clone.
    icon: icons/shield-alert.svg
  - text: Grant only the minimum table and field permissions needed for each role.
    icon: icons/database.svg
  - text: Use field security profiles for sensitive fields (e.g., salary, SSN) that should be restricted even within a role.
    icon: icons/folder-open.svg
  - text: Assign security roles via Azure AD security groups or Dataverse teams rather than directly to individual users.
    icon: icons/users.svg
  - text: Test every custom security role in a non-production environment with a dedicated test user before deploying to production.
    icon: icons/check.svg
  rationale:
  - text: Modifying out-of-the-box roles can be overwritten during platform updates, causing unexpected permission changes.
    icon: icons/shield-alert.svg
  - text: Excessive permissions violate the principle of least privilege and increase the surface area for data breaches or accidental modifications.
    icon: icons/database.svg
  - text: Assigning roles via security groups simplifies user management and ensures consistency when onboarding or offboarding users.
    icon: icons/users.svg
  - text: Untested security roles can inadvertently grant or restrict access, leading to production issues that are difficult to diagnose.
    icon: icons/check.svg
  examples:
    good:
    - title: Clone the "Customer Service Representative" role, remove access to financial
      text: Clone the "Customer Service Representative" role, remove access to financial tables, and name it "Tier 1 Support Agent".
      icon: icons/shield-alert.svg
    - title: Create a field security profile to restrict the credit_limit column on the
      text: Create a field security profile to restrict the credit_limit column on the Account table to the Finance team only.
      icon: icons/database.svg
    - title: Assign the "Sales Representative" role to the "Sales Team" Azure AD security
      text: Assign the "Sales Representative" role to the "Sales Team" Azure AD security group.
      icon: icons/users.svg
    bad:
    - title: Granting the "System Administrator" role to all users to avoid access-related
      text: Granting the "System Administrator" role to all users to avoid access-related support tickets.
      icon: icons/circle-alert.svg
    - title: Editing the out-of-the-box "Salesperson" role directly instead of cloning it
      text: Editing the out-of-the-box "Salesperson" role directly instead of cloning it, risking changes being overwritten on platform updates.
      icon: icons/lightbulb.svg
    - title: Assigning security roles to individual users one by one, making it difficult to
      text: Assigning security roles to individual users one by one, making it difficult to track who has what access.
      icon: icons/check.svg
  references:
  - title: Security roles and privileges - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/security-roles-privileges
  - title: Field security profiles - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/field-level-security
- id: MDA-007
  title: Package all customizations in managed solutions and follow a structured solution
  description: Package all customizations in managed solutions and follow a structured solution strategy.
  guidelines:
  - text: Use a consistent publisher prefix across all solutions in the organization.
    icon: icons/pencil.svg
  - text: Separate customizations into layered solutions (e.g., Core, Feature, App) to enable independent deployment and rollback.
    icon: icons/package.svg
  - text: Never make unmanaged customizations directly in production. All changes must flow through the development environment and be deployed as managed solutions.
    icon: icons/workflow.svg
  - text: Use environment variables for settings that differ across environments (e.g., API URLs, connection references).
    icon: icons/link.svg
  - text: Store solution exports in source control (e.g., Git) and automate deployments via CI/CD pipelines.
    icon: icons/lightbulb.svg
  rationale:
  - text: Unmanaged customizations in production cannot be cleanly upgraded or rolled back, leading to environment drift and support issues.
    icon: icons/lightbulb.svg
  - text: Layered solutions allow teams to deploy and update features independently without affecting the core data model or other features.
    icon: icons/database.svg
  - text: A consistent publisher prefix prevents naming conflicts and makes it easy to identify which components belong to your organization.
    icon: icons/pencil.svg
  - text: Environment variables eliminate the need to manually reconfigure settings after each deployment, reducing errors and deployment time.
    icon: icons/circle-alert.svg
  - text: Source control and CI/CD ensure traceability, repeatability, and the ability to revert to a known good state.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        Solution: Contoso Core (contoso_core)
          → Tables, fields, relationships, option sets

        Solution: Contoso Sales App (contoso_sales)
          → Sales-specific forms, views, dashboards, sitemap

        Solution: Contoso Service App (contoso_service)
          → Service-specific forms, views, dashboards, sitemap
    bad:
    - title: All customizations in a single monolithic solution that takes 30+ minutes to
      text: All customizations in a single monolithic solution that takes 30+ minutes to import and cannot be partially rolled back.
      icon: icons/package.svg
    - title: Making quick fixes directly in the production environment as unmanaged
      text: Making quick fixes directly in the production environment as unmanaged customizations, bypassing the development and testing process.
      icon: icons/workflow.svg
    - title: Different developers using different publisher prefixes, resulting in mixed
      text: Different developers using different publisher prefixes, resulting in mixed prefixes across tables and fields.
      icon: icons/database.svg
  references:
  - title: Solutions overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/solutions-overview
  - title: ALM best practices - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/overview-alm
  - title: Use environment variables in solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables
- id: MDA-008
  title: Have a description that explains its purpose, target audience, and scope.
  description: Every Model Driven App must have a description that explains its purpose, target audience, and scope.
  guidelines:
  - text: 'State the purpose: Explain what the app is for in one or two sentences.'
    icon: icons/lightbulb.svg
  - text: 'Identify the audience: Specify which security roles or teams are expected to use this app.'
    icon: icons/shield-alert.svg
  - text: 'Define the scope: List the key tables, dashboards, and business processes included in the app.'
    icon: icons/database.svg
  rationale:
  - text: Organizations often have multiple Model Driven Apps. Without descriptions, administrators cannot easily determine which app serves which purpose.
    icon: icons/file-text.svg
  - text: Descriptions help during onboarding, making it clear which app a new user should access based on their role.
    icon: icons/shield-alert.svg
  - text: Clear scope documentation prevents duplication of features across apps and supports governance decisions.
    icon: icons/link.svg
  examples:
    good:
    - title: '"Customer Service Hub for the Tier 1 and Tier 2 support teams.'
      text: '"Customer Service Hub for the Tier 1 and Tier 2 support teams. Includes Cases, Knowledge Articles, Queues, and the Case Resolution dashboard. Assigned to the Customer Service Representative and Customer Service Manager security roles."'
      icon: icons/shield-alert.svg
    - title: '"Sales Operations app for the inside sales team.'
      text: '"Sales Operations app for the inside sales team. Covers Leads, Opportunities, Quotes, and the Sales Pipeline dashboard. Restricted to the Sales Representative and Sales Manager roles."'
      icon: icons/workflow.svg
    bad:
    - title: "\"App 1\" - provides no context about the app's purpose or audience."
      text: "\"App 1\" - provides no context about the app's purpose or audience."
      icon: icons/users.svg
    - title: No description at all - administrators must open and inspect the app to
      text: No description at all - administrators must open and inspect the app to understand what it contains.
      icon: icons/file-text.svg
  references:
  - title: Create a model-driven app - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/build-first-model-driven-app




