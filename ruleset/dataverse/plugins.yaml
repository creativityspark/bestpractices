topic: Plugins
description: Good practices for Dataverse C# Plugins.
rules:
- id: PLG-001
  title: Use a namespace-based naming convention that describes the plugin's purpose.
  description: "Plugin class names must use a namespace-based naming convention that describes the plugin's purpose. Do not hardcode table schema names, pipeline stages, or event names into the class name, since a single plugin class can be registered on multiple tables and stages, and its configuration may change over time. Follow this pattern:  [AppName].Plugins.[TableName (if table-specific)].[Action/Purpose] "
  guidelines:
  - text: 'AppName: The name of the application or solution (e.g., CRM, Sales, FieldService).'
    icon: icons/database.svg
  - text: 'Plugins: A fixed namespace segment indicating the plugin layer.'
    icon: icons/pencil.svg
  - text: 'TableName *(optional)*: Include the table name as a namespace segment only when the plugin is specific to a single table.'
    icon: icons/code-xml.svg
  - text: 'Action/Purpose: A descriptive class name that explains what the plugin does.'
    icon: icons/workflow.svg
  rationale:
  - text: Namespace-based naming keeps plugin classes organized and discoverable in large solutions with many plugins.
    icon: icons/pencil.svg
  - text: Avoiding table schema names and pipeline stages in the class name allows the same plugin to be registered on multiple tables, events, or stages without the name becoming misleading.
    icon: icons/database.svg
  - text: Plugin registration details (table, stage, event) are configured in the Plugin Registration Tool and can change independently of the code. The class name should describe *what* the plugin does, not *where* it is registered.
    icon: icons/workflow.svg
  examples:
    good:
    - title: CRM.Plugins.Accounts.ValidateEmail - a plugin under the CRM app namespace
      text: CRM.Plugins.Accounts.ValidateEmail - a plugin under the CRM app namespace, specific to the Accounts table.
      icon: icons/database.svg
    - title: CRM.Plugins.Contacts.SendWelcomeNotification - specific to the Contacts table.
      text: CRM.Plugins.Contacts.SendWelcomeNotification - specific to the Contacts table.
      icon: icons/code-xml.svg
    - title: CRM.Plugins.EnforceBusinessHours - a cross-table plugin that applies to
      text: CRM.Plugins.EnforceBusinessHours - a cross-table plugin that applies to multiple tables.
      icon: icons/check.svg
    - title: Sales.Plugins.Orders.PreventActiveDeletion - under the Sales app namespace
      text: Sales.Plugins.Orders.PreventActiveDeletion - under the Sales app namespace, specific to Orders.
      icon: icons/pencil.svg
    bad:
    - title: AccountPreOpUpdate_ValidateEmail - hardcodes the table schema, pipeline stage
      text: AccountPreOpUpdate_ValidateEmail - hardcodes the table schema, pipeline stage, and event into the name.
      icon: icons/workflow.svg
    - title: Plugin1 - meaningless, provides no context about the purpose.
      text: Plugin1 - meaningless, provides no context about the purpose.
      icon: icons/lightbulb.svg
    - title: AccountPlugin - too generic; does not indicate what it does.
      text: AccountPlugin - too generic; does not indicate what it does.
      icon: icons/circle-alert.svg
    - title: DoStuff - no naming structure whatsoever.
      text: DoStuff - no naming structure whatsoever.
      icon: icons/settings.svg
  references:
  - title: Write a plug-in - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/write-plug-in
- id: PLG-002
  title: Always throw InvalidPluginExecutionException for business rule violations
  description: Always throw InvalidPluginExecutionException for business rule violations and validation errors. Never throw generic .NET exceptions from plugin code.
  guidelines:
  - text: Use InvalidPluginExecutionException to communicate validation failures, business rule violations, or any condition that should cancel the operation and display a message to the user.
    icon: icons/users.svg
  - text: Catch unexpected exceptions and wrap them with InvalidPluginExecutionException before re-throwing, including a user-friendly message.
    icon: icons/code-xml.svg
  - text: Do not include HTML, stack traces, or sensitive data in the exception message.
    icon: icons/shield-alert.svg
  rationale:
  - text: InvalidPluginExecutionException is the only exception type that the platform recognizes and surfaces as a user-friendly message in the UI. Generic exceptions result in an unhelpful "ISV Unexpected" error.
    icon: icons/users.svg
  - text: Wrapping unexpected exceptions ensures that the user and support staff receive actionable error messages instead of cryptic system errors.
    icon: icons/workflow.svg
  - text: Including sensitive data or stack traces in exception messages poses a security risk, as these messages are displayed to end users.
    icon: icons/shield-alert.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        if (string.IsNullOrEmpty(email))
        {
            throw new InvalidPluginExecutionException(
                "The Email field is required. Please provide a valid email address before saving.");
        }
      language: csharp
    - title: Compliant code example
      code: |-
        try
        {
            // Business logic
        }
        catch (Exception ex)
        {
            tracingService.Trace("Unexpected error: {0}", ex.ToString());
            throw new InvalidPluginExecutionException(
                "An unexpected error occurred while processing the record. Please contact support.", ex);
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Throws a generic exception — user sees "ISV Unexpected" with no useful message
        throw new Exception("Something went wrong");
      language: csharp
    - title: Non-compliant code example
      code: |-
        // Exposes stack trace and internal details to the end user
        throw new InvalidPluginExecutionException(ex.ToString());
      language: csharp
  references:
  - title: Use InvalidPluginExecutionException in plug-ins - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic/use-invalidpluginexecutionexception-plugin-workflow-activities
- id: PLG-003
  title: Always use ITracingService to log diagnostic information at key points
  description: Always use ITracingService to log diagnostic information at key points in the plugin execution flow.
  guidelines:
  - text: Obtain the ITracingService instance from the IServiceProvider and use it to log execution flow, input values, and error details.
    icon: icons/workflow.svg
  - text: Log at the beginning and end of the plugin, before and after key operations, and before throwing exceptions.
    icon: icons/code-xml.svg
  - text: Never use Console.WriteLine, Debug.WriteLine, or any other logging mechanism - only ITracingService is supported.
    icon: icons/circle-alert.svg
  rationale:
  - text: ITracingService writes to the Plugin Trace Log, which is the only supported diagnostic mechanism for Dataverse plugins running in sandbox isolation.
    icon: icons/database.svg
  - text: Detailed trace logs are essential for diagnosing production issues, especially when you cannot attach a debugger.
    icon: icons/lightbulb.svg
  - text: Tracing before throwing InvalidPluginExecutionException captures the context leading to the error, making postmortem analysis significantly easier.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public void Execute(IServiceProvider serviceProvider)
        {
            var tracingService = (ITracingService)serviceProvider.GetService(typeof(ITracingService));
            tracingService.Trace("Plugin execution started.");

            var context = (IPluginExecutionContext)serviceProvider.GetService(typeof(IPluginExecutionContext));
            tracingService.Trace("Message: {0}, Entity: {1}, Depth: {2}",
                context.MessageName, context.PrimaryEntityName, context.Depth);

            try
            {
                // Business logic
                tracingService.Trace("Validation passed. Updating record.");
            }
            catch (Exception ex)
            {
                tracingService.Trace("Error: {0}", ex.ToString());
                throw new InvalidPluginExecutionException("An error occurred. Please contact support.", ex);
            }
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // No tracing at all — impossible to diagnose issues in production
        public void Execute(IServiceProvider serviceProvider)
        {
            var context = (IPluginExecutionContext)serviceProvider.GetService(typeof(IPluginExecutionContext));
            // Business logic with no trace statements
        }
      language: csharp
    - title: Non-compliant code example
      code: |-
        // Using Console.WriteLine — output is lost in the Dataverse sandbox environment
        Console.WriteLine("Plugin started");
      language: csharp
  references:
  - title: Use ITracingService in plug-ins - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic/use-itracingservice-plugins
  - title: Debug plug-ins - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/debug-plug-in
- id: PLG-004
  title: Be stateless.
  description: Plugins must be stateless. Do not use instance variables, static fields, or singletons to store data between plugin executions.
  guidelines:
  - text: Do not declare instance fields or static fields that hold state across executions.
    icon: icons/database.svg
  - text: All data needed for execution must be obtained from the IServiceProvider and the execution context within the Execute method.
    icon: icons/check.svg
  - text: The only safe use of class-level fields is for immutable configuration values set in the constructor from the plugin's unsecure or secure configuration strings.
    icon: icons/shield-alert.svg
  rationale:
  - text: The Dataverse platform may cache and reuse plugin instances across multiple executions and threads. Instance or static state can be shared unpredictably, leading to race conditions, data corruption, and hard-to-reproduce bugs.
    icon: icons/database.svg
  - text: Plugins are expected to execute in a thread-safe, stateless manner. Any data that persists between invocations violates this contract.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public class AccountPostCreate : IPlugin
        {
            private readonly string _config; // Immutable, set once in constructor

            public AccountPostCreate(string unsecureConfig, string secureConfig)
            {
                _config = unsecureConfig; // Safe: set once, never modified
            }

            public void Execute(IServiceProvider serviceProvider)
            {
                // All state is obtained from serviceProvider
                var context = (IPluginExecutionContext)serviceProvider.GetService(typeof(IPluginExecutionContext));
                var target = (Entity)context.InputParameters["Target"];
                // Process target...
            }
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        public class AccountPostCreate : IPlugin
        {
            private int _executionCount = 0; // Shared across threads — race condition
            private Entity _lastProcessedEntity; // Leaks data between executions

            public void Execute(IServiceProvider serviceProvider)
            {
                _executionCount++;
                _lastProcessedEntity = (Entity)context.InputParameters["Target"];
            }
        }
      language: csharp
  references:
  - title: Write a plug-in - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/write-plug-in
  - title: Best practices for plug-in and workflow development - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic
- id: PLG-005
  title: Design plugins to be idempotent instead of relying on execution depth checks.
  description: Design plugins to be idempotent instead of relying on execution depth checks.
  guidelines:
  - text: Ensure that running the plugin multiple times with the same input produces the same result without unwanted side effects.
    icon: icons/code-xml.svg
  - text: Before modifying a record, check whether the change is actually needed (e.g., compare current vs. desired values). Skip the update if the record is already in the correct state.
    icon: icons/check.svg
  - text: Do not use IPluginExecutionContext.Depth as a control flow mechanism. Depth checks mask underlying design issues and can silently suppress legitimate nested executions.
    icon: icons/workflow.svg
  rationale:
  - text: An idempotent plugin is safe to execute at any depth because it only makes changes when they are truly needed, naturally preventing infinite loops.
    icon: icons/code-xml.svg
  - text: Depth checks are fragile - they assume a specific call chain. When new plugins or workflows are added to the pipeline, the expected depth may change, causing the check to incorrectly skip or execute logic.
    icon: icons/workflow.svg
  - text: Relying on depth checks can hide recursive update patterns that should be fixed at the design level rather than worked around at runtime.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        public void Execute(IServiceProvider serviceProvider)
        {
            var context = (IPluginExecutionContext)serviceProvider.GetService(typeof(IPluginExecutionContext));
            var service = ((IOrganizationServiceFactory)serviceProvider.GetService(typeof(IOrganizationServiceFactory)))
                .CreateOrganizationService(context.UserId);

            var target = (Entity)context.InputParameters["Target"];
            var current = service.Retrieve(target.LogicalName, target.Id, new ColumnSet("description"));

            var currentDescription = current.GetAttributeValue<string>("description");
            var desiredDescription = "Updated by plugin";

            // Only update if the value is not already set — prevents re-triggering
            if (currentDescription != desiredDescription)
            {
                var update = new Entity(target.LogicalName, target.Id);
                update["description"] = desiredDescription;
                service.Update(update);
            }
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        public void Execute(IServiceProvider serviceProvider)
        {
            var context = (IPluginExecutionContext)serviceProvider.GetService(typeof(IPluginExecutionContext));

            // Fragile: assumes depth will always be 1 on the first trigger
            if (context.Depth > 1)
            {
                return;
            }

            var service = ((IOrganizationServiceFactory)serviceProvider.GetService(typeof(IOrganizationServiceFactory)))
                .CreateOrganizationService(context.UserId);

            // Unconditionally updates the record, which triggers this plugin again
            var target = (Entity)context.InputParameters["Target"];
            target["description"] = "Updated by plugin";
            service.Update(target);
        }
      language: csharp
  references:
  - title: IPluginExecutionContext.Depth Property - Microsoft Learn
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.xrm.sdk.ipluginexecutioncontext.depth
  - title: Best practices for plug-in and workflow development - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic
- id: PLG-006
  title: Never use new ColumnSet(true) when retrieving records.
  description: Never use new ColumnSet(true) when retrieving records. Always specify only the columns you need.
  guidelines:
  - text: When calling Retrieve or RetrieveMultiple, explicitly list the required columns using new ColumnSet("column1", "column2").
    icon: icons/database.svg
  - text: Never pass true to the ColumnSet constructor, as this retrieves all columns on the table.
    icon: icons/circle-alert.svg
  rationale:
  - text: Retrieving all columns incurs unnecessary database load, increases memory consumption, and degrades plugin performance.
    icon: icons/database.svg
  - text: Tables evolve over time - new columns may be added that increase payload size or that the plugin's security context is not authorized to read, potentially causing runtime errors.
    icon: icons/shield-alert.svg
  - text: Specifying only the needed columns makes the plugin's data requirements explicit and self-documenting.
    icon: icons/file-text.svg
  examples:
    good:
    - title: Compliant code example
      code: var account = service.Retrieve("account", accountId, new ColumnSet("name", "emailaddress1"));
      language: csharp
    - title: Compliant code example
      code: |-
        var query = new QueryExpression("contact")
        {
            ColumnSet = new ColumnSet("firstname", "lastname", "emailaddress1")
        };
        query.Criteria.AddCondition("statecode", ConditionOperator.Equal, 0);
        var contacts = service.RetrieveMultiple(query);
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Retrieves ALL columns — wasteful and fragile
        var account = service.Retrieve("account", accountId, new ColumnSet(true));
      language: csharp
    - title: Non-compliant code example
      code: |-
        var query = new QueryExpression("contact")
        {
            ColumnSet = new ColumnSet(true) // All columns fetched for every contact
        };
        var contacts = service.RetrieveMultiple(query);
      language: csharp
  references:
  - title: Do not retrieve Entity all columns via query APIs - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/work-with-data/retrieve-specific-columns-entity-via-query-apis
- id: PLG-007
  title: Use pre-images and post-images instead of issuing additional Retrieve calls
  description: Use pre-images and post-images instead of issuing additional Retrieve calls to access field values before or after the operation.
  guidelines:
  - text: Register entity images (pre-image and/or post-image) on the plugin step in the Plugin Registration Tool with only the attributes you need.
    icon: icons/workflow.svg
  - text: Access images via context.PreEntityImages and context.PostEntityImages.
    icon: icons/lightbulb.svg
  - text: Always check that the image exists before accessing it.
    icon: icons/check.svg
  rationale:
  - text: Entity images are loaded by the platform as part of the pipeline and do not incur an additional Retrieve call to the database, improving plugin performance.
    icon: icons/database.svg
  - text: Pre-images provide the field values before the operation, which is essential for comparison logic (e.g., detecting field changes).
    icon: icons/lightbulb.svg
  - text: Registering only the needed attributes in the image reduces the data payload and keeps the plugin efficient.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        if (context.PreEntityImages.Contains("PreImage"))
        {
            var preImage = context.PreEntityImages["PreImage"];
            var previousStatus = preImage.GetAttributeValue<OptionSetValue>("statuscode");
            var currentStatus = target.GetAttributeValue<OptionSetValue>("statuscode");

            if (previousStatus?.Value != currentStatus?.Value)
            {
                tracingService.Trace("Status changed from {0} to {1}.", previousStatus?.Value, currentStatus?.Value);
                // Handle status change
            }
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Issues an unnecessary Retrieve call to get the previous value
        var previousRecord = service.Retrieve("account", target.Id, new ColumnSet("statuscode"));
        var previousStatus = previousRecord.GetAttributeValue<OptionSetValue>("statuscode");
      language: csharp
  references:
  - title: Define entity images - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/register-plug-in#define-entity-images
  - title: Best practices for plug-in and workflow development - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic
- id: PLG-008
  title: Register plugins in the correct pipeline stage based on the type of logic they
  description: Register plugins in the correct pipeline stage based on the type of logic they perform.
  guidelines:
  - text: Use Pre-Validation for lightweight checks that should run before the database transaction begins (e.g., permission checks, canceling invalid operations).
    icon: icons/shield-alert.svg
  - text: Use Pre-Operation for logic that must modify the target entity's data before it is saved to the database (e.g., setting default values, computed fields).
    icon: icons/database.svg
  - text: Use Post-Operation for logic that must execute after the record has been committed (e.g., creating related records, sending notifications, audit logging).
    icon: icons/check.svg
  rationale:
  - text: Pre-Validation plugins run outside the database transaction, so rejecting an operation at this stage avoids starting and rolling back a transaction unnecessarily.
    icon: icons/database.svg
  - text: Pre-Operation plugins can modify the Target entity directly, and the changes are included in the same database transaction - no additional Update call is needed.
    icon: icons/workflow.svg
  - text: Post-Operation plugins have access to the final state of the record (including auto-generated fields like the record ID on Create), making them the correct stage for dependent operations.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Pre-Validation: reject deletion of active orders early, before the transaction starts
        if (context.MessageName == "Delete")
        {
            var preImage = context.PreEntityImages["PreImage"];
            if (preImage.GetAttributeValue<OptionSetValue>("statecode")?.Value == 0)
            {
                throw new InvalidPluginExecutionException("Active orders cannot be deleted.");
            }
        }
      language: csharp
    - title: Compliant code example
      code: |-
        // Pre-Operation: set a computed field before the record is saved
        var target = (Entity)context.InputParameters["Target"];
        target["fullname"] = $"{target.GetAttributeValue<string>("firstname")} {target.GetAttributeValue<string>("lastname")}";
        // No Update call needed — changes are saved as part of the transaction
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Post-Operation: modifying the target and calling Update — extra database round-trip
        // This should have been done in Pre-Operation
        var target = (Entity)context.InputParameters["Target"];
        target["fullname"] = $"{target["firstname"]} {target["lastname"]}";
        service.Update(target); // Unnecessary Update call
      language: csharp
  references:
  - title: Event execution pipeline - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/event-framework
  - title: Write a plug-in - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/write-plug-in
- id: PLG-009
  title: Do not use ExecuteMultipleRequest inside plugin code.
  description: Do not use ExecuteMultipleRequest inside plugin code. Use it only from external client applications.
  guidelines:
  - text: When a plugin needs to create or update multiple records, use individual IOrganizationService calls within the plugin.
    icon: icons/code-xml.svg
  - text: Reserve ExecuteMultipleRequest for external integrations, data migration tools, and client-side batch operations.
    icon: icons/database.svg
  rationale:
  - text: ExecuteMultipleRequest inside a plugin can cause recursive triggers, bypass depth tracking, and lead to unexpected behavior in the pipeline.
    icon: icons/workflow.svg
  - text: Each operation within an ExecuteMultiple call may trigger its own set of plugins and workflows, compounding execution time and potentially exceeding the 2-minute timeout for synchronous plugins.
    icon: icons/code-xml.svg
  - text: ExecuteMultipleRequest is designed for client-side batching to reduce network round-trips. Inside a plugin, network latency is not a factor since the call is already executing on the server.
    icon: icons/book-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Create related records individually inside the plugin
        foreach (var detail in orderDetails)
        {
            var entity = new Entity("orderdetail");
            entity["productid"] = detail.ProductId;
            entity["quantity"] = detail.Quantity;
            entity["salesorderid"] = new EntityReference("salesorder", orderId);
            service.Create(entity);
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Using ExecuteMultiple inside a plugin — risk of recursion and timeouts
        var request = new ExecuteMultipleRequest
        {
            Requests = new OrganizationRequestCollection(),
            Settings = new ExecuteMultipleSettings { ContinueOnError = false, ReturnResponses = true }
        };
        foreach (var detail in orderDetails)
        {
            request.Requests.Add(new CreateRequest { Target = detail });
        }
        service.Execute(request); // Avoid this inside plugins
      language: csharp
  references:
  - title: Do not use batch request types in plug-ins and workflow activities - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic/do-not-use-batch-request-types-in-plug-ins-and-workflow-activities
- id: PLG-010
  title: Register plugins only for the specific messages and tables required.
  description: Register plugins only for the specific messages and tables required. Register only the filtering attributes necessary for Update messages.
  guidelines:
  - text: Do not register a plugin on all entities or all messages if it only applies to specific ones.
    icon: icons/code-xml.svg
  - text: When registering on the Update message, specify filtering attributes so the plugin only fires when relevant fields change.
    icon: icons/database.svg
  - text: Limit plugin step registration to the minimum scope needed.
    icon: icons/workflow.svg
  rationale:
  - text: Unnecessary plugin registrations add overhead to every operation on the registered table, even when the plugin logic does not apply.
    icon: icons/database.svg
  - text: Filtering attributes on Update steps prevent the plugin from executing on every field change, significantly reducing unnecessary executions.
    icon: icons/workflow.svg
  - text: A narrower registration scope makes the system more predictable and easier to debug.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: A plugin registered on the Update message of the Account table with filtering
      text: A plugin registered on the Update message of the Account table with filtering attributes set to emailaddress1, statuscode - it only fires when the email or status changes.
      icon: icons/database.svg
    bad:
    - title: A plugin registered on the Update message of the Account table with no
      text: A plugin registered on the Update message of the Account table with no filtering attributes - it fires on every single field update, including irrelevant changes like modifying the description.
      icon: icons/file-text.svg
    - title: A plugin registered on all messages of a table when it only needs to run on
      text: A plugin registered on all messages of a table when it only needs to run on Create.
      icon: icons/code-xml.svg
  references:
  - title: Register a plug-in - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/register-plug-in
- id: PLG-011
  title: Do not use multithreading, Task.Run, Parallel.ForEach, or any form
  description: Do not use multithreading, Task.Run, Parallel.ForEach, or any form of asynchronous parallelism inside plugin code.
  guidelines:
  - text: All plugin logic must execute synchronously on the calling thread.
    icon: icons/code-xml.svg
  - text: Do not use Task, Thread, Parallel, async/await, or ThreadPool inside plugins.
    icon: icons/circle-alert.svg
  rationale:
  - text: Dataverse plugins execute in a sandboxed environment with strict resource constraints. The platform does not support multithreading, and spawning threads can cause crashes, data corruption, or unpredictable behavior.
    icon: icons/database.svg
  - text: Background threads may outlive the plugin execution context, losing access to the IOrganizationService, ITracingService, and other platform services.
    icon: icons/code-xml.svg
  - text: The sandbox environment may terminate threads at any time without warning, leading to partially completed operations.
    icon: icons/book-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Sequential processing — safe and predictable
        foreach (var record in recordsToProcess)
        {
            service.Update(record);
        }
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Parallel processing inside a plugin — unstable and unsupported
        Parallel.ForEach(recordsToProcess, record =>
        {
            service.Update(record);
        });
      language: csharp
    - title: Non-compliant code example
      code: |-
        // async/await inside a plugin — not supported in the sandbox
        await Task.Run(() => service.Update(record));
      language: csharp
  references:
  - title: Plug-in design best practices - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/best-practices/business-logic
- id: PLG-012
  title: Keep synchronous plugins lightweight.
  description: Keep synchronous plugins lightweight. Offload long-running or non-critical work to asynchronous plugins or Power Automate flows.
  guidelines:
  - text: Synchronous plugins (Pre-Validation, Pre-Operation, Post-Operation synchronous) block the user's save operation. Keep execution time to a minimum.
    icon: icons/users.svg
  - text: Move non-critical processing such as notifications, audit logging, and external API calls to asynchronous (Post-Operation Async) plugin steps or Power Automate flows.
    icon: icons/workflow.svg
  - text: Be aware of the 2-minute timeout limit for synchronous plugins.
    icon: icons/code-xml.svg
  rationale:
  - text: Synchronous plugins execute within the user's request pipeline. Slow plugins cause the UI to freeze, resulting in a poor user experience.
    icon: icons/workflow.svg
  - text: If a synchronous plugin exceeds the 2-minute timeout, the entire operation fails and rolls back, potentially causing data loss.
    icon: icons/database.svg
  - text: Asynchronous processing decouples the user experience from background work, improving responsiveness without sacrificing functionality.
    icon: icons/users.svg
  examples:
    good:
    - title: A synchronous Pre-Operation plugin that validates a field format - executes in
      text: A synchronous Pre-Operation plugin that validates a field format - executes in milliseconds.
      icon: icons/database.svg
    - title: An asynchronous Post-Operation plugin that sends an email notification after a
      text: An asynchronous Post-Operation plugin that sends an email notification after a Case is created.
      icon: icons/code-xml.svg
    bad:
    - title: A synchronous Post-Operation plugin that calls an external REST API to validate
      text: A synchronous Post-Operation plugin that calls an external REST API to validate an address, adding 3–5 seconds of network latency to every save.
      icon: icons/check.svg
    - title: A synchronous plugin that processes 500 related records in a loop, causing a
      text: A synchronous plugin that processes 500 related records in a loop, causing a 30-second delay on the form.
      icon: icons/workflow.svg
  references:
