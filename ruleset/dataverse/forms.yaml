topic: Dataverse
subtopic: Forms
description: Good practices for Dataverse Forms.
rules:
- id: FRM-001
  title: Have a hidden Admin tab containing all the system attributes, including state
  description: Every table main form must have a hidden Admin tab containing all the system attributes, including state, status, owner, creation date, owning business unit, and modification dates. You can use a tool like Level up for Dynamics to make the tab visible and access the values. !Hidden Admin Tab !Hidden Admin Tab
  guidelines:
  - text: Every table main form must have a hidden Admin tab containing all the system attributes, including state, status, owner, creation date, owning business unit, and modification dates. You can use a tool like Level up for Dynamics to make the tab visible and access the values. !Hidden Admin Tab !Hidden Admin Tab
    icon: icons/database.svg
  rationale:
  - text: Testers and developers often need to access and update system attribute values. Having them in a hidden tab facilitates debugging and testing tasks.
    icon: icons/check.svg
  - text: Keeping the tab hidden by default prevents end users from accidentally modifying system attributes.
    icon: icons/users.svg
  examples:
    good:
    - title: Conforms to the rule requirements.
      text: Conforms to the rule requirements.
      icon: icons/lightbulb.svg
    bad:
    - title: Violates the rule requirements.
      text: Violates the rule requirements.
      icon: icons/check.svg
  references:
  - title: Microsoft Learn - Power Platform Documentation
    url: https://learn.microsoft.com/en-us/power-platform/
- id: FRM-002
  title: Organize form content using tabs and sections with clear, descriptive names.
  description: Organize form content using tabs and sections with clear, descriptive names.
  guidelines:
  - text: Use tabs to represent major logical groupings of information (e.g., "General", "Details", "Related Records").
    icon: icons/lightbulb.svg
  - text: Use sections within tabs to further organize related fields.
    icon: icons/database.svg
  - text: Place the most frequently used fields and tabs first.
    icon: icons/check.svg
  - text: Limit the number of tabs to 3-5 to avoid overwhelming users.
    icon: icons/users.svg
  - text: Limit sections to 5-7 fields each to keep forms readable.
    icon: icons/book-open.svg
  - text: Name tabs and sections using clear, user-friendly language. Avoid technical jargon.
    icon: icons/pencil.svg
  rationale:
  - text: Well-organized forms improve user productivity by reducing the time needed to find and fill in information.
    icon: icons/users.svg
  - text: Logical grouping of fields reduces cognitive load and improves data entry accuracy.
    icon: icons/database.svg
  - text: Too many tabs or fields on a single section creates a cluttered interface that overwhelms users.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        Tab: General
          Section: Customer Information     → Name, Email, Phone
          Section: Address                  → Street, City, Country

        Tab: Order History
          Section: Recent Orders            → Subgrid with last 10 orders
      language: Plain Text
    bad:
    - title: Non-compliant code example
      code: |-
        Tab: Tab1
          Section: Section1  → Name, Email, Phone, Street, City, Country,
                                Order Date, Total, Status, Notes, Category,
                                Priority, Source, Rating, ...
      language: Plain Text
  references:
  - title: Design productive main forms - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/design-productive-forms
- id: FRM-003
  title: Optimize form load performance by minimizing the number of controls and scripts
  description: Optimize form load performance by minimizing the number of controls and scripts loaded on the form.
  guidelines:
  - text: Limit the number of subgrids on a single form. Each subgrid triggers an additional data query on load.
    icon: icons/database.svg
  - text: Set non-essential tabs to expand only when clicked ("collapsed by default") to defer data loading.
    icon: icons/lightbulb.svg
  - text: Avoid adding unnecessary web resources, timers, or custom controls that increase load time.
    icon: icons/circle-alert.svg
  - text: Keep JavaScript event handlers lean and use asynchronous calls for any Web API operations.
    icon: icons/code-xml.svg
  - text: Minimize the number of business rules per form. Consolidate overlapping rules where possible.
    icon: icons/check.svg
  rationale:
  - text: Every control on a form contributes to load time. Subgrids, quick view forms, and web resources each trigger additional server requests.
    icon: icons/workflow.svg
  - text: Deferring the loading of non-essential tabs significantly reduces initial form load time, especially on forms with many related records.
    icon: icons/lightbulb.svg
  - text: Poorly optimized JavaScript or excessive business rules can block the form rendering pipeline and degrade the user experience.
    icon: icons/users.svg
  examples:
    good:
    - title: A form with 2 subgrids in the "Related Records" tab, which is collapsed by
      text: A form with 2 subgrids in the "Related Records" tab, which is collapsed by default.
      icon: icons/lightbulb.svg
    - title: JavaScript web resources loaded only on forms that require them, using
      text: JavaScript web resources loaded only on forms that require them, using asynchronous Xrm.WebApi calls.
      icon: icons/code-xml.svg
    bad:
    - title: A form with 6 subgrids all visible on the first tab, causing 6+ simultaneous
      text: A form with 6 subgrids all visible on the first tab, causing 6+ simultaneous data queries on form load.
      icon: icons/database.svg
    - title: A synchronous XMLHttpRequest call in the OnLoad event that blocks form
      text: A synchronous XMLHttpRequest call in the OnLoad event that blocks form rendering for several seconds.
      icon: icons/check.svg
  references:
  - title: Optimize form performance - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/optimize-form-performance
- id: FRM-004
  title: When using business rules on forms, set the scope appropriately and avoid
  description: When using business rules on forms, set the scope appropriately and avoid duplicating logic.
  guidelines:
  - text: Set the scope to Table if the rule should apply across all forms, views, and server-side operations (e.g., imports, API calls).
    icon: icons/database.svg
  - text: Set the scope to a specific Form only if the logic is unique to that form.
    icon: icons/lightbulb.svg
  - text: Avoid duplicating the same logic in both business rules and JavaScript. Choose one approach and be consistent.
    icon: icons/code-xml.svg
  - text: 'Name business rules descriptively following a pattern like: [Table Name] - [Purpose].'
    icon: icons/pencil.svg
  rationale:
  - text: Table-scoped business rules enforce logic server-side, which means the rules apply even when records are created via imports, workflows, or API calls - not just the UI.
    icon: icons/database.svg
  - text: Form-scoped rules only execute when a user opens that specific form, which can lead to inconsistent data if records are modified through other channels.
    icon: icons/users.svg
  - text: Duplicating logic between business rules and JavaScript increases maintenance effort and creates a risk of conflicting behavior.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: A business rule named Contact - Set Phone Required When Type Is Customer scoped
      text: A business rule named Contact - Set Phone Required When Type Is Customer scoped to the Table level, ensuring the phone number is always required regardless of how the Contact is created.
      icon: icons/database.svg
    bad:
    - title: A business rule that hides a field, combined with a JavaScript OnLoad handler
      text: A business rule that hides a field, combined with a JavaScript OnLoad handler that also hides the same field, causing confusion about which one controls the behavior.
      icon: icons/code-xml.svg
    - title: A form-scoped business rule that sets a field as required, but records created
      text: A form-scoped business rule that sets a field as required, but records created via data import skip the rule entirely, resulting in incomplete data.
      icon: icons/check.svg
  references:
  - title: Create business rules - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-business-rules-recommendations-apply-logic-form
- id: FRM-005
  title: Use Quick View Forms to display related record information without requiring
  description: Use Quick View Forms to display related record information without requiring navigation away from the current form.
  guidelines:
  - text: Design Quick View Forms to show only the most relevant summary fields from the related record.
    icon: icons/database.svg
  - text: Keep Quick View Forms small - ideally 3-5 fields.
    icon: icons/eye.svg
  - text: Do not use Quick View Forms for data entry. They are read-only by design.
    icon: icons/circle-alert.svg
  - text: Avoid placing multiple Quick View Forms on the same tab, as each one generates an additional data query.
    icon: icons/lightbulb.svg
  rationale:
  - text: Quick View Forms provide contextual information from related records directly on the parent form, reducing the need for users to navigate between records.
    icon: icons/users.svg
  - text: Overloading Quick View Forms with too many fields defeats their purpose and impacts form load time.
    icon: icons/database.svg
  - text: Each Quick View Form triggers a separate data retrieval call, so excessive use on a single form degrades performance.
    icon: icons/workflow.svg
  examples:
    good:
    - title: A Quick View Form on the Case form showing the related Customer's name, phone
      text: A Quick View Form on the Case form showing the related Customer's name, phone number, and account tier - just enough context for the support agent.
      icon: icons/pencil.svg
    bad:
    - title: A Quick View Form on the Case form displaying 15+ fields from the Customer
      text: A Quick View Form on the Case form displaying 15+ fields from the Customer record, including fields that are rarely relevant to case handling.
      icon: icons/database.svg
    - title: Three Quick View Forms on the same form tab, each loading data from different
      text: Three Quick View Forms on the same form tab, each loading data from different related tables simultaneously.
      icon: icons/eye.svg
  references:
  - title: Create and edit quick view forms - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/create-edit-quick-view-forms
- id: FRM-006
  title: Have a description that explains its purpose and intended audience.
  description: Every form must have a description that explains its purpose and intended audience.
  guidelines:
  - text: 'State the purpose: Explain what the form is used for in one or two sentences.'
    icon: icons/lightbulb.svg
  - text: 'Identify the audience: Indicate which user roles or teams are expected to use this form.'
    icon: icons/shield-alert.svg
  - text: 'Note special behavior: Mention any business rules, JavaScript handlers, or non-obvious behavior associated with the form.'
    icon: icons/file-text.svg
  rationale:
  - text: Dataverse tables can have multiple forms. Without descriptions, it is difficult to determine which form to assign to which security role or use case.
    icon: icons/shield-alert.svg
  - text: Descriptions provide immediate context when managing forms in the solution, reducing the risk of accidental modifications to the wrong form.
    icon: icons/file-text.svg
  - text: Documenting special behavior helps future developers understand the form's logic without having to inspect every event handler and business rule.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: '"Main form for the Customer Service team.'
      text: '"Main form for the Customer Service team. Displays case details, communication history, and SLA timers. Includes a business rule to enforce phone number when origin is Phone."'
      icon: icons/users.svg
    - title: '"Quick create form for the Sales team.'
      text: '"Quick create form for the Sales team. Captures essential lead information (name, email, source) for rapid entry during phone calls."'
      icon: icons/pencil.svg
    bad:
    - title: '"Main form" - meaningless, does not differentiate from other forms.'
      text: '"Main form" - meaningless, does not differentiate from other forms.'
      icon: icons/lightbulb.svg
    - title: No description at all - administrators have no way to tell forms apart beyond
      text: No description at all - administrators have no way to tell forms apart beyond their name.
      icon: icons/file-text.svg
  references:
  - title: Create and edit model-driven app forms - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/model-driven-apps/create-design-forms

