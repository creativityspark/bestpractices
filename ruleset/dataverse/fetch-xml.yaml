topic: Dataverse
subtopic: Fetch XML
description: Good practices for Dataverse Fetch XML queries.
rules:
- id: FXL-001
  title: Always specify the columns you need explicitly using <attribute /> elements.
  description: Always specify the columns you need explicitly using <attribute /> elements. Never use <all-attributes /> in production queries.
  guidelines:
  - text: Always specify the columns you need explicitly using <attribute /> elements. Never use <all-attributes /> in production queries.
    icon: icons/database.svg
  rationale:
  - text: Retrieving all columns transfers unnecessary data, increasing memory usage, network overhead, and response time.
    icon: icons/database.svg
  - text: Selecting only the required columns allows the platform to optimize data retrieval and reduces the load on the Dataverse SQL backend.
    icon: icons/check.svg
  - text: Queries with fewer columns are easier to read and maintain.
    icon: icons/book-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch>
          <entity name="account">
            <attribute name="name" />
            <attribute name="accountnumber" />
            <attribute name="emailaddress1" />
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch>
          <entity name="account">
            <all-attributes />
          </entity>
        </fetch>
      language: xml
  references:
  - title: Use FetchXML to construct a query - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/use-fetchxml-construct-query
  - title: Query data using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/overview
- id: FXL-002
  title: Use <filter> and <condition> elements to reduce the result set on the server.
  description: Use <filter> and <condition> elements to reduce the result set on the server. Never retrieve a large data set and filter it client-side.
  guidelines:
  - text: Apply conditions that narrow the result set as early as possible.
    icon: icons/lightbulb.svg
  - text: Filter on indexed columns (primary keys, lookup columns, statecode, createdon, modifiedon) whenever possible.
    icon: icons/database.svg
  - text: Place filters inside <link-entity> elements to reduce the joined data before it reaches the parent entity.
    icon: icons/link.svg
  rationale:
  - text: Server-side filtering lets the database engine use indexes and query plans to return data efficiently.
    icon: icons/database.svg
  - text: Client-side filtering wastes bandwidth and memory by downloading rows that will be discarded.
    icon: icons/lightbulb.svg
  - text: Filtering on non-indexed columns forces full table scans, which degrade performance significantly on large tables.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch>
          <entity name="contact">
            <attribute name="firstname" />
            <attribute name="lastname" />
            <filter type="and">
              <condition attribute="statecode" operator="eq" value="0" />
              <condition attribute="createdon" operator="last-x-days" value="30" />
            </filter>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch>
          <entity name="contact">
            <all-attributes />
          </entity>
        </fetch>
      language: xml
    - title: Non-compliant code example
      code: |-
        // Anti-pattern: filtering thousands of records in memory
        var recentContacts = allContacts.Where(c => c.CreatedOn > DateTime.Now.AddDays(-30));
      language: csharp
  references:
  - title: Optimize performance using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/optimize-performance
  - title: Filter rows using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/filter-rows
- id: FXL-003
  title: Use paging to retrieve large data sets in manageable chunks.
  description: Use paging to retrieve large data sets in manageable chunks. Never attempt to fetch all records in a single request.
  guidelines:
  - text: Set the count attribute on the <fetch> element to define the page size.
    icon: icons/database.svg
  - text: Use the page attribute and the paging cookie returned by the platform to navigate through pages.
    icon: icons/lightbulb.svg
  - text: A page size between 50 and 5000 is recommended depending on the scenario. Smaller page sizes are more appropriate for interactive experiences.
    icon: icons/check.svg
  rationale:
  - text: Dataverse limits the number of records returned in a single request (default 5000). Queries that exceed this limit require paging to retrieve all results.
    icon: icons/database.svg
  - text: Fetching too many records in a single request can cause timeouts, throttling, or excessive memory usage.
    icon: icons/lightbulb.svg
  - text: Paging cookies improve performance on subsequent page retrievals by allowing the server to resume where it left off.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch page="1" count="500">
          <entity name="account">
            <attribute name="name" />
            <filter>
              <condition attribute="statecode" operator="eq" value="0" />
            </filter>
          </entity>
        </fetch>
      language: xml
    - title: Compliant code example
      code: |-
        <fetch page="2" count="500" paging-cookie="&lt;cookie page=&quot;1&quot;&gt;...&lt;/cookie&gt;">
          <entity name="account">
            <attribute name="name" />
            <filter>
              <condition attribute="statecode" operator="eq" value="0" />
            </filter>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch>
          <entity name="account">
            <attribute name="name" />
          </entity>
        </fetch>
      language: xml
  references:
  - title: Page results using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/page-results
- id: FXL-004
  title: Keep <link-entity> joins to a minimum.
  description: Keep <link-entity> joins to a minimum. Only join tables that are necessary for the query results.
  guidelines:
  - text: Avoid deeply nested <link-entity> chains (more than two levels deep).
    icon: icons/link.svg
  - text: If you only need to filter by a related table but do not need its columns, consider using a <link-entity> with no <attribute> elements.
    icon: icons/database.svg
  - text: If you need data from many related tables, consider breaking the query into multiple simpler queries instead of one complex query.
    icon: icons/lightbulb.svg
  rationale:
  - text: Each <link-entity> adds a SQL JOIN to the generated query, increasing complexity and execution time.
    icon: icons/database.svg
  - text: Deeply nested joins can cause exponential growth in the intermediate result set, leading to timeouts.
    icon: icons/lightbulb.svg
  - text: Simpler queries are easier to debug, maintain, and optimize.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch>
          <entity name="contact">
            <attribute name="firstname" />
            <attribute name="lastname" />
            <link-entity name="account" from="accountid" to="parentcustomerid" link-type="inner">
              <attribute name="name" />
              <filter>
                <condition attribute="statecode" operator="eq" value="0" />
              </filter>
            </link-entity>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch>
          <entity name="contact">
            <all-attributes />
            <link-entity name="account" from="accountid" to="parentcustomerid">
              <all-attributes />
              <link-entity name="opportunity" from="parentaccountid" to="accountid">
                <all-attributes />
                <link-entity name="product" from="productid" to="productid">
                  <all-attributes />
                  <link-entity name="pricelevel" from="pricelevelid" to="pricelevelid">
                    <all-attributes />
                  </link-entity>
                </link-entity>
              </link-entity>
            </link-entity>
          </entity>
        </fetch>
      language: xml
  references:
  - title: Join tables using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/join-tables
- id: FXL-005
  title: Choose the appropriate link-type for <link-entity> based on the data you need.
  description: Choose the appropriate link-type for <link-entity> based on the data you need.
  guidelines:
  - text: Use inner (the default) when you only want records that have a matching related record.
    icon: icons/lightbulb.svg
  - text: Use outer when you need all records from the parent entity, including those without a match in the related entity.
    icon: icons/check.svg
  - text: When using outer joins with aggregate queries, be aware that unmatched rows produce NULL values that affect counts and other aggregations.
    icon: icons/circle-alert.svg
  rationale:
  - text: Using inner when outer is needed silently drops records that do not have a related record, leading to incomplete results.
    icon: icons/circle-alert.svg
  - text: Using outer when inner is appropriate returns unnecessary rows with null values, increasing the result set size and potentially causing confusion.
    icon: icons/lightbulb.svg
  - text: Mismatched join types are a common source of bugs in FetchXML queries that are difficult to diagnose.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch>
          <entity name="account">
            <attribute name="name" />
            <link-entity name="contact" from="parentcustomerid" to="accountid" link-type="outer" alias="c">
              <attribute name="fullname" />
            </link-entity>
          </entity>
        </fetch>
      language: xml
    - title: Compliant code example
      code: |-
        <fetch>
          <entity name="account">
            <attribute name="name" />
            <link-entity name="contact" from="parentcustomerid" to="accountid" link-type="inner">
              <attribute name="fullname" />
            </link-entity>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <!-- This silently excludes accounts with no contacts -->
        <fetch>
          <entity name="account">
            <attribute name="name" />
            <link-entity name="contact" from="parentcustomerid" to="accountid" link-type="inner">
              <attribute name="fullname" />
            </link-entity>
          </entity>
        </fetch>
      language: xml
  references:
  - title: Join tables using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/join-tables
- id: FXL-006
  title: Use the no-lock attribute for read-only or reporting queries where real-time
  description: Use the no-lock attribute for read-only or reporting queries where real-time data accuracy is not critical.
  guidelines:
  - text: Add no-lock="true" to the <fetch> element for queries used in dashboards, reports, or batch reads.
    icon: icons/database.svg
  - text: Do not use no-lock for queries that feed into write operations or where data consistency is required.
    icon: icons/check.svg
  rationale:
  - text: The no-lock attribute tells Dataverse to read data without acquiring shared locks, reducing lock contention and improving query performance.
    icon: icons/database.svg
  - text: Without no-lock, read queries can be blocked by concurrent write operations, increasing response times.
    icon: icons/book-open.svg
  - text: The trade-off is that no-lock queries may return uncommitted data (dirty reads), which is acceptable for reporting scenarios but not for transactional logic.
    icon: icons/workflow.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch no-lock="true">
          <entity name="opportunity">
            <attribute name="name" />
            <attribute name="estimatedvalue" />
            <filter>
              <condition attribute="statecode" operator="eq" value="0" />
            </filter>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <!-- Dangerous: reading uncommitted data before updating records -->
        <fetch no-lock="true">
          <entity name="salesorder">
            <attribute name="totalamount" />
            <filter>
              <condition attribute="statecode" operator="eq" value="0" />
            </filter>
          </entity>
        </fetch>
      language: xml
  references:
  - title: FetchXml reference - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/reference/
  - title: Optimize performance using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/optimize-performance
- id: FXL-007
  title: Prefer the eq and in operators over like for filter conditions.
  description: Prefer the eq and in operators over like for filter conditions. Use wildcard operators only when pattern matching is genuinely required.
  guidelines:
  - text: Use eq for exact value matches.
    icon: icons/lightbulb.svg
  - text: Use in when checking against a known set of values instead of chaining multiple or conditions.
    icon: icons/check.svg
  - text: Reserve like with wildcards (%) for legitimate search scenarios such as user-driven search fields.
    icon: icons/database.svg
  rationale:
  - text: The eq and in operators allow the database to use indexes efficiently, resulting in fast lookups.
    icon: icons/database.svg
  - text: The like operator with leading wildcards (e.g., %value) prevents index usage and forces a full table scan.
    icon: icons/lightbulb.svg
  - text: Replacing multiple or conditions with a single in condition produces a cleaner query and can improve performance.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <filter type="and">
          <condition attribute="statecode" operator="eq" value="0" />
          <condition attribute="accountnumber" operator="in">
            <value>ACC-001</value>
            <value>ACC-002</value>
            <value>ACC-003</value>
          </condition>
        </filter>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <filter type="and">
          <condition attribute="name" operator="like" value="%Contoso%" />
        </filter>
      language: xml
    - title: Non-compliant code example
      code: |-
        <filter type="and">
          <condition attribute="name" operator="begins-with" value="Contoso" />
        </filter>
      language: xml
    - title: Non-compliant code example
      code: |-
        <!-- Verbose and harder to maintain -->
        <filter type="or">
          <condition attribute="accountnumber" operator="eq" value="ACC-001" />
          <condition attribute="accountnumber" operator="eq" value="ACC-002" />
          <condition attribute="accountnumber" operator="eq" value="ACC-003" />
        </filter>
      language: xml
  references:
  - title: Filter rows using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/filter-rows
- id: FXL-008
  title: Use the top attribute on the <fetch> element when you only need a limited number
  description: Use the top attribute on the <fetch> element when you only need a limited number of records.
  guidelines:
  - text: Set top when retrieving a fixed number of records (e.g., the most recent 10 orders).
    icon: icons/lightbulb.svg
  - text: Do not combine top with the page and count paging attributes - use one approach or the other.
    icon: icons/circle-alert.svg
  rationale:
  - text: The top attribute tells the server to stop processing as soon as the specified number of records is found, reducing execution time and resource usage.
    icon: icons/workflow.svg
  - text: Without top, the server may process the entire result set even if only a few records are needed.
    icon: icons/lightbulb.svg
  - text: Combining top with paging attributes leads to unpredictable behavior and is not supported.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch top="10">
          <entity name="salesorder">
            <attribute name="name" />
            <attribute name="totalamount" />
            <order attribute="createdon" descending="true" />
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch>
          <entity name="salesorder">
            <attribute name="name" />
            <attribute name="totalamount" />
            <order attribute="createdon" descending="true" />
          </entity>
        </fetch>
      language: xml
  references:
  - title: 'FetchXml reference: fetch element - Microsoft Learn'
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/reference/fetch
  - title: Query data using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/overview
- id: FXL-009
  title: Use aggregate and grouping queries carefully.
  description: Use aggregate and grouping queries carefully. Avoid unnecessary aggregations and ensure grouping columns are indexed.
  guidelines:
  - text: Only use aggregate functions (count, sum, avg, min, max) when the business requirement calls for summarized data.
    icon: icons/database.svg
  - text: Include a groupby attribute on columns that define the grouping. Do not aggregate without grouping unless you need a single grand total.
    icon: icons/circle-alert.svg
  - text: When using distinct="true", verify the results are correct - outer joins can introduce unexpected duplicates or nulls.
    icon: icons/check.svg
  rationale:
  - text: Aggregate queries are more resource-intensive than standard retrieval queries because the server must scan and compute across potentially large data sets.
    icon: icons/database.svg
  - text: Grouping on non-indexed columns forces the database to sort and group large volumes of data in memory, which can cause timeouts.
    icon: icons/lightbulb.svg
  - text: Misuse of distinct with outer joins can produce misleading counts or silently exclude valid records.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <fetch aggregate="true">
          <entity name="opportunity">
            <attribute name="ownerid" groupby="true" alias="owner" />
            <attribute name="opportunityid" aggregate="count" alias="total" />
            <filter>
              <condition attribute="statecode" operator="eq" value="0" />
            </filter>
          </entity>
        </fetch>
      language: xml
    bad:
    - title: Non-compliant code example
      code: |-
        <fetch aggregate="true">
          <entity name="activitypointer">
            <attribute name="activityid" aggregate="count" alias="total" />
          </entity>
        </fetch>
      language: xml
  references:
  - title: Aggregate data using FetchXml - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/aggregate-data
- id: FXL-010
  title: Build FetchXML queries programmatically using the SDK
  description: Build FetchXML queries programmatically using the SDK QueryExpression-to-FetchXML conversion or dedicated builder libraries. Avoid constructing FetchXML by string concatenation.
  guidelines:
  - text: Use the Dataverse SDK methods (e.g., QueryExpressionToFetchXmlRequest) or community FetchXML builder tools to generate queries.
    icon: icons/database.svg
  - text: If string construction is unavoidable, always sanitize user input to prevent FetchXML injection.
    icon: icons/users.svg
  - text: Store complex or reusable FetchXML queries as saved queries or user queries in Dataverse.
    icon: icons/lightbulb.svg
  rationale:
  - text: String concatenation is error-prone and can introduce malformed XML, missing closing tags, or incorrect attribute escaping.
    icon: icons/circle-alert.svg
  - text: Unsanitized user input in dynamically built FetchXML strings can lead to injection attacks, allowing users to modify the query logic.
    icon: icons/database.svg
  - text: Builder tools and SDK conversions produce valid, well-formed XML every time and are easier to maintain.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        var query = new QueryExpression("account");
        query.ColumnSet = new ColumnSet("name", "accountnumber");
        query.Criteria.AddCondition("statecode", ConditionOperator.Equal, 0);

        var request = new QueryExpressionToFetchXmlRequest { Query = query };
        var response = (QueryExpressionToFetchXmlResponse)service.Execute(request);
        string fetchXml = response.FetchXml;
      language: csharp
    bad:
    - title: Non-compliant code example
      code: |-
        // Dangerous: user input is injected directly into the query
        string fetchXml = @"<fetch>
          <entity name='account'>
            <attribute name='name' />
            <filter>
              <condition attribute='name' operator='eq' value='" + userInput + @"' />
            </filter>
          </entity>
        </fetch>";
      language: csharp
  references:
  - title: Build queries with QueryExpression - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/org-service/build-queries-with-queryexpression
  - title: FetchXml reference - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/fetchxml/reference/

