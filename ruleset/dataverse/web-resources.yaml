topic: Web Resources
description: Good practices for Dataverse Web Resources.
rules:
- id: WR-001
  title: Use a consistent naming convention with virtual folder structures for all web
  description: Use a consistent naming convention with virtual folder structures for all web resources.
  guidelines:
  - text: Always start the name with the publisher prefix followed by a forward slash.
    icon: icons/pencil.svg
  - text: Group web resources by type using virtual folders (e.g., js/, html/, css/, img/).
    icon: icons/folder-open.svg
  - text: Within each type folder, group by entity or feature.
    icon: icons/lightbulb.svg
  - text: Use camelCase or lowercase for file names. Avoid spaces and special characters.
    icon: icons/circle-alert.svg
  - text: Keep the folder hierarchy shallow - no more than 3 levels deep.
    icon: icons/check.svg
  rationale:
  - text: A consistent naming convention makes it easy to locate and manage web resources as the solution grows.
    icon: icons/pencil.svg
  - text: Virtual folder structures simulate a file system within Dataverse, improving organization and discoverability.
    icon: icons/database.svg
  - text: Grouping by entity or feature ensures that related resources are located together, simplifying maintenance.
    icon: icons/folder-open.svg
  - text: Deep nesting makes navigation difficult and names excessively long.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        contoso_/js/account/formEvents.js
        contoso_/js/contact/phoneValidation.js
        contoso_/js/lib/utilities.js
        contoso_/html/account/quickView.html
        contoso_/css/common.css
        contoso_/img/icons/phone.svg
      language: Plain Text
    bad:
    - title: Non-compliant code example
      code: |-
        new_script1.js
        new_script2.js
        accountformeventsvalidationandribbon.js
        contoso_/js/features/module1/submodule2/helpers/internal/utils.js
      language: Plain Text
  references:
  - title: Web resources in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/web-resources
- id: WR-002
  title: Have a display name and a description that explain its purpose and usage.
  description: Every web resource must have a display name and a description that explain its purpose and usage.
  guidelines:
  - text: Set a clear Display Name that describes what the web resource does.
    icon: icons/pencil.svg
  - text: Write a Description that includes the entity or feature it supports, the events it handles, and any dependencies on other web resources.
    icon: icons/file-text.svg
  - text: If the web resource is a shared library, list the web resources that depend on it.
    icon: icons/folder-open.svg
  rationale:
  - text: Dataverse solutions can contain hundreds of web resources. Without display names and descriptions, it is difficult to determine the purpose of each resource.
    icon: icons/database.svg
  - text: Descriptions reduce the risk of accidental modification or deletion by making the resource's usage and dependencies clear.
    icon: icons/file-text.svg
  - text: Good metadata helps onboard new developers and simplifies solution maintenance.
    icon: icons/package.svg
  examples:
    good:
    - title: Display Name
      text: 'Value: Display Name Account Form Events'
      icon: icons/pencil.svg
    - title: Description
      text: 'Value: Description Handles OnLoad, OnSave, and OnChange events for the Account main form. Depends on contoso\/js/lib/utilities.js. Registered on the Account Main Form._'
      icon: icons/file-text.svg
    bad:
    - title: Display Name
      text: 'Value: Display Name Script1'
      icon: icons/code-xml.svg
    - title: Description
      text: 'Value: Description (empty)'
      icon: icons/lightbulb.svg
  references:
  - title: Create or edit web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/create-edit-web-resources
- id: WR-003
  title: Sanitize all user input and dynamic data rendered in HTML web resources
  description: Sanitize all user input and dynamic data rendered in HTML web resources to prevent Cross-Site Scripting (XSS).
  guidelines:
  - text: Never use innerHTML to render user-supplied or entity data. Use textContent or DOM APIs to create elements safely.
    icon: icons/database.svg
  - text: Do not use eval(), new Function(), or setTimeout/setInterval with string arguments.
    icon: icons/circle-alert.svg
  - text: If you must render HTML from dynamic data, use a sanitization library such as DOMPurify.
    icon: icons/check.svg
  - text: Add a Content Security Policy <meta> tag to your HTML web resources to restrict script and style sources.
    icon: icons/shield-alert.svg
  rationale:
  - text: Dataverse records may contain data entered by external users or imported from other systems. This data could contain malicious scripts.
    icon: icons/database.svg
  - text: XSS vulnerabilities can lead to session hijacking, data theft, or unauthorized actions performed on behalf of the logged-in user.
    icon: icons/shield-alert.svg
  - text: A Content Security Policy provides an additional layer of defense by restricting which resources the browser is allowed to load and execute.
    icon: icons/folder-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'">
      language: html
    - title: Compliant code example
      code: |-
        // Using textContent to safely render data
        var output = document.getElementById("output");
        output.textContent = recordName; // Safe — HTML is not parsed
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // Using innerHTML with unsanitized data — vulnerable to XSS
        var output = document.getElementById("output");
        output.innerHTML = "<h1>" + recordName + "</h1>";

        // Using eval to process data
        eval("var data = " + serverResponse);
      language: javascript
  references:
  - title: Content Security Policy (CSP) - MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
  - title: DOMPurify - GitHub
    url: https://github.com/cure53/DOMPurify
  - title: Cross-site scripting prevention - OWASP
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Scripting_Prevention_Cheat_Sheet.html
- id: WR-004
  title: Optimize all image web resources for size and use SVG format whenever possible.
  description: Optimize all image web resources for size and use SVG format whenever possible.
  guidelines:
  - text: Use SVG format for icons, logos, and any graphics that can be represented as vectors.
    icon: icons/lightbulb.svg
  - text: Compress raster images (PNG, JPG, GIF) before uploading them as web resources. Use tools such as TinyPNG, Squoosh, or ImageOptim.
    icon: icons/folder-open.svg
  - text: 'Choose the appropriate raster format: PNG for images requiring transparency, JPG for photographs, and avoid BMP or TIFF entirely.'
    icon: icons/circle-alert.svg
  - text: Keep image dimensions appropriate for their usage context - do not upload a 4000×3000 image for a 32×32 icon.
    icon: icons/check.svg
  - text: Avoid embedding large Base64-encoded images in HTML or CSS web resources.
    icon: icons/code-xml.svg
  rationale:
  - text: SVG files are resolution-independent, scale perfectly on all screen sizes, and are typically much smaller than raster equivalents for icons and simple graphics.
    icon: icons/package.svg
  - text: Unoptimized images are the most common cause of large solution sizes and slow form load times.
    icon: icons/lightbulb.svg
  - text: Dataverse has a 5 MB file size limit per web resource. Optimizing images ensures you stay well within this limit.
    icon: icons/database.svg
  - text: Base64-encoded images bypass browser caching and inflate the size of the parent HTML or CSS file.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: A table icon uploaded as a 2 KB SVG file at contoso_/img/icons/customer.svg.
      text: A table icon uploaded as a 2 KB SVG file at contoso_/img/icons/customer.svg.
      icon: icons/database.svg
    - title: A product photograph compressed from 3.2 MB to 180 KB using TinyPNG before
      text: A product photograph compressed from 3.2 MB to 180 KB using TinyPNG before uploading as contoso_/img/products/widget.jpg.
      icon: icons/lightbulb.svg
    bad:
    - title: A 1.5 MB PNG file used as a 32×32 table icon when a 2 KB SVG would suffice.
      text: A 1.5 MB PNG file used as a 32×32 table icon when a 2 KB SVG would suffice.
      icon: icons/folder-open.svg
    - title: An uncompressed 4000×3000 BMP screenshot uploaded as a dashboard background.
      text: An uncompressed 4000×3000 BMP screenshot uploaded as a dashboard background.
      icon: icons/check.svg
    - title: A 500 KB Base64-encoded logo embedded directly inside an HTML web resource.
      text: A 500 KB Base64-encoded logo embedded directly inside an HTML web resource.
      icon: icons/code-xml.svg
  references:
  - title: Image web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/image-web-resources
  - title: SVG on the web - MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/SVG
  - title: Squoosh - Image compression tool
    url: https://squoosh.app/
- id: WR-005
  title: Prefix all CSS class and ID names with the project or publisher prefix to avoid
  description: Prefix all CSS class and ID names with the project or publisher prefix to avoid collisions with platform styles.
  guidelines:
  - text: 'Use a short, consistent prefix derived from your publisher or project name for all CSS selectors (e.g., .csp-header, #csp-sidebar).'
    icon: icons/pencil.svg
  - text: Do not use generic class names such as .header, .container, or .active without a prefix.
    icon: icons/circle-alert.svg
  - text: Keep CSS in external .css web resource files rather than inline <style> blocks in HTML web resources.
    icon: icons/folder-open.svg
  - text: Avoid using !important to override platform styles - this creates fragile dependencies on the platform's internal CSS.
    icon: icons/lightbulb.svg
  rationale:
  - text: HTML web resources are loaded inside iframes, but in some contexts (e.g., custom pages, embedded resources) CSS can leak across boundaries. Prefixed selectors eliminate the risk of collisions.
    icon: icons/pencil.svg
  - text: Generic class names are commonly used by the platform's own stylesheets. Overriding them can cause unexpected visual side effects.
    icon: icons/lightbulb.svg
  - text: External CSS files can be cached by the browser separately from the HTML, improving load times on subsequent visits.
    icon: icons/folder-open.svg
  - text: Using !important to fight platform styles breaks when Microsoft updates their CSS, leading to unpredictable rendering.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        .csp-dashboard-header {
            font-size: 18px;
            color: #333333;
        }

        .csp-status-badge {
            padding: 4px 8px;
            border-radius: 4px;
        }
      language: css
    bad:
    - title: Non-compliant code example
      code: |-
        .header {
            font-size: 18px;
            color: #333333;
        }

        .container {
            width: 100% !important;
        }
      language: css
  references:
  - title: CSS web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/css-web-resources
- id: WR-006
  title: Keep HTML web resources lightweight, responsive, and well-structured.
  description: Keep HTML web resources lightweight, responsive, and well-structured.
  guidelines:
  - text: Always include a proper <!DOCTYPE html> declaration, a <html lang="..."> attribute, and <meta charset="utf-8">.
    icon: icons/lightbulb.svg
  - text: Keep the HTML structure minimal - avoid unnecessary wrapper elements and deeply nested DOM trees.
    icon: icons/circle-alert.svg
  - text: Use responsive design techniques (relative units, media queries, or a lightweight CSS framework) so the resource renders correctly at different sizes.
    icon: icons/folder-open.svg
  - text: Load JavaScript and CSS from separate web resource files rather than inlining them in the HTML.
    icon: icons/code-xml.svg
  - text: 'Consider accessibility: use semantic HTML elements, provide alt attributes on images, and ensure sufficient color contrast.'
    icon: icons/check.svg
  rationale:
  - text: A proper doctype and character set declaration ensure consistent rendering across all supported browsers.
    icon: icons/lightbulb.svg
  - text: HTML web resources are often displayed inside iframes on forms and dashboards. Excessive DOM complexity increases rendering time within the already constrained iframe.
    icon: icons/folder-open.svg
  - text: Users may resize the form pane or access it from different screen sizes. Responsive design prevents clipped or broken layouts.
    icon: icons/users.svg
  - text: Separating concerns (HTML, CSS, JS) improves cacheability and makes individual files easier to maintain and update independently.
    icon: icons/check.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="Content-Security-Policy"
                  content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'">
            <link rel="stylesheet" href="contoso_/css/dashboard.css">
            <title>Customer Dashboard</title>
        </head>
        <body>
            <main id="csp-dashboard">
                <h1>Customer Overview</h1>
                <div id="csp-dashboard-content"></div>
            </main>
            <script src="contoso_/js/dashboard/main.js"></script>
        </body>
        </html>
      language: html
    bad:
    - title: Non-compliant code example
      code: |-
        <html>
        <body>
        <script>
            // Hundreds of lines of inline JavaScript
        </script>
        <style>
            /* Hundreds of lines of inline CSS */
        </style>
        <div><div><div><div><div>Deeply nested content</div></div></div></div></div>
        </body>
        </html>
      language: html
  references:
  - title: Webpage (HTML) web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/webpage-html-web-resources
- id: WR-007
  title: Declare dependencies between web resources explicitly using the dependency
  description: Declare dependencies between web resources explicitly using the dependency configuration in the solution.
  guidelines:
  - text: Use the web resource dependency settings in the form editor or solution explorer to declare which web resources depend on others.
    icon: icons/settings.svg
  - text: Do not dynamically load web resources at runtime using custom script loaders unless there is no alternative.
    icon: icons/code-xml.svg
  - text: When a JavaScript library depends on a shared utility library, add the utility as a dependency so the platform loads it first.
    icon: icons/lightbulb.svg
  - text: Before exporting a solution, use the Dependency Checker in Solution Explorer to verify that all required web resources are included.
    icon: icons/check.svg
  rationale:
  - text: Explicitly declared dependencies ensure the platform loads web resources in the correct order, preventing runtime errors caused by missing references.
    icon: icons/link.svg
  - text: Dynamic script loading hides dependencies from the solution system. When the solution is exported and imported into another environment, dynamically loaded resources may be missing, causing silent failures.
    icon: icons/code-xml.svg
  - text: The Dependency Checker prevents broken solutions from being deployed to downstream environments by catching missing components before export.
    icon: icons/check.svg
  examples:
    good:
    - title: The form library list shows contoso/js/lib/utilities.js loaded before
      text: The form library list shows contoso/js/lib/utilities.js loaded before contoso/js/account/formEvents.js, because the dependency is declared in the form configuration.
      icon: icons/eye.svg
    - title: The solution's Dependency Checker reports no missing components before export.
      text: The solution's Dependency Checker reports no missing components before export.
      icon: icons/check.svg
    bad:
    - title: A script dynamically loads a utility library at runtime using a custom
      text: A script dynamically loads a utility library at runtime using a custom loadScript() function. The utility library is not included in the solution, and the script fails silently in the target environment after import.
      icon: icons/code-xml.svg
    - title: Two JavaScript libraries are added to a form without specifying their load
      text: Two JavaScript libraries are added to a form without specifying their load order, causing intermittent "function is not defined" errors.
      icon: icons/circle-alert.svg
  references:
  - title: Web resource dependencies - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/web-resource-dependencies
  - title: Solution dependency management - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/solution-dependency-management
- id: WR-008
  title: Periodically audit and remove unused web resources from the solution.
  description: Periodically audit and remove unused web resources from the solution.
  guidelines:
  - text: Review the solution's web resources regularly and identify any that are no longer referenced by forms, dashboards, SiteMaps, or other web resources.
    icon: icons/link.svg
  - text: Before deleting a web resource, verify that it is not referenced by any component using the Show Dependencies feature in Solution Explorer.
    icon: icons/check.svg
  - text: Remove web resources that were added for testing or prototyping and are no longer needed.
    icon: icons/folder-open.svg
  - text: Document the audit in the project's change log or release notes.
    icon: icons/file-text.svg
  rationale:
  - text: Orphaned web resources increase solution size, making exports and imports slower and consuming unnecessary storage.
    icon: icons/package.svg
  - text: Unused resources create confusion for developers who may waste time trying to understand their purpose or inadvertently modify them.
    icon: icons/folder-open.svg
  - text: Keeping the solution clean reduces the risk of accidentally deploying obsolete or conflicting code to production.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: A quarterly review identifies three JavaScript libraries that were replaced six
      text: A quarterly review identifies three JavaScript libraries that were replaced six months ago. They are verified as unused via Show Dependencies and removed from the solution.
      icon: icons/code-xml.svg
    bad:
    - title: A solution contains 40 web resources, but only 15 are actively used.
      text: A solution contains 40 web resources, but only 15 are actively used. The remaining 25 are leftovers from previous development cycles that no one has reviewed or cleaned up.
      icon: icons/package.svg
    - title: A developer deletes a web resource without checking dependencies, breaking a
      text: A developer deletes a web resource without checking dependencies, breaking a form that still references it.
      icon: icons/link.svg
  references:
  - title: View dependencies for a component - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/view-component-dependencies
- id: WR-009
  title: Use RESX web resources for multi-language support instead of hardcoding strings
  description: Use RESX web resources for multi-language support instead of hardcoding strings in HTML or JavaScript files.
  guidelines:
  - text: Create a default RESX file (e.g., contoso_/resx/Strings.resx) containing all user-facing strings.
    icon: icons/users.svg
  - text: Create additional RESX files for each supported language using the locale code suffix (e.g., contoso_/resx/Strings.1036.resx for French).
    icon: icons/pencil.svg
  - text: Use the Xrm.Utility.getResourceString() method to retrieve localized strings at runtime.
    icon: icons/folder-open.svg
  - text: Use the user's language setting (Xrm.Utility.getGlobalContext().userSettings.languageId) to determine which RESX file to load.
    icon: icons/settings.svg
  - text: Keep string keys consistent across all RESX files and use descriptive key names.
    icon: icons/code-xml.svg
  rationale:
  - text: Hardcoded strings force a code change and redeployment every time a translation needs to be added or updated.
    icon: icons/code-xml.svg
  - text: RESX files can be handed to translators without exposing application code.
    icon: icons/folder-open.svg
  - text: The platform's built-in getResourceString() method handles RESX parsing and fallback automatically, reducing custom code.
    icon: icons/lightbulb.svg
  - text: Consistent keys across language files ensure that missing translations are immediately detectable.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        <!-- contoso_/resx/Strings.resx (default — English) -->
        <data name="greeting_message" xml:space="preserve">
            <value>Welcome to the Customer Portal</value>
        </data>
        <data name="save_button_label" xml:space="preserve">
            <value>Save</value>
        </data>
      language: xml
    - title: Compliant code example
      code: |-
        <!-- contoso_/resx/Strings.1036.resx (French) -->
        <data name="greeting_message" xml:space="preserve">
            <value>Bienvenue sur le portail client</value>
        </data>
        <data name="save_button_label" xml:space="preserve">
            <value>Enregistrer</value>
        </data>
      language: xml
    - title: Compliant code example
      code: |-
        // Retrieving a localized string at runtime
        var greeting = Xrm.Utility.getResourceString("contoso_/resx/Strings", "greeting_message");
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // Hardcoded strings in JavaScript — no localization support
        var greeting = "Welcome to the Customer Portal";
        var saveLabel = "Save";
      language: javascript
    - title: Non-compliant code example
      code: |-
        <!-- Hardcoded strings in HTML — requires code change for every language -->
        <h1>Welcome to the Customer Portal</h1>
        <button>Save</button>
      language: html
  references:
  - title: String (RESX) web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/resx-web-resources
  - title: Use RESX files to localize web resources - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/custom-html-resx-localization

