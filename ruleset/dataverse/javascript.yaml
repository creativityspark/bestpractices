topic: Dataverse
subtopic: JavaScript
description: Good practices for Dataverse JavaScript client scripts in model-driven apps.
rules:
- id: JS-001
  title: Use the formContext object obtained from the execution context parameter instead
  description: Use the formContext object obtained from the execution context parameter instead of the deprecated Xrm.Page global object.
  guidelines:
  - text: Always pass the executionContext parameter to your event handler functions.
    icon: icons/settings.svg
  - text: Obtain the form context by calling executionContext.getFormContext().
    icon: icons/lightbulb.svg
  - text: Never reference Xrm.Page directly in new code.
    icon: icons/link.svg
  - text: Migrate existing code that uses Xrm.Page to use formContext as soon as possible.
    icon: icons/code-xml.svg
  rationale:
  - text: Xrm.Page has been deprecated since Dynamics 365 version 9.0 and may be removed in a future release.
    icon: icons/package.svg
  - text: Using formContext makes your functions reusable across main forms, quick create forms, and dialogs.
    icon: icons/lightbulb.svg
  - text: The execution context pattern is the only approach supported in the Unified Interface.
    icon: icons/book-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
            var name = formContext.getAttribute("name").getValue();
        }
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function onLoad() {
            // Xrm.Page is deprecated and will be removed in a future release
            var name = Xrm.Page.getAttribute("name").getValue();
        }
      language: javascript
  references:
  - title: Client API form context - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/clientapi-form-context
  - title: Xrm.Page deprecation - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/xrm-page
- id: JS-002
  title: Organize your code using namespaces to avoid polluting the global scope.
  description: Organize your code using namespaces to avoid polluting the global scope.
  guidelines:
  - text: Wrap all functions in a namespace object using the var MyNamespace = MyNamespace || {}; pattern.
    icon: icons/pencil.svg
  - text: Use a multi-level namespace that reflects the publisher, module, and entity (e.g., Contoso.Sales.Account).
    icon: icons/lightbulb.svg
  - text: Register event handlers using the fully qualified namespace path (e.g., Contoso.Sales.Account.onLoad).
    icon: icons/check.svg
  - text: Never define standalone global functions.
    icon: icons/circle-alert.svg
  rationale:
  - text: Model-driven apps load all registered web resources into the same global scope. Without namespaces, function name collisions can cause unexpected behavior.
    icon: icons/pencil.svg
  - text: Namespaces make it clear which entity and module a function belongs to, improving readability and maintainability.
    icon: icons/book-open.svg
  - text: The fully qualified name in event registration makes it easier to trace which script handles each event.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        var Contoso = Contoso || {};
        Contoso.Account = Contoso.Account || {};

        Contoso.Account.onLoad = function (executionContext) {
            var formContext = executionContext.getFormContext();
            // form logic here
        };

        Contoso.Account.onSave = function (executionContext) {
            var formContext = executionContext.getFormContext();
            // save logic here
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // Global functions risk naming collisions with other web resources
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
        }

        function onSave(executionContext) {
            var formContext = executionContext.getFormContext();
        }
      language: javascript
  references:
  - title: Organize your code - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/client-scripting-best-practices
  - title: Client scripting in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/client-scripting
- id: JS-003
  title: Use only supported Dataverse Client API methods.
  description: Use only supported Dataverse Client API methods. Never manipulate the DOM directly or use unsupported libraries like jQuery to interact with form controls.
  guidelines:
  - text: Use formContext.getAttribute() and formContext.getControl() to read and manipulate form data and controls.
    icon: icons/database.svg
  - text: Never use document.getElementById(), document.querySelector(), or jQuery selectors to access form elements.
    icon: icons/file-text.svg
  - text: Do not modify CSS classes, styles, or HTML attributes on form controls directly.
    icon: icons/circle-alert.svg
  - text: Do not reference internal control IDs or class names, as these change without notice between platform updates.
    icon: icons/pencil.svg
  rationale:
  - text: Microsoft only supports interactions through the documented Client API. Any DOM manipulation is unsupported and can break silently after platform updates.
    icon: icons/workflow.svg
  - text: The internal HTML structure of model-driven app forms changes frequently. Scripts relying on DOM elements will stop working without warning.
    icon: icons/code-xml.svg
  - text: Direct DOM manipulation can interfere with the platform's own rendering logic, causing visual glitches and data inconsistencies.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        function hideField(formContext) {
            formContext.getControl("telephone1").setVisible(false);
        }

        function setFieldValue(formContext) {
            formContext.getAttribute("firstname").setValue("John");
        }

        function disableField(formContext) {
            formContext.getControl("emailaddress1").setDisabled(true);
        }
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function hideField() {
            // Direct DOM manipulation is unsupported and will break
            document.getElementById("telephone1").style.display = "none";
        }

        function setFieldValue() {
            // jQuery is not supported for form control interaction
            $("#firstname").val("John");
        }

        function disableField() {
            // Accessing internal DOM elements will fail after platform updates
            document.querySelector("[data-id='emailaddress1']").setAttribute("disabled", "true");
        }
      language: javascript
  references:
  - title: Client API reference - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference
  - title: Best practices for client scripting - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/client-scripting-best-practices
- id: JS-004
  title: Always use asynchronous API calls.
  description: Always use asynchronous API calls. Never use synchronous XMLHttpRequest or any blocking network call.
  guidelines:
  - text: Use Xrm.WebApi methods (retrieveRecord, retrieveMultipleRecords, createRecord, updateRecord, deleteRecord) which are asynchronous by default.
    icon: icons/lightbulb.svg
  - text: Use async/await or .then() / .catch() to handle asynchronous results.
    icon: icons/check.svg
  - text: Never pass false as the async parameter to XMLHttpRequest.open().
    icon: icons/circle-alert.svg
  - text: For async OnSave handlers, return a Promise so the platform knows when your operation has completed.
    icon: icons/settings.svg
  rationale:
  - text: Synchronous network calls block the browser's main thread, freezing the UI until the call completes. This creates a poor user experience.
    icon: icons/users.svg
  - text: Synchronous XMLHttpRequest is deprecated in modern browsers and will be removed in future versions.
    icon: icons/lightbulb.svg
  - text: The Dataverse platform is optimized for asynchronous operations. Synchronous calls bypass these optimizations and can cause timeouts.
    icon: icons/database.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        async function getAccountName(accountId) {
            try {
                var result = await Xrm.WebApi.retrieveRecord(
                    "account", accountId, "?$select=name"
                );
                return result.name;
            } catch (error) {
                console.error(error.message);
            }
        }
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function getAccountName(accountId) {
            // Synchronous XMLHttpRequest blocks the UI
            var req = new XMLHttpRequest();
            req.open("GET",
                Xrm.Utility.getGlobalContext().getClientUrl() +
                "/api/data/v9.2/accounts(" + accountId + ")?$select=name",
                false // synchronous - NEVER do this
            );
            req.send();
            return JSON.parse(req.responseText).name;
        }
      language: javascript
  references:
  - title: Xrm.WebApi - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/xrm-webapi
  - title: Async event handlers - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/async-event-handlers
- id: JS-005
  title: When using Xrm.WebApi, retrieve only the columns you need by using the $select
  description: When using Xrm.WebApi, retrieve only the columns you need by using the $select query option.
  guidelines:
  - text: Always specify a $select clause with only the fields your logic requires.
    icon: icons/database.svg
  - text: Avoid calling retrieveRecord or retrieveMultipleRecords without $select, which returns all columns.
    icon: icons/circle-alert.svg
  - text: When using $expand for related records, also apply $select on the expanded entity.
    icon: icons/lightbulb.svg
  rationale:
  - text: Retrieving all columns returns unnecessary data, increasing payload size and response time.
    icon: icons/database.svg
  - text: Selecting only the required fields reduces memory consumption and improves performance, especially on mobile clients.
    icon: icons/check.svg
  - text: Excessive data retrieval can contribute to API throttling when combined with multiple concurrent calls.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Retrieves only the name and account number
        Xrm.WebApi.retrieveRecord(
            "account", accountId,
            "?$select=name,accountnumber"
        ).then(function (result) {
            console.log(result.name);
        });
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // Retrieves all columns — unnecessary data transfer
        Xrm.WebApi.retrieveRecord(
            "account", accountId
        ).then(function (result) {
            console.log(result.name);
        });
      language: javascript
  references:
  - title: Retrieve a table row using the Web API - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/retrieve-entity-using-web-api
  - title: Query data using the Web API - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/query-data-web-api
- id: JS-006
  title: Implement proper error handling in all asynchronous operations.
  description: Implement proper error handling in all asynchronous operations. Provide user-friendly feedback when errors occur.
  guidelines:
  - text: Use .catch() on every Promise chain or wrap async/await calls in try/catch blocks.
    icon: icons/lightbulb.svg
  - text: Display meaningful error messages to users using Xrm.Navigation.openAlertDialog.
    icon: icons/users.svg
  - text: In async OnSave handlers, call eventArgs.preventDefault() inside the catch block to prevent saving with invalid or incomplete data.
    icon: icons/database.svg
  - text: Do not silently swallow errors.
    icon: icons/circle-alert.svg
  rationale:
  - text: Unhandled promise rejections can cause scripts to fail silently, leaving the user unaware that an operation did not complete.
    icon: icons/users.svg
  - text: Without preventDefault() in an OnSave error handler, the record may be saved in an inconsistent state.
    icon: icons/circle-alert.svg
  - text: Clear error messages help users and support teams diagnose issues faster.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        async function onSave(executionContext) {
            var eventArgs = executionContext.getEventArgs();
            try {
                var result = await Xrm.WebApi.retrieveRecord(
                    "account", accountId, "?$select=creditlimit"
                );
                if (result.creditlimit < 0) {
                    eventArgs.preventDefault();
                    Xrm.Navigation.openAlertDialog({
                        text: "Credit limit must be a positive value."
                    });
                }
            } catch (error) {
                eventArgs.preventDefault();
                Xrm.Navigation.openAlertDialog({
                    text: "An error occurred while validating: " + error.message
                });
            }
        }
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        async function onSave(executionContext) {
            // No error handling — if the API call fails, the record saves with invalid data
            var result = await Xrm.WebApi.retrieveRecord(
                "account", accountId, "?$select=creditlimit"
            );
            if (result.creditlimit < 0) {
                executionContext.getEventArgs().preventDefault();
            }
        }
      language: javascript
  references:
  - title: Async event handlers - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/async-event-handlers
  - title: Xrm.Navigation - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/xrm-navigation
- id: JS-007
  title: Prefer out-of-the-box features (business rules, calculated fields, Power
  description: Prefer out-of-the-box features (business rules, calculated fields, Power Automate) over client scripts when they can achieve the same result.
  guidelines:
  - text: Use business rules for simple field visibility, requirement levels, and default value logic.
    icon: icons/database.svg
  - text: Use calculated or rollup columns for derived values that do not require user interaction.
    icon: icons/workflow.svg
  - text: Use Power Automate or plug-ins for server-side logic that must execute regardless of how the record is modified.
    icon: icons/check.svg
  - text: Reserve client scripting for complex scenarios that cannot be achieved declaratively.
    icon: icons/code-xml.svg
  rationale:
  - text: Business rules and calculated fields are easier to maintain and do not require development skills to modify.
    icon: icons/database.svg
  - text: Client scripts only execute when a user interacts with the form. Logic implemented only in scripts is bypassed by imports, API calls, workflows, and plug-ins.
    icon: icons/workflow.svg
  - text: Reducing the number of custom scripts lowers the maintenance burden and the risk of upgrade-related issues.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: A business rule sets the Phone field as required when the Contact Method is
      text: A business rule sets the Phone field as required when the Contact Method is "Phone". No script is needed.
      icon: icons/database.svg
    - title: A calculated column computes the total order amount from line items.
      text: A calculated column computes the total order amount from line items. The value is always correct regardless of how the record is updated.
      icon: icons/lightbulb.svg
    bad:
    - title: A JavaScript OnLoad handler hides a field based on a simple condition that
      text: A JavaScript OnLoad handler hides a field based on a simple condition that could be handled by a business rule.
      icon: icons/code-xml.svg
    - title: A client script recalculates a total on every field change, but the total is
      text: A client script recalculates a total on every field change, but the total is incorrect when records are created via data import because the script never runs.
      icon: icons/circle-alert.svg
  references:
  - title: Create business rules - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-business-rules-recommendations-apply-logic-form
  - title: Define calculated columns - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/define-calculated-fields
- id: JS-008
  title: Follow a consistent naming convention for web resource files.
  description: Follow a consistent naming convention for web resource files. Create only one JavaScript file per table.
  guidelines:
  - text: Use the pattern [prefix]/js/[entity].js (e.g., csp/js/account.js).
    icon: icons/pencil.svg
  - text: Create only one JavaScript web resource per table. All event handlers for a table's forms (OnLoad, OnChange, OnSave, ribbon commands) must be in a single file.
    icon: icons/database.svg
  - text: Include the publisher prefix to avoid collisions across solutions.
    icon: icons/circle-alert.svg
  - text: Use lowercase for the file name. Avoid spaces and special characters.
    icon: icons/folder-open.svg
  - text: Shared utility functions that are not tied to a specific table should be placed in a single [prefix]_/js/common.js file.
    icon: icons/lightbulb.svg
  rationale:
  - text: A consistent naming convention makes it easy to locate and manage web resources in a solution.
    icon: icons/pencil.svg
  - text: Having one file per table keeps all related logic together, making it easier to understand the full behavior of a table's forms at a glance.
    icon: icons/database.svg
  - text: Multiple files per table lead to fragmented logic that is harder to maintain, debug, and trace when troubleshooting form events.
    icon: icons/folder-open.svg
  - text: Including the publisher prefix prevents name collisions when multiple solutions are installed in the same environment.
    icon: icons/package.svg
  examples:
    good:
    - title: Conforms to the rule requirements.
      text: Conforms to the rule requirements.
      icon: icons/lightbulb.svg
    bad:
    - title: Violates the rule requirements.
      text: Violates the rule requirements.
      icon: icons/check.svg
  references:
  - title: Web resource naming conventions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/web-resources
- id: JS-009
  title: Register scripts only on the forms and events where they are needed.
  description: Register scripts only on the forms and events where they are needed. Do not load scripts globally if they are only used by a single entity or form.
  guidelines:
  - text: Add web resource libraries only to the forms that require them.
    icon: icons/folder-open.svg
  - text: Register event handlers (OnLoad, OnChange, OnSave) only for the specific fields and events your logic targets.
    icon: icons/database.svg
  - text: Pass the execution context as the first parameter when registering event handlers.
    icon: icons/settings.svg
  - text: If a script is only needed for a specific form, do not add it to all forms of that entity.
    icon: icons/code-xml.svg
  rationale:
  - text: Loading unnecessary scripts increases form load time because the browser must download, parse, and execute each web resource.
    icon: icons/code-xml.svg
  - text: Event handlers that run on every form load without a clear purpose add processing overhead and increase the risk of errors.
    icon: icons/workflow.svg
  - text: Targeting scripts precisely makes the system easier to debug, because developers can quickly identify which scripts affect a given form.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: The account_form.js web resource is added only to the Account main form and
      text: The account_form.js web resource is added only to the Account main form and registered for the OnLoad event with "Pass execution context as first parameter" enabled.
      icon: icons/settings.svg
    - title: The contactphonevalidation.js script is registered on the OnChange event of the
      text: The contactphonevalidation.js script is registered on the OnChange event of the telephone1 field only.
      icon: icons/database.svg
    bad:
    - title: A large utility library is added to every form in the solution, even though
      text: A large utility library is added to every form in the solution, even though only one form uses it.
      icon: icons/package.svg
    - title: An OnLoad handler is registered on all entity forms "just in case", adding
      text: An OnLoad handler is registered on all entity forms "just in case", adding unnecessary processing on every form open.
      icon: icons/workflow.svg
  references:
  - title: Add script to a form event - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/events-forms-grids
- id: JS-010
  title: Avoid hard-coding entity names, field names, GUIDs, or option set values in your
  description: Avoid hard-coding entity names, field names, GUIDs, or option set values in your scripts. Use constants or configuration data.
  guidelines:
  - text: Define entity names, field logical names, and option set values as constants at the top of your namespace.
    icon: icons/database.svg
  - text: Never hard-code record GUIDs. Look up records dynamically or use alternate keys.
    icon: icons/code-xml.svg
  - text: If your logic depends on environment-specific values (e.g., a team ID or queue ID), retrieve them at runtime or store them in a configuration entity.
    icon: icons/users.svg
  rationale:
  - text: Hard-coded values make scripts fragile. If a field is renamed, an option set value changes, or the script is moved to a different environment, the script breaks.
    icon: icons/database.svg
  - text: GUIDs differ between development, test, and production environments. Hard-coded GUIDs will fail in at least one environment.
    icon: icons/code-xml.svg
  - text: Centralizing constants at the top of the file makes the script easier to review and update.
    icon: icons/folder-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        var Contoso = Contoso || {};
        Contoso.Account = Contoso.Account || {};

        // Constants
        Contoso.Account.Fields = {
            STATUS: "statuscode",
            CATEGORY: "accountcategorycode",
            CREDIT_LIMIT: "creditlimit"
        };

        Contoso.Account.StatusValues = {
            ACTIVE: 1,
            INACTIVE: 2
        };

        Contoso.Account.onLoad = function (executionContext) {
            var formContext = executionContext.getFormContext();
            var status = formContext.getAttribute(Contoso.Account.Fields.STATUS).getValue();
            if (status === Contoso.Account.StatusValues.ACTIVE) {
                formContext.getControl(Contoso.Account.Fields.CREDIT_LIMIT).setVisible(true);
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
            // Hard-coded field names and option set values scattered throughout
            var status = formContext.getAttribute("statuscode").getValue();
            if (status === 1) {
                formContext.getControl("creditlimit").setVisible(true);
            }
        }
      language: javascript
  references:
  - title: Client scripting in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/client-scripting
- id: JS-011
  title: Use setNotification and clearNotification on controls to display inline
  description: Use setNotification and clearNotification on controls to display inline validation messages instead of alert dialogs for field-level validation.
  guidelines:
  - text: Call formContext.getControl("fieldname").setNotification("message", "uniqueId") to show a validation error next to the field.
    icon: icons/database.svg
  - text: Call formContext.getControl("fieldname").clearNotification("uniqueId") when the validation error is resolved.
    icon: icons/pencil.svg
  - text: Reserve Xrm.Navigation.openAlertDialog for critical errors or informational messages that are not tied to a specific field.
    icon: icons/circle-alert.svg
  rationale:
  - text: Inline notifications provide immediate visual feedback next to the relevant field, making it clear what needs to be corrected.
    icon: icons/database.svg
  - text: Alert dialogs interrupt the user's workflow and are disruptive when used for simple validation errors.
    icon: icons/workflow.svg
  - text: A field with an active notification prevents the record from being saved, enforcing data quality without additional OnSave logic.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        Contoso.Contact.onPhoneChange = function (executionContext) {
            var formContext = executionContext.getFormContext();
            var phone = formContext.getAttribute("telephone1").getValue();

            if (phone && !/^\d{10}$/.test(phone)) {
                formContext.getControl("telephone1")
                    .setNotification("Phone number must be 10 digits.", "phoneValidation");
            } else {
                formContext.getControl("telephone1")
                    .clearNotification("phoneValidation");
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function onPhoneChange(executionContext) {
            var formContext = executionContext.getFormContext();
            var phone = formContext.getAttribute("telephone1").getValue();

            if (phone && !/^\d{10}$/.test(phone)) {
                // Alert dialogs are disruptive for field-level validation
                Xrm.Navigation.openAlertDialog({
                    text: "Phone number must be 10 digits."
                });
            }
        }
      language: javascript
  references:
  - title: Control.setNotification - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/controls/setnotification
  - title: Control.clearNotification - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/controls/clearnotification
- id: JS-012
  title: Only run on specific form modes (create, update, read-only).
  description: Check the form type before executing logic that should only run on specific form modes (create, update, read-only).
  guidelines:
  - text: Use formContext.ui.getFormType() to determine the current form mode.
    icon: icons/lightbulb.svg
  - text: Gate logic that should only run during record creation (type 1) or update (type 2) using an explicit check.
    icon: icons/check.svg
  - text: Avoid running initialization logic on read-only or disabled forms where it is unnecessary.
    icon: icons/circle-alert.svg
  rationale:
  - text: Logic that sets default values should only run on create forms. Running it on update forms would overwrite existing data.
    icon: icons/database.svg
  - text: Skipping unnecessary logic on read-only forms improves load performance.
    icon: icons/book-open.svg
  - text: Explicitly checking the form type makes the script's intent clear and prevents subtle bugs.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        Contoso.Case.onLoad = function (executionContext) {
            var formContext = executionContext.getFormContext();
            var formType = formContext.ui.getFormType();

            // 1 = Create
            if (formType === 1) {
                formContext.getAttribute("prioritycode").setValue(2); // Normal
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
            // Sets default priority on every form open, overwriting existing values on updates
            formContext.getAttribute("prioritycode").setValue(2);
        }
      language: javascript
  references:
  - title: formContext.ui.getFormType - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/reference/formcontext-ui/getformtype
- id: JS-013
  title: Document all functions using JSDoc syntax.
  description: Document all functions using JSDoc syntax. Provide inline comments that describe the intent of the code.
  guidelines:
  - text: Every function must have a JSDoc block with @param and @returns tags describing the parameters and return value.
    icon: icons/check.svg
  - text: Include a brief description of the function's purpose as the first line of the JSDoc block.
    icon: icons/file-text.svg
  - text: Add inline comments to explain the *why* behind non-obvious logic. Do not comment what the code does when it is self-explanatory.
    icon: icons/code-xml.svg
  - text: Keep JSDoc blocks up to date when modifying function signatures or behavior.
    icon: icons/lightbulb.svg
  rationale:
  - text: JSDoc comments enable IDE features like auto-complete, inline documentation, and type checking, improving developer productivity.
    icon: icons/link.svg
  - text: New developers can understand the purpose and expected inputs of a function without reading its full implementation.
    icon: icons/book-open.svg
  - text: Inline comments explaining intent help future maintainers understand *why* a decision was made, not just *what* the code does.
    icon: icons/file-text.svg
  - text: Consistent documentation reduces onboarding time and makes code reviews more efficient.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Sets the phone field as required when the contact method is Phone.
      text: Sets the phone field as required when the contact method is Phone.
      icon: icons/database.svg
    - title: '@param {Object} executionContext - The execution context passed by the form'
      text: '@param {Object} executionContext - The execution context passed by the form event.'
      icon: icons/lightbulb.svg
    - title: Retrieves the primary contact email for a given account.
      text: Retrieves the primary contact email for a given account.
      icon: icons/check.svg
    - title: '@param {string} accountId - The GUID of the account record.'
      text: '@param {string} accountId - The GUID of the account record.'
      icon: icons/circle-alert.svg
    - title: '@returns {Promise<string|null>} The email address, or null if not found.'
      text: '@returns {Promise<string|null>} The email address, or null if not found.'
      icon: icons/settings.svg
    - title: Compliant code example
      code: |-
        /**
         * Sets the phone field as required when the contact method is Phone.
         * @param {Object} executionContext - The execution context passed by the form event.
         */
        Contoso.Contact.onContactMethodChange = function (executionContext) {
            var formContext = executionContext.getFormContext();
            var contactMethod = formContext.getAttribute("preferredcontactmethodcode").getValue();

            // Phone = 2 in the Contact Method option set
            var isPhone = contactMethod === 2;
            formContext.getAttribute("telephone1").setRequiredLevel(
                isPhone ? "required" : "none"
            );
        };

        /**
         * Retrieves the primary contact email for a given account.
         * @param {string} accountId - The GUID of the account record.
         * @returns {Promise<string|null>} The email address, or null if not found.
         */
        Contoso.Account.getPrimaryContactEmail = async function (accountId) {
            try {
                var result = await Xrm.WebApi.retrieveRecord(
                    "account", accountId,
                    "?$select=_primarycontactid_value&$expand=primarycontactid($select=emailaddress1)"
                );
                return result.primarycontactid ? result.primarycontactid.emailaddress1 : null;
            } catch (error) {
                console.error("Failed to retrieve primary contact email: " + error.message);
                return null;
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        // No documentation — developers must read the entire function to understand it
        function onChange(executionContext) {
            var formContext = executionContext.getFormContext();
            var v = formContext.getAttribute("preferredcontactmethodcode").getValue();
            if (v === 2) {
                formContext.getAttribute("telephone1").setRequiredLevel("required");
            } else {
                formContext.getAttribute("telephone1").setRequiredLevel("none");
            }
        }

        // Useless comments that repeat the code instead of explaining intent
        function setPhone(executionContext) {
            var formContext = executionContext.getFormContext();
            // Get the value
            var val = formContext.getAttribute("telephone1").getValue();
            // Set visible to true
            formContext.getControl("telephone1").setVisible(true);
        }
      language: javascript
  references:
  - title: JSDoc documentation
    url: https://jsdoc.app/
  - title: Client scripting in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/client-scripting
- id: JS-014
  title: Write client script code using TypeScript when possible.
  description: Write client script code using TypeScript when possible. Transpile TypeScript to JavaScript for deployment as web resources.
  guidelines:
  - text: Use TypeScript (.ts) as the source language for all new client scripts.
    icon: icons/code-xml.svg
  - text: Install the @types/xrm package to get type definitions for the Dataverse Client API.
    icon: icons/database.svg
  - text: Enable strict mode in tsconfig.json to catch type errors at compile time.
    icon: icons/circle-alert.svg
  - text: Transpile TypeScript to ES5 or ES6 JavaScript and deploy only the compiled .js files as web resources.
    icon: icons/package.svg
  - text: Keep TypeScript source files in version control. Never commit only the compiled output.
    icon: icons/folder-open.svg
  rationale:
  - text: TypeScript provides compile-time type checking, catching common errors (null references, wrong argument types, misspelled property names) before deployment.
    icon: icons/pencil.svg
  - text: The @types/xrm definitions provide auto-complete and inline documentation for all Dataverse Client API methods, reducing mistakes and development time.
    icon: icons/database.svg
  - text: TypeScript's strict mode enforces null checks and explicit types, leading to more robust code.
    icon: icons/code-xml.svg
  - text: The compiled JavaScript output is fully compatible with the Dataverse web resource runtime - TypeScript adds safety without any runtime cost.
    icon: icons/folder-open.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // account.ts — TypeScript source with type safety
        namespace Contoso.Account {
            export function onLoad(executionContext: Xrm.Events.EventContext): void {
                const formContext: Xrm.FormContext = executionContext.getFormContext();
                const name: string | null = formContext.getAttribute("name").getValue();

                if (name === null) {
                    formContext.getControl("name").setNotification(
                        "Account name is required.", "nameRequired"
                    );
                }
            }
        }
      language: typescript
    bad:
    - title: Non-compliant code example
      code: |-
        // account.js — plain JavaScript with no type safety
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
            // No type checking — typo in attribute name goes unnoticed until runtime
            var name = formContext.getAttribute("nme").getValue();
            if (name === null) {
                formContext.getControl("name").setNotification(
                    "Account name is required.", "nameRequired"
                );
            }
        }
      language: javascript
  references:
  - title: '@types/xrm - npm'
    url: https://www.npmjs.com/package/@types/xrm
  - title: TypeScript documentation
    url: https://www.typescriptlang.org/docs/
  - title: Client scripting in model-driven apps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/client-scripting
- id: JS-015
  title: Remove all console.log, console.debug, and debugger statements before deploying
  description: Remove all console.log, console.debug, and debugger statements before deploying scripts to test or production environments.
  guidelines:
  - text: Do not leave console.log, console.warn, console.debug, or console.error calls in production code unless they are part of a deliberate logging strategy.
    icon: icons/code-xml.svg
  - text: Never leave debugger statements in committed code. They pause execution in the browser when DevTools are open, causing the application to freeze for end users.
    icon: icons/users.svg
  - text: If runtime logging is needed in production, use a dedicated logging utility that can be enabled or disabled via a configuration flag.
    icon: icons/lightbulb.svg
  rationale:
  - text: console.log statements clutter the browser console, making it harder to diagnose real issues during support scenarios.
    icon: icons/lightbulb.svg
  - text: debugger statements cause the browser to pause execution when DevTools are open. If an end user or support engineer opens DevTools, the application freezes unexpectedly.
    icon: icons/users.svg
  - text: Excessive console output can impact performance in tight loops or frequently triggered events.
    icon: icons/workflow.svg
  - text: Leaving debug artifacts in production code signals a lack of code review discipline and can expose internal logic details to end users.
    icon: icons/code-xml.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        Contoso.Account.onLoad = function (executionContext) {
            var formContext = executionContext.getFormContext();
            var status = formContext.getAttribute("statuscode").getValue();

            if (status === Contoso.Account.StatusValues.ACTIVE) {
                formContext.getControl("creditlimit").setVisible(true);
            }
        };
      language: javascript
    bad:
    - title: Non-compliant code example
      code: |-
        function onLoad(executionContext) {
            var formContext = executionContext.getFormContext();
            var status = formContext.getAttribute("statuscode").getValue();

            console.log("Status value: " + status); // Debug artifact left in production
            debugger; // Freezes the browser when DevTools are open

            if (status === 1) {
                console.log("Setting credit limit visible"); // Unnecessary logging
                formContext.getControl("creditlimit").setVisible(true);
            }
        }
      language: javascript
  references:
  - title: Best practices for client scripting - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/model-driven-apps/clientapi/client-scripting-best-practices

