topic: ALM
description: Good practices for Power Platform Application Lifecycle Management.
rules:
- id: ALM-001
  title: Create separate environments
  description: Establish a minimum of three environments to separate change creation, validation, and live operations.
  guidelines:
  - text: Create dedicated Development environments where makers build and test in isolation using unmanaged solutions.
    icon: icons/check.svg
  - text: Create a Test or QA environment for user acceptance testing and integration validation using managed solutions.
    icon: icons/users.svg
  - text: Maintain a locked-down Production environment that only receives tested, approved managed solutions.
    icon: icons/package.svg
  - text: Apply Data Loss Prevention (DLP) policies appropriate to each environment, with the most restrictive policies in Production.
    icon: icons/database.svg
  - text: Restrict System Administrator roles in Production to a small group of authorized personnel.
    icon: icons/shield-alert.svg
  rationale:
  - text: Without environment separation, changes made during development can accidentally affect live users and production data.
    icon: icons/database.svg
  - text: A dedicated Test environment lets stakeholders validate changes before production, catching bugs and regressions early.
    icon: icons/check.svg
  - text: Restricting Production access reduces the risk of unauthorized or untested changes being deployed directly.
    icon: icons/shield-alert.svg
  - text: DLP policies aligned to environment purpose prevent accidental data exposure.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Three environments configured
      text: Three environments are configured as Contoso-Dev, Contoso-Test, and Contoso-Prod.
      icon: icons/check.svg
    - title: Managed promotion path is enforced
      text: Makers build in Contoso-Dev, deploy managed solutions to Contoso-Test for UAT, and promote the same managed artifact to Contoso-Prod after approval.
      icon: icons/package.svg
    - title: Production DLP policy is restrictive
      text: Production allows only approved business connectors and blocks non-approved connectors.
      icon: icons/lightbulb.svg
    bad:
    - title: A single environment used for development, testing, and production
      text: A single environment is used for development, testing, and production simultaneously.
      icon: icons/circle-alert.svg
    - title: Developers making changes directly in the Production environment
      text: Developers make changes directly in the Production environment.
      icon: icons/settings.svg
    - title: No DLP policies configured in Production
      text: No DLP policies are configured, allowing any connector in Production.
      icon: icons/workflow.svg
  references:
  - title: Overview of ALM with Microsoft Power Platform - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/overview-alm
  - title: Environments overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/environments-overview
  - title: Data loss prevention policies - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/wp-data-loss-prevention

- id: ALM-002
  title: Use managed solutions
  description: Always deploy managed solutions to Test, UAT, and Production. Reserve unmanaged solutions for Development.
  guidelines:
  - text: Export solutions as managed when deploying to any environment beyond Development.
    icon: icons/package.svg
  - text: Never import unmanaged solutions into Test, UAT, or Production.
    icon: icons/check.svg
  - text: Use solution upgrades instead of delete-and-reimport to update managed solutions.
    icon: icons/lightbulb.svg
  - text: Keep the unmanaged source version in Development and source control for ongoing changes.
    icon: icons/circle-alert.svg
  rationale:
  - text: Managed solutions lock components and prevent accidental edits in downstream environments.
    icon: icons/workflow.svg
  - text: Unmanaged solutions leave components behind when removed, creating untracked customizations.
    icon: icons/circle-alert.svg
  - text: Managed solutions support clean uninstall and safer rollback behavior.
    icon: icons/package.svg
  - text: Upgrade workflows preserve data and remove deprecated components in a controlled way.
    icon: icons/database.svg
  examples:
    good:
    - title: Managed package promoted to Test
      text: A solution is exported as managed from Dev and imported into Test for validation.
      icon: icons/check.svg
    - title: Same managed artifact promoted to Production
      text: After UAT sign-off, the same managed artifact is imported into Production.
      icon: icons/package.svg
    - title: Upgrade process used for updates
      text: A new version is deployed with Upgrade so deprecated components are removed safely.
      icon: icons/settings.svg
    bad:
    - title: An unmanaged solution imported into Production so a developer can quickly fix something
      text: An unmanaged solution is imported into Production so a developer can quickly fix something.
      icon: icons/lightbulb.svg
    - title: Managed solution deleted and reimported
      text: A managed solution is deleted and reimported instead of upgraded, creating avoidable risk and potential data loss.
      icon: icons/database.svg
    - title: Customizations made directly in Production
      text: Customizations are made directly in Production outside any solution, creating untracked changes.
      icon: icons/circle-alert.svg
  references:
  - title: Managed and unmanaged solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/solution-concepts-alm
  - title: Apply solution upgrade or update - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/update-solutions-alm

- id: ALM-003
  title: Solution publisher, naming and prefixes
  description: Create a dedicated publisher and apply consistent naming and versioning conventions to all solutions.
  guidelines:
  - text: Use a publisher prefix of 3 to 5 lowercase characters that represents your organization or project, for example cto or adw.
    icon: icons/pencil.svg
  - text: Never use the default publisher (CDS Default Publisher, prefix cr), because it is shared and cannot be changed later.
    icon: icons/circle-alert.svg
  - text: Use the same publisher across Dev, Test, and Prod to keep component identity consistent.
    icon: icons/check.svg
  - text: Name solutions clearly using a consistent pattern such as PublisherPrefixSolutionPurpose.
    icon: icons/package.svg
  - text: Apply semantic versioning (Major.Minor.Build.Revision) to all solutions.
    icon: icons/lightbulb.svg
  rationale:
  - text: The publisher prefix is permanently prepended to custom components, so meaningful short prefixes improve readability and ownership clarity.
    icon: icons/database.svg
  - text: Using the default publisher mixes your components with others and makes ownership hard to track.
    icon: icons/users.svg
  - text: A consistent publisher across environments ensures imports are treated as updates, not unrelated components.
    icon: icons/package.svg
  - text: Semantic versioning gives clear release history and deployment traceability.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Dedicated publisher uses a 3-5 character prefix
      text: Publisher Contoso Ltd uses prefix cto, and the same publisher is used in Dev, Test, and Prod.
      icon: icons/pencil.svg
    - title: Solution naming and versioning are consistent
      text: Solution name is CTO_HROnboarding with version 1.2.0.0.
      icon: icons/package.svg
    - title: Custom components use the short publisher prefix
      text: Custom tables and columns follow names such as cto_employee and cto_onboardingtask.
      icon: icons/database.svg
    bad:
    - title: Using the default CDS Default Publisher with prefix cr for production solutions
      text: Using the default CDS Default Publisher with prefix cr for production solutions.
      icon: icons/lightbulb.svg
    - title: Publisher prefix is too long and unreadable
      text: Publisher prefix mycompanyglobaltradingsolutions is too long and makes schema names hard to read.
      icon: icons/book-open.svg
    - title: Solution version stays fixed across deployments
      text: Solution version remains 1.0.0.0 across deployments with no version history.
      icon: icons/check.svg
    - title: Different publishers used in Dev and Prod
      text: Different publishers are used in Dev and Prod, causing import conflicts.
      icon: icons/circle-alert.svg
  references:
  - title: Create a solution publisher - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-solution#create-a-solution-publisher
  - title: Solution publisher prefix - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/introduction-solutions#solution-publisher

- id: ALM-004
  title: Use Environment Variables
  description: Use environment variables for values that change by environment instead of hardcoding values in apps, flows, or plug-ins.
  guidelines:
  - text: Create environment variables for URLs, feature flags, email addresses, thresholds, and any value that changes across Dev, Test, and Production.
    icon: icons/link.svg
  - text: Always include environment variables in the same solution as the components that use them.
    icon: icons/package.svg
  - text: Reference environment variables in apps, flows, and plug-ins instead of hardcoding values.
    icon: icons/workflow.svg
  - text: Set environment-specific current values in each target environment after import.
    icon: icons/lightbulb.svg
  - text: Mark sensitive values as Secret data type and restrict who can view or set them.
    icon: icons/shield-alert.svg
  - text: Use a consistent naming pattern with publisher prefix and purpose, such as cto_SharePointSiteUrl or cto_Feature_EnableAutoAssign.
    icon: icons/pencil.svg
  - text: Keep default values non-production-safe and use deployment-time overrides for Test and Production current values.
    icon: icons/check.svg
  rationale:
  - text: Hardcoded values force manual edits and republishing between environments, which introduces deployment errors.
    icon: icons/workflow.svg
  - text: Environment variables let the same solution package move across environments without code changes.
    icon: icons/package.svg
  - text: Secret environment variables provide baseline protection for sensitive configuration.
    icon: icons/shield-alert.svg
  - text: Including variables in solutions keeps configuration versioned and traceable with the dependent components.
    icon: icons/lightbulb.svg
  - text: Consistent naming and safe defaults reduce misconfiguration risk, especially accidental production endpoint usage in non-production stages.
    icon: icons/circle-alert.svg
  examples:
    good:
    - title: Variable names are standardized and discoverable
      text: Variables follow names like cto_SharePointSiteUrl, cto_NotificationMailbox, and cto_Feature_EnableAutoAssign.
      icon: icons/pencil.svg
    - title: Current values differ by environment not by code edits
      text: Dev uses https://contoso-dev.sharepoint.com/sites/hr, Test uses https://contoso-test.sharepoint.com/sites/hr, and Prod uses https://contoso.sharepoint.com/sites/hr through current values.
      icon: icons/link.svg
    - title: Secrets are stored as Secret variables
      text: API credentials are stored in Secret environment variables and are not hardcoded in flow actions.
      icon: icons/shield-alert.svg
    - title: Deployment pipeline applies environment-specific overrides
      text: The pipeline sets current values during import so the same managed solution deploys safely across environments.
      icon: icons/workflow.svg
    bad:
    - title: Non-compliant code example
      code: |-
        // URL hardcoded directly in a Power Automate flow action:
        // Site Address: https://contoso.sharepoint.com/sites/hr
        //
        // When deployed to Test, the flow still points to Production SharePoint,
        // causing test data to be written to the live site.
      language: Plain Text
    - title: Non-compliant code example
      code: |-
        // API key pasted directly into an HTTP action:
        // Authorization: Bearer sk-abc123secretkey
        //
        // The secret is visible to anyone who can edit the flow
        // and is exported with the solution in plain text.
      language: Plain Text
  references:
  - title: Environment variables overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables
  - title: Use environment variables in solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables#use-environment-variables-in-solutions

- id: ALM-005
  title: Use connection references
  description: Use connection references so flows and apps can be rebound to environment-specific connections during deployment.
  guidelines:
  - text: Create connection references in your solution before building flows or apps that use connectors.
    icon: icons/workflow.svg
  - text: Use connection references in flow actions and app data sources instead of direct embedded connections.
    icon: icons/database.svg
  - text: During managed import, map each connection reference to an approved connection in the target environment.
    icon: icons/link.svg
  - text: Use service principal or service account-backed connections for non-interactive automation.
    icon: icons/users.svg
  rationale:
  - text: Embedded personal connections often fail after import because identity and permissions differ by environment.
    icon: icons/shield-alert.svg
  - text: Connection references decouple connector identity from solution content and support environment-specific credentials.
    icon: icons/link.svg
  - text: Non-user-owned connections improve reliability when staff roles change.
    icon: icons/workflow.svg
  - text: Connection references are the supported ALM pattern for connector-dependent solution components.
    icon: icons/package.svg
  examples:
    good:
    - title: Shared connection reference is defined once
      text: The solution defines cto_SharePointConnection and all relevant flows use that reference.
      icon: icons/link.svg
    - title: Import mapping uses approved target credentials
      text: During Production import, cto_SharePointConnection is mapped to a service account connection.
      icon: icons/lightbulb.svg
    - title: Rebinding is environment-specific and controlled
      text: Test and Production use different underlying credentials without modifying flow definitions.
      icon: icons/workflow.svg
    bad:
    - title: A flow uses a direct connection tied to developer@contoso.com
      text: A flow uses a direct connection tied to developer@contoso.com. When imported to Production, the flow fails because that user has no permissions in Production.
      icon: icons/shield-alert.svg
    - title: Multiple flows create orphaned connections during import
      text: Multiple flows each create their own connection during import, resulting in dozens of orphaned connections with no clear ownership.
      icon: icons/users.svg
    - title: A flow runs under a departing employee connection
      text: A flow runs under a departing employee's connection. When their account is disabled, all dependent flows stop working.
      icon: icons/check.svg
  references:
  - title: Connection references overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-connection-reference
  - title: Use service principal with connection references - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/power-automate-authentication#use-service-principal-based-authentication

- id: ALM-006
  title: Use source control
  description: Store all solution artifacts in source control to enable version history, collaboration, reviews, and deployment automation.
  guidelines:
  - text: Use Power Platform CLI commands such as pac solution clone and pac solution unpack to decompose solution files.
    icon: icons/package.svg
  - text: Store unpacked solution artifacts in Git repositories such as Azure DevOps Repos or GitHub.
    icon: icons/folder-open.svg
  - text: Adopt a branching strategy that fits team size and release cadence.
    icon: icons/database.svg
  - text: Require pull requests and peer review before merging to the main branch.
    icon: icons/eye.svg
  - text: Keep plug-ins, PCF, and web resources in the same repository as unpacked solution artifacts.
    icon: icons/code-xml.svg
  rationale:
  - text: Source control provides auditable history for what changed, when, and by whom.
    icon: icons/lightbulb.svg
  - text: Unpacked artifacts enable meaningful diffs and reliable code review.
    icon: icons/code-xml.svg
  - text: Branching enables parallel work without accidental overwrite.
    icon: icons/check.svg
  - text: Pull request review improves quality and team knowledge sharing.
    icon: icons/users.svg
  examples:
    good:
    - title: Feature branch workflow is followed
      text: A developer creates a feature branch, unpacks solution changes, commits, and opens a pull request.
      icon: icons/package.svg
    - title: Review checks intended metadata diffs
      text: A reviewer verifies that only expected Dataverse and flow metadata changes are present in the diff.
      icon: icons/check.svg
    - title: Repository stores both metadata and code
      text: The repository includes unpacked solution files plus related plug-in and PCF source code.
      icon: icons/code-xml.svg
    bad:
    - title: Solution zip files shared outside source control
      text: Solution zip files are emailed between team members or stored on a shared drive with names like Solutionv2final_FINAL.zip.
      icon: icons/pencil.svg
    - title: No version history for regressions
      text: Without version history, teams cannot determine what changed or revert to a previous state.
      icon: icons/lightbulb.svg
    - title: No branching strategy in shared Dev
      text: All developers work in the same Dev environment without branching and overwrite each other's changes.
      icon: icons/circle-alert.svg
  references:
  - title: Source control with solution files - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/use-source-control-solution-files
  - title: Power Platform CLI - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/developer/cli/introduction
  - title: ALM developer guide - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/alm-for-developers

- id: ALM-007
  title: Use deployment automations
  description: Automate solution validation and deployment with CI/CD instead of manual releases.
  guidelines:
  - text: Build deployment automation with supported options such as Power Platform Build Tools for Azure DevOps, GitHub Actions for Power Platform, or Power Platform Pipelines.
    icon: icons/workflow.svg
  - text: Use service principal authentication rather than personal accounts for all pipeline connections.
    icon: icons/shield-alert.svg
  - text: Use distinct stages such as Build (export, unpack, validate), Test (deploy managed and run checks), and Release (deploy managed to Production with approvals).
    icon: icons/check.svg
  - text: Enforce approval gates before Production deployment.
    icon: icons/package.svg
  - text: Store pipeline definitions in source control with the solution.
    icon: icons/lightbulb.svg
  rationale:
  - text: Manual deployment steps are easy to skip or misapply, creating preventable release defects.
    icon: icons/workflow.svg
  - text: Automated pipelines standardize deployment behavior and improve reliability.
    icon: icons/check.svg
  - text: Service principal authentication is stable and auditable for enterprise operations.
    icon: icons/shield-alert.svg
  - text: Approval gates enforce governance and reduce production risk.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Build stage validates every candidate artifact
      text: The Build stage exports the solution, validates it with Solution Checker, and publishes a managed artifact for downstream stages.
      icon: icons/check.svg
    - title: Test deployment is fully automated
      text: On merge to main, the pipeline deploys to Test, applies environment variable and connection reference mappings, and runs smoke validation.
      icon: icons/workflow.svg
    - title: Production release is gated
      text: Production deployment requires business and technical approval, then deploys the exact managed artifact that passed Test.
      icon: icons/package.svg
    - title: Authentication is non-personal
      text: All pipeline connections use an application user and service principal so releases are not tied to individual employees.
      icon: icons/shield-alert.svg
    bad:
    - title: A developer manually exports a solution from Dev, downloads the .zip, and
      text: A developer manually exports a solution from Dev, downloads the .zip, and imports it into Production from the browser.
      icon: icons/eye.svg
    - title: Pipeline authenticates using a developer's personal credentials - when the
      text: Pipeline authenticates using a developer's personal credentials - when the developer changes their password, all pipelines break.
      icon: icons/shield-alert.svg
    - title: No approval gates
      text: No approval gates a pipeline automatically deploys to Production after a commit, with no human review.
      icon: icons/book-open.svg
  references:
  - title: Power Platform Build Tools for Azure DevOps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-build-tools
  - title: GitHub Actions for Power Platform - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-github-actions
  - title: Power Platform Pipelines overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/pipelines
  - title: Use service principal authentication - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/create-users-assign-online-security-roles#create-an-application-user

- id: ALM-008
  title: Use Power Platform Solution Checker
  description: Integrate Solution Checker into CI/CD to validate solutions for best-practice, performance, and security issues before deployment.
  guidelines:
  - text: Run Solution Checker on every pull request or build validation pipeline.
    icon: icons/workflow.svg
  - text: Configure build failure thresholds for critical and high-severity findings.
    icon: icons/circle-alert.svg
  - text: Publish checker reports as build artifacts for auditing and troubleshooting.
    icon: icons/check.svg
  - text: Track and resolve recurring warnings, not only blocking issues.
    icon: icons/eye.svg
  rationale:
  - text: Solution Checker catches quality, performance, and security issues that are often missed in manual review.
    icon: icons/workflow.svg
  - text: Continuous execution in CI enforces standards consistently across all changes.
    icon: icons/check.svg
  - text: Failing on high-severity findings blocks known risks from reaching Test and Production.
    icon: icons/circle-alert.svg
  - text: Stored reports provide evidence of release quality over time.
    icon: icons/package.svg
  examples:
    good:
    - title: Checker runs automatically on pull requests
      text: Every pull request triggers Solution Checker and posts results before merge approval.
      icon: icons/check.svg
    - title: Severity thresholds are enforced
      text: The pipeline stops when critical or high issues exceed the configured threshold.
      icon: icons/workflow.svg
    - title: Reports are retained and reviewed
      text: Checker reports are published as artifacts and reviewed in release readiness meetings.
      icon: icons/users.svg
    - title: Quality trend is monitored
      text: The team tracks checker findings over time and removes recurring anti-patterns from shared components.
      icon: icons/lightbulb.svg
    bad:
    - title: Solution Checker is never run - issues are discovered by users in Production.
      text: Solution Checker is never run - issues are discovered by users in Production.
      icon: icons/circle-alert.svg
    - title: Checker is configured but its results are ignored - the pipeline always
      text: Checker is configured but its results are ignored - the pipeline always proceeds regardless of findings.
      icon: icons/settings.svg
    - title: Checker is only run manually by one team member before major releases, missing
      text: Checker is only run manually by one team member before major releases, missing issues in intermediate deployments.
      icon: icons/package.svg
  references:
  - title: Power Platform Checker - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/checker-api/overview
  - title: Use Solution Checker in pipelines - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-build-tools#solution-checker

- id: ALM-009
  title: Use semantic versioning
  description: Apply semantic versioning to every solution and increment the version for every deployment to maintain a clear release history.
  guidelines:
  - text: Use Major.Minor.Build.Revision format, for example 1.0.0.0.
    icon: icons/lightbulb.svg
  - text: Increment **Major** for breaking changes or major release milestones.
    icon: icons/package.svg
  - text: Increment **Minor** for backward-compatible feature additions.
    icon: icons/check.svg
  - text: Increment **Build** for fixes and patches.
    icon: icons/circle-alert.svg
  - text: Never deploy distinct artifacts with the same version number.
    icon: icons/settings.svg
  - text: Automate version updates in CI or release pipelines.
    icon: icons/workflow.svg
  rationale:
  - text: Versioning identifies exactly what is deployed per environment and supports reliable comparison across releases.
    icon: icons/package.svg
  - text: Semantic version numbers communicate expected change impact.
    icon: icons/circle-alert.svg
  - text: Unique version numbers improve rollback confidence and incident response.
    icon: icons/lightbulb.svg
  - text: Automated version increments prevent human error and import confusion.
    icon: icons/check.svg
  examples:
    good:
    - title: Initial release
      text: 1.0.0.0 - Initial release.
      icon: icons/package.svg
    - title: Backward-compatible feature
      text: 1.1.0.0 - New feature added (leave approval workflow).
      icon: icons/workflow.svg
    - title: Patch release
      text: 1.1.1.0 - Bug fix (corrected email notification template).
      icon: icons/lightbulb.svg
    - title: Breaking change release
      text: 2.0.0.0 - Major redesign with schema changes (requires data migration).
      icon: icons/database.svg
    - title: Pipeline-managed version increment
      text: Version is incremented automatically by the CI/CD pipeline on each build.
      icon: icons/check.svg
    bad:
    - title: Every deployment uses version 1.0.0.0
      text: Every deployment uses version 1.0.0.0, leaving no way to distinguish releases.
      icon: icons/circle-alert.svg
    - title: Versions incremented randomly with no pattern
      text: "Version numbers are incremented randomly with no pattern: 1.0.0.0 -> 3.5.0.0 -> 2.1.0.0."
      icon: icons/book-open.svg
    - title: Version update is manual and often missed
      text: Version is updated manually and sometimes forgotten, causing import warnings or failures in target environments.
      icon: icons/settings.svg
  references:
  - title: Solution versioning - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/update-solutions-alm
  - title: Semantic Versioning specification
    url: https://semver.org/



