topic: Application Lifecycle Management (ALM)
description: Good practices for Power Platform Application Lifecycle Management.
rules:
- id: ALM-001
  title: Establish a minimum of three separate environments
  description: Establish a minimum of three separate environments - Development, Test, and Production - to support a healthy application lifecycle.
  guidelines:
  - text: Create dedicated Development environments where makers build and test in isolation using unmanaged solutions.
    icon: icons/check.svg
  - text: Create a Test/QA environment for user acceptance testing and integration validation using managed solutions.
    icon: icons/users.svg
  - text: Maintain a locked-down Production environment that only receives tested, approved managed solutions.
    icon: icons/package.svg
  - text: Apply Data Loss Prevention (DLP) policies appropriate to each environment, with the most restrictive policies in Production.
    icon: icons/database.svg
  - text: Restrict system administrator roles in Production to a small group of authorized personnel.
    icon: icons/shield-alert.svg
  rationale:
  - text: Without environment separation, changes made during development can accidentally affect live users and production data.
    icon: icons/database.svg
  - text: A dedicated test environment allows stakeholders to validate changes before they reach production, catching bugs and regressions early.
    icon: icons/check.svg
  - text: Restricting Production access reduces the risk of unauthorized or untested changes being deployed directly.
    icon: icons/shield-alert.svg
  - text: DLP policies that match the environment's purpose prevent accidental data exposure - Development environments may need more flexibility, while Production needs strict controls.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Three environments configured
      text: 'Value: Three environments configured Contoso-Dev, Contoso-Test, Contoso-Prod.'
      icon: icons/check.svg
    - title: Developers work only in Contoso-Dev, solutions are promoted as managed to
      text: Developers work only in Contoso-Dev, solutions are promoted as managed to Contoso-Test, and after UAT sign-off, deployed as managed to Contoso-Prod.
      icon: icons/package.svg
    - title: DLP policies in Production block all non-approved connectors.
      text: DLP policies in Production block all non-approved connectors.
      icon: icons/lightbulb.svg
    bad:
    - title: A single environment used for development, testing, and production
      text: A single environment used for development, testing, and production simultaneously.
      icon: icons/circle-alert.svg
    - title: Developers making changes directly in the Production environment.
      text: Developers making changes directly in the Production environment.
      icon: icons/settings.svg
    - title: No DLP policies configured, allowing any connector to be used in Production.
      text: No DLP policies configured, allowing any connector to be used in Production.
      icon: icons/workflow.svg
  references:
  - title: Overview of ALM with Microsoft Power Platform - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/overview-alm
  - title: Environments overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/environments-overview
  - title: Data loss prevention policies - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/wp-data-loss-prevention
- id: ALM-002
  title: Always deploy managed solutions to Test, UAT, and Production environments.
  description: Always deploy managed solutions to Test, UAT, and Production environments. Reserve unmanaged solutions exclusively for Development.
  guidelines:
  - text: Export solutions as managed when deploying to any environment beyond Development.
    icon: icons/package.svg
  - text: Never import unmanaged solutions into Production or Test environments.
    icon: icons/check.svg
  - text: Use solution upgrades (not delete-and-reimport) to update managed solutions in target environments.
    icon: icons/lightbulb.svg
  - text: Keep the unmanaged (source) version of every solution in your Development environment and source control for future modifications.
    icon: icons/circle-alert.svg
  rationale:
  - text: Managed solutions lock components, preventing accidental modifications in Production that bypass your ALM process.
    icon: icons/workflow.svg
  - text: Unmanaged solutions do not clean up when removed - deleting an unmanaged solution leaves all its components behind, creating untracked customizations.
    icon: icons/circle-alert.svg
  - text: 'Managed solutions support clean uninstall: removing a managed solution removes all of its components, making rollback straightforward.'
    icon: icons/package.svg
  - text: The upgrade mechanism for managed solutions allows incremental updates while preserving data and removing deprecated components.
    icon: icons/database.svg
  examples:
    good:
    - title: Solution exported as managed from Dev and imported into Test for validation.
      text: Solution exported as managed from Dev and imported into Test for validation.
      icon: icons/check.svg
    - title: After UAT sign-off, the same managed solution is imported into Production.
      text: After UAT sign-off, the same managed solution is imported into Production.
      icon: icons/package.svg
    - title: An updated version is deployed using the Upgrade option, which removes
      text: An updated version is deployed using the Upgrade option, which removes deprecated components automatically.
      icon: icons/settings.svg
    bad:
    - title: An unmanaged solution imported into Production so a developer can "quickly fix
      text: 'Value: An unmanaged solution imported into Production so a developer can "quickly fix something."'
      icon: icons/lightbulb.svg
    - title: Deleting a managed solution and reimporting a new version instead of using the
      text: Deleting a managed solution and reimporting a new version instead of using the upgrade process, which causes data loss.
      icon: icons/database.svg
    - title: Customizations made directly in Production outside of any solution, creating
      text: Customizations made directly in Production outside of any solution, creating untracked changes.
      icon: icons/circle-alert.svg
  references:
  - title: Managed and unmanaged solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/solution-concepts-alm
  - title: Apply solution upgrade or update - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/update-solutions-alm
- id: ALM-003
  title: Create a dedicated solution publisher with a short, unique prefix and apply
  description: Create a dedicated solution publisher with a short, unique prefix and apply consistent naming conventions to all solutions.
  guidelines:
  - text: Use a publisher prefix of 3 to 5 lowercase characters that represents your organization or project (e.g., contoso, adw).
    icon: icons/pencil.svg
  - text: Never use the default publisher (CDS Default Publisher with prefix cr), as it is shared and cannot be changed later.
    icon: icons/circle-alert.svg
  - text: Use the same publisher across all environments (Dev, Test, Prod) to ensure consistency during deployments.
    icon: icons/check.svg
  - text: Name solutions clearly using a pattern like PublisherPrefixSolutionPurpose (e.g., ContosoSalesOperations).
    icon: icons/package.svg
  - text: Apply semantic versioning (Major.Minor.Build.Revision) to all solutions.
    icon: icons/lightbulb.svg
  rationale:
  - text: The publisher prefix is permanently prepended to all custom tables, columns, and components. Choosing a meaningful prefix avoids confusion and conflicts with other publishers or ISV solutions.
    icon: icons/database.svg
  - text: The default publisher is shared across the organization - using it means your components mix with others, making it impossible to distinguish ownership.
    icon: icons/users.svg
  - text: A consistent publisher across environments ensures that solution imports are recognized as updates rather than new solutions.
    icon: icons/package.svg
  - text: Semantic versioning provides a clear history of changes and makes it easy to identify which version is deployed in each environment.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Publisher
      text: 'Value: Publisher Contoso Ltd, prefix: contoso, deployed consistently in Dev, Test, and Prod.'
      icon: icons/pencil.svg
    - title: Solution name
      text: 'Value: Solution name Contoso_HROnboarding, version 1.2.0.0.'
      icon: icons/package.svg
    - title: All custom tables use the contoso prefix
      text: 'Value: All custom tables use the contoso prefix contosoEmployee, contoso_OnboardingTask.'
      icon: icons/database.svg
    bad:
    - title: Using the default CDS Default Publisher with prefix cr for production solutions.
      text: Using the default CDS Default Publisher with prefix cr for production solutions.
      icon: icons/lightbulb.svg
    - title: Publisher prefix mycompanyglobaltradingsolutions - too long, making schema
      text: Publisher prefix mycompanyglobaltradingsolutions - too long, making schema names unreadable.
      icon: icons/book-open.svg
    - title: Solution version left at 1.0.0.0 across all deployments with no version history.
      text: Solution version left at 1.0.0.0 across all deployments with no version history.
      icon: icons/check.svg
    - title: Different publishers used in Dev and Prod, causing import conflicts.
      text: Different publishers used in Dev and Prod, causing import conflicts.
      icon: icons/circle-alert.svg
  references:
  - title: Create a solution publisher - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-solution#create-a-solution-publisher
  - title: Solution publisher prefix - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/introduction-solutions#solution-publisher
- id: ALM-004
  title: Use environment variables to store configuration values that differ between
  description: Use environment variables to store configuration values that differ between environments instead of hardcoding them in apps, flows, or plugins.
  guidelines:
  - text: Create environment variables for URLs, feature flags, email addresses, thresholds, and any value that changes across Dev, Test, and Production.
    icon: icons/link.svg
  - text: Always add environment variables to your solution so they are transported with it during deployments.
    icon: icons/package.svg
  - text: Reference the environment variable in your apps and flows rather than typing the value directly.
    icon: icons/workflow.svg
  - text: Set environment-specific current values in each target environment after importing the solution.
    icon: icons/lightbulb.svg
  - text: Mark environment variables that hold secrets or sensitive data as the Secret data type.
    icon: icons/shield-alert.svg
  rationale:
  - text: Hardcoded values require editing the app or flow and republishing every time you move between environments, which is error-prone and breaks automation.
    icon: icons/workflow.svg
  - text: Environment variables allow the same solution to be deployed to multiple environments without modification - only the current value changes per environment.
    icon: icons/package.svg
  - text: Secret environment variables are encrypted and not displayed in the UI, providing a basic level of protection for sensitive configuration.
    icon: icons/shield-alert.svg
  - text: Including environment variables in the solution ensures they are tracked, versioned, and deployed together with the components that depend on them.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: Compliant code example
      code: |-
        // Environment variable: contoso_SharePointSiteUrl
        // Dev value:  https://contoso-dev.sharepoint.com/sites/hr
        // Test value: https://contoso-test.sharepoint.com/sites/hr
        // Prod value: https://contoso.sharepoint.com/sites/hr

        // In a Power Automate flow, the SharePoint action references
        // the environment variable instead of a hardcoded URL.
      language: Plain Text
    bad:
    - title: Non-compliant code example
      code: |-
        // URL hardcoded directly in a Power Automate flow action:
        // Site Address: https://contoso.sharepoint.com/sites/hr
        //
        // When deployed to Test, the flow still points to Production SharePoint,
        // causing test data to be written to the live site.
      language: Plain Text
    - title: Non-compliant code example
      code: |-
        // API key pasted directly into an HTTP action:
        // Authorization: Bearer sk-abc123secretkey
        //
        // The secret is visible to anyone who can edit the flow
        // and is exported with the solution in plain text.
      language: Plain Text
  references:
  - title: Environment variables overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables
  - title: Use environment variables in solutions - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables#use-environment-variables-in-solutions
- id: ALM-005
  title: Use connection references in solutions instead of embedding connections
  description: Use connection references in solutions instead of embedding connections directly, so that flows and apps can be rebound to environment-specific connections during deployment.
  guidelines:
  - text: Create connection references in your solution before building flows or apps that use connectors.
    icon: icons/workflow.svg
  - text: Reference the connection reference in every flow action and app data source instead of using a direct connection.
    icon: icons/database.svg
  - text: During managed solution import in a target environment, map each connection reference to an existing connection owned by a service account or appropriate user.
    icon: icons/link.svg
  - text: Use service principal connections for non-interactive flows to avoid dependency on individual user accounts.
    icon: icons/users.svg
  rationale:
  - text: Without connection references, imported flows fail because the embedded connection belongs to the developer's account, which does not exist or is not authorized in the target environment.
    icon: icons/shield-alert.svg
  - text: Connection references decouple the connector identity from the solution, allowing different credentials in Dev, Test, and Production.
    icon: icons/link.svg
  - text: Service principal connections ensure flows continue to run even when individual employees leave the organization or change roles.
    icon: icons/workflow.svg
  - text: Connection references are the only supported mechanism for ALM-friendly connector management in Power Platform solutions.
    icon: icons/package.svg
  examples:
    good:
    - title: A solution contains a connection reference contoso_SharePointConnection of type
      text: A solution contains a connection reference contoso_SharePointConnection of type SharePoint.
      icon: icons/link.svg
    - title: All flows in the solution use contoso_SharePointConnection for their SharePoint
      text: All flows in the solution use contoso_SharePointConnection for their SharePoint actions.
      icon: icons/workflow.svg
    - title: When importing to Production, the admin maps contoso_SharePointConnection to a
      text: When importing to Production, the admin maps contoso_SharePointConnection to a service account's SharePoint connection.
      icon: icons/lightbulb.svg
    bad:
    - title: A flow uses a direct connection tied to developer@contoso.com.
      text: A flow uses a direct connection tied to developer@contoso.com. When imported to Production, the flow fails because that user has no permissions in Production.
      icon: icons/shield-alert.svg
    - title: Multiple flows each create their own connection during import, resulting in
      text: Multiple flows each create their own connection during import, resulting in dozens of orphaned connections with no clear ownership.
      icon: icons/users.svg
    - title: A flow runs under a departing employee's connection.
      text: A flow runs under a departing employee's connection. When their account is disabled, all dependent flows stop working.
      icon: icons/check.svg
  references:
  - title: Connection references overview - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/create-connection-reference
  - title: Use service principal with connection references - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/power-automate-authentication#use-service-principal-based-authentication
- id: ALM-006
  title: Store all solution artifacts in source control (Git) to enable version history
  description: Store all solution artifacts in source control (Git) to enable version history, collaboration, code reviews, and automated pipelines.
  guidelines:
  - text: Use the Power Platform CLI (pac solution clone and pac solution unpack) to decompose solutions into source-friendly individual files.
    icon: icons/package.svg
  - text: Store the unpacked solution files in a Git repository (Azure DevOps or GitHub).
    icon: icons/folder-open.svg
  - text: Adopt a branching strategy (e.g., trunk-based development or GitFlow) suitable for your team size.
    icon: icons/database.svg
  - text: Require pull requests with peer review before merging changes to the main branch.
    icon: icons/eye.svg
  - text: Include all custom code (plugins, PCF controls, web resources) alongside the unpacked solution in the same repository.
    icon: icons/code-xml.svg
  rationale:
  - text: Without source control, there is no history of what changed, when, or by whom - making it impossible to audit, compare, or roll back changes.
    icon: icons/lightbulb.svg
  - text: Unpacking solutions into individual files makes diffs meaningful and enables line-level code reviews of configuration changes.
    icon: icons/code-xml.svg
  - text: Branching strategies allow multiple developers to work in parallel without overwriting each other's changes.
    icon: icons/check.svg
  - text: Pull request reviews catch issues before they are merged, improving solution quality and spreading knowledge across the team.
    icon: icons/users.svg
  examples:
    good:
    - title: Developer creates a feature branch, makes changes in Dev, exports and unpacks
      text: Developer creates a feature branch, makes changes in Dev, exports and unpacks the solution, commits, and opens a pull request.
      icon: icons/package.svg
    - title: A reviewer inspects the diff to verify only intended changes are included.
      text: A reviewer inspects the diff to verify only intended changes are included.
      icon: icons/check.svg
    - title: Compliant code example
      code: |-
        Repository structure:
        ├── src/
        │   └── ContosoHR/
        │       ├── Entities/
        │       │   ├── contoso_Employee/
        │       │   └── contoso_OnboardingTask/
        │       ├── Workflows/
        │       ├── CanvasApps/
        │       ├── PluginAssemblies/
        │       └── Solution.xml
        ├── pipelines/
        │   └── build-and-deploy.yml
        └── README.md
      language: Plain Text
    bad:
    - title: Solution .zip files emailed between team members or stored on a shared drive
      text: Solution .zip files emailed between team members or stored on a shared drive with names like Solutionv2final_FINAL.zip.
      icon: icons/pencil.svg
    - title: No version history - when something breaks, there is no way to determine what
      text: No version history - when something breaks, there is no way to determine what changed or revert to a previous state.
      icon: icons/lightbulb.svg
    - title: All developers working in the same Dev environment with no branching
      text: All developers working in the same Dev environment with no branching, overwriting each other's changes.
      icon: icons/circle-alert.svg
  references:
  - title: Source control with solution files - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/use-source-control-solution-files
  - title: Power Platform CLI - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/developer/cli/introduction
  - title: ALM developer guide - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/alm-for-developers
- id: ALM-007
  title: Automate solution export, packing, validation, and import using CI/CD pipelines
  description: Automate solution export, packing, validation, and import using CI/CD pipelines instead of performing manual deployments.
  guidelines:
  - text: Use Power Platform Build Tools for Azure DevOps or GitHub Actions for Power Platform to build your pipelines.
    icon: icons/workflow.svg
  - text: Use service principal authentication (not personal accounts) for pipeline connections to Power Platform environments.
    icon: icons/shield-alert.svg
  - text: 'Structure pipelines with distinct stages: Build (export, unpack, validate), Test (deploy managed to Test, run tests), and Release (deploy managed to Production with approvals).'
    icon: icons/check.svg
  - text: Include approval gates before Production deployments to enforce sign-off from stakeholders.
    icon: icons/package.svg
  - text: Store pipeline definitions in source control alongside your solution.
    icon: icons/lightbulb.svg
  rationale:
  - text: Manual deployments are error-prone - steps may be skipped, the wrong solution version may be imported, or environment variables may be misconfigured.
    icon: icons/workflow.svg
  - text: Automated pipelines ensure every deployment follows the same validated process, reducing human error and increasing reliability.
    icon: icons/check.svg
  - text: Service principals provide stable, auditable authentication that does not depend on individual user accounts or require interactive sign-in.
    icon: icons/shield-alert.svg
  - text: Approval gates enforce governance and prevent untested changes from reaching Production.
    icon: icons/lightbulb.svg
  examples:
    good:
    - title: stage
      text: 'Value: stage Build'
      icon: icons/workflow.svg
    - title: job
      text: 'Value: job ExportAndPack'
      icon: icons/lightbulb.svg
    - title: task
      text: 'Value: task PowerPlatformToolInstaller@2'
      icon: icons/check.svg
    - title: task
      text: 'Value: task PowerPlatformExportSolution@2'
      icon: icons/package.svg
    - title: task
      text: 'Value: task PowerPlatformChecker@2'
      icon: icons/circle-alert.svg
    - title: stage
      text: 'Value: stage DeployToTest'
      icon: icons/settings.svg
    - title: deployment
      text: 'Value: deployment DeployTest'
      icon: icons/database.svg
    - title: task
      text: 'Value: task PowerPlatformImportSolution@2'
      icon: icons/link.svg
    - title: stage
      text: 'Value: stage DeployToProd'
      icon: icons/users.svg
    - title: deployment
      text: 'Value: deployment DeployProd'
      icon: icons/file-text.svg
    - title: task
      text: 'Value: task PowerPlatformImportSolution@2'
      icon: icons/pencil.svg
    - title: Compliant code example
      code: |-
        # Azure DevOps pipeline (simplified)
        stages:
          - stage: Build
            jobs:
              - job: ExportAndPack
                steps:
                  - task: PowerPlatformToolInstaller@2
                  - task: PowerPlatformExportSolution@2
                    inputs:
                      SolutionName: ContosoHR
                      Managed: true
                  - task: PowerPlatformChecker@2
                    inputs:
                      FilesToAnalyze: '$(Build.ArtifactStagingDirectory)/*.zip'

          - stage: DeployToTest
            dependsOn: Build
            jobs:
              - deployment: DeployTest
                environment: Contoso-Test
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - task: PowerPlatformImportSolution@2
                          inputs:
                            SolutionInputFile: '$(Pipeline.Workspace)/**/ContosoHR_managed.zip'

          - stage: DeployToProd
            dependsOn: DeployToTest
            jobs:
              - deployment: DeployProd
                environment: Contoso-Prod  # has approval gate configured
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - task: PowerPlatformImportSolution@2
                          inputs:
                            SolutionInputFile: '$(Pipeline.Workspace)/**/ContosoHR_managed.zip'
      language: yaml
    bad:
    - title: A developer manually exports a solution from Dev, downloads the .zip, and
      text: A developer manually exports a solution from Dev, downloads the .zip, and imports it into Production from the browser.
      icon: icons/eye.svg
    - title: Pipeline authenticates using a developer's personal credentials - when the
      text: Pipeline authenticates using a developer's personal credentials - when the developer changes their password, all pipelines break.
      icon: icons/shield-alert.svg
    - title: No approval gates
      text: 'Value: No approval gates a pipeline automatically deploys to Production after a commit, with no human review.'
      icon: icons/book-open.svg
  references:
  - title: Power Platform Build Tools for Azure DevOps - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-build-tools
  - title: GitHub Actions for Power Platform - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-github-actions
  - title: Use service principal authentication - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/admin/create-users-assign-online-security-roles#create-an-application-user
- id: ALM-008
  title: Integrate the Power Platform Solution Checker into your CI/CD pipeline
  description: Integrate the Power Platform Solution Checker into your CI/CD pipeline to automatically validate solutions for best practice violations, performance issues, and security concerns before deployment.
  guidelines:
  - text: Add the Solution Checker task to your build pipeline and run it on every build or pull request.
    icon: icons/workflow.svg
  - text: Configure the pipeline to fail on critical or high-severity issues so that problematic solutions are not deployed.
    icon: icons/circle-alert.svg
  - text: Export checker reports as pipeline artifacts for audit and troubleshooting.
    icon: icons/check.svg
  - text: Review and resolve all warnings regularly, not just critical errors.
    icon: icons/eye.svg
  rationale:
  - text: The Solution Checker detects common problems - such as missing plugin registration steps, non-delegable queries, and accessibility violations - that are difficult to catch during manual review.
    icon: icons/workflow.svg
  - text: Running the checker automatically on every build ensures consistent quality enforcement without relying on individuals to remember to run it.
    icon: icons/check.svg
  - text: Failing the build on critical issues prevents known problems from reaching Test or Production environments.
    icon: icons/circle-alert.svg
  - text: Archived reports provide an audit trail showing the quality state of every deployed version.
    icon: icons/package.svg
  examples:
    good:
    - title: task
      text: 'Value: task PowerPlatformChecker@2'
      icon: icons/check.svg
    - title: Pipeline fails when a critical issue is detected, blocking deployment until the
      text: Pipeline fails when a critical issue is detected, blocking deployment until the issue is fixed.
      icon: icons/workflow.svg
    - title: Checker report is saved as a build artifact and reviewed by the team.
      text: Checker report is saved as a build artifact and reviewed by the team.
      icon: icons/users.svg
    - title: Compliant code example
      code: |-
        # Solution Checker step in Azure DevOps pipeline
        - task: PowerPlatformChecker@2
          inputs:
            PowerPlatformSPN: 'ServiceConnection'
            FilesToAnalyze: '$(Build.ArtifactStagingDirectory)/ContosoHR_managed.zip'
            RuleSet: 'Solution Checker'
            ErrorLevel: 'HighIssueCount'
            ErrorThreshold: '0'    # Fail on any high-severity issue
            FailOnPowerAppsCheckerAnalysis: true
      language: yaml
    bad:
    - title: Solution Checker is never run - issues are discovered by users in Production.
      text: Solution Checker is never run - issues are discovered by users in Production.
      icon: icons/circle-alert.svg
    - title: Checker is configured but its results are ignored - the pipeline always
      text: Checker is configured but its results are ignored - the pipeline always proceeds regardless of findings.
      icon: icons/settings.svg
    - title: Checker is only run manually by one team member before major releases, missing
      text: Checker is only run manually by one team member before major releases, missing issues in intermediate deployments.
      icon: icons/package.svg
  references:
  - title: Power Platform Checker - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/checker-api/overview
  - title: Use Solution Checker in pipelines - Microsoft Learn
    url: https://learn.microsoft.com/en-us/power-platform/alm/devops-build-tools#solution-checker
- id: ALM-009
  title: Apply semantic versioning to every solution and increment the version number
  description: Apply semantic versioning to every solution and increment the version number with each deployment to maintain a clear release history.
  guidelines:
  - text: Use the format Major.Minor.Build.Revision (e.g., 1.0.0.0).
    icon: icons/lightbulb.svg
  - text: Increment Major for breaking changes or large feature releases.
    icon: icons/package.svg
  - text: Increment Minor for new features that are backward-compatible.
    icon: icons/check.svg
  - text: Increment Build for bug fixes and patches.
    icon: icons/circle-alert.svg
  - text: Never deploy two different builds with the same version number.
    icon: icons/settings.svg
  - text: Automate version incrementing in your CI/CD pipeline to avoid manual mistakes.
    icon: icons/workflow.svg
  rationale:
  - text: Without versioning, there is no way to determine which version of a solution is deployed in a given environment or to compare differences between deployments.
    icon: icons/package.svg
  - text: Semantic versioning communicates the scope and risk of a change at a glance - a major version bump signals breaking changes, while a build increment signals a safe patch.
    icon: icons/circle-alert.svg
  - text: 'Unique version numbers per deployment enable rollback: if a deployment causes issues, you can identify exactly which version to revert to.'
    icon: icons/lightbulb.svg
  - text: Automated version incrementing eliminates the common mistake of forgetting to update the version, which can cause import failures or confusion.
    icon: icons/check.svg
  examples:
    good:
    - title: 1.0.0.0 - Initial release.
      text: 1.0.0.0 - Initial release.
      icon: icons/package.svg
